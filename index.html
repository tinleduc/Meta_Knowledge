."],"legal":false,"words":904},{"n":7,"title":"Lý thuyết trò chơi và đàm phán","en":"Game Theory and Negotiation","summary":"Lý thuyết trò chơi phân tích quyết định khi kết quả của bạn phụ thuộc vào lựa chọn của người khác, những người cũng đang tính toán như bạn. Nó giải thích vì sao các bên hợp lý có thể cùng đi tới kết quả tệ, như cuộc đua lãi suất huy động, và làm thế nào để thay đổi cấu trúc trò chơi để hợp tác. Đàm phán dựa trên lợi ích là ứng dụng thực tế nhất của tư duy này.","origin":"von Neumann và Morgenstern đặt nền móng năm 1944. John Nash định nghĩa cân bằng mang tên ông năm 1950 và nhận Nobel Kinh tế năm 1994. Trò chơi Thế lưỡng nan của người tù được Merrill Flood và Melvin Dresher tại RAND thử nghiệm năm 1950, Albert Tucker đặt tên và câu chuyện. Robert Axelrod tổ chức giải đấu máy tính và viết The Evolution of Cooperation (1984). Roger Fisher và William Ury tại Harvard giới thiệu đàm phán theo nguyên tắc và khái niệm BATNA trong Getting to Yes (1981).","concepts":[["Cân bằng Nash (Nash equilibrium)","Tổ hợp chiến lược mà không bên nào có lợi khi đơn phương thay đổi chiến lược của mình."],["Thế lưỡng nan của người tù (Prisoner's dilemma)","Trò chơi mà mỗi bên có động cơ phản bội, dẫn tới kết quả chung tệ hơn nếu cả hai hợp tác."],["Trò chơi lặp lại (Repeated game)","Khi tương tác lặp lại, danh tiếng và khả năng trả đũa có thể duy trì hợp tác."],["Ăn miếng trả miếng (Tit for tat)","Chiến lược hợp tác trước rồi làm theo nước đi trước của đối phương; thắng giải đấu của Axelrod."],["BATNA","Phương án thay thế tốt nhất nếu không đạt thỏa thuận; BATNA mạnh là nguồn sức mạnh đàm phán thực sự."]],"diagram":{"type":"matrix","items":["Cả hai hợp tác: mỗi bên được 3","A hợp tác, B phản bội: A được 0, B được 5","A phản bội, B hợp tác: A được 5, B được 0","Cả hai phản bội: mỗi bên được 1. Cân bằng Nash"],"caption":"Ma trận lợi ích của thế lưỡng nan người tù: phản bội là chiến lược trội của mỗi bên, dù cả hai hợp tác tốt hơn.","axes":{"x":["Chiến lược của B","Hợp tác","Phản bội"],"y":["Chiến lược của A","Phản bội","Hợp tác"]}},"model":"Muốn thoát thế lưỡng nan, phải thay đổi cấu trúc trò chơi chứ không chỉ kêu gọi hợp tác: làm cho tương tác lặp lại và minh bạch, thay đổi lợi ích bằng hợp đồng hoặc quy định, hoặc tạo cơ chế cam kết đáng tin.","steps":["Xác định các bên, chiến lược khả dĩ và lợi ích của từng bên.","Vẽ ma trận lợi ích hoặc cây trò chơi nếu có thứ tự hành động.","Tìm cân bằng và xem nó có phải kết quả tốt cho các bên không.","Tìm cách thay đổi trò chơi: thêm bên, đổi lợi ích, đổi luật, đổi thông tin.","Trong đàm phán, xác định BATNA của mình và ước lượng BATNA của đối tác.","Tách con người khỏi vấn đề, tập trung vào lợi ích thay vì lập trường, tạo phương án cùng có lợi."],"apps":[["Đàm phán gia hạn hợp đồng với nhà cung cấp phần mềm","Nhà cung cấp đề xuất tăng phí bảo trì 20%. Nhóm mua sắm chuẩn bị BATNA bằng cách đánh giá chi phí chuyển đổi sang giải pháp thay thế và khả năng tự vận hành một phần. Đàm phán tập trung vào lợi ích: nhà cung cấp cần doanh thu ổn định, ngân hàng cần SLA tốt hơn. Kết quả là hợp đồng dài hạn hơn với mức tăng thấp hơn và SLA chặt hơn."],["Phối hợp giữa các phòng ban dùng chung tài nguyên","Hai đội cùng cần môi trường kiểm thử. Mỗi đội có động cơ chiếm lịch sớm, dẫn tới cả hai bị chậm. Thay đổi trò chơi bằng lịch dùng chung minh bạch, ưu tiên theo mốc phát hành và cơ chế trao đổi lịch biến tương tác thành trò chơi lặp lại có danh tiếng."]],"pitfalls":["Coi mọi tương tác là trò chơi tổng bằng không, bỏ lỡ phương án cùng có lợi.","Đàm phán mà không biết BATNA của mình.","Kêu gọi hợp tác mà không thay đổi cấu trúc lợi ích."],"links":[["1.3","Bi kịch tài nguyên chung là một dạng thế lưỡng nan nhiều bên"],["5.2","Quản trị doanh nghiệp định hình luật chơi giữa các bên"],["4.1","Nền tảng lý thuyết lựa chọn hợp lý"]],"quiz":[["Trong thế lưỡng nan người tù, cân bằng Nash là gì?",["Cả hai hợp tác","Cả hai phản bội","Một bên hợp tác, một bên phản bội","Không có cân bằng"],1,"Phản bội là chiến lược trội, dù kết quả chung tệ hơn hợp tác."],["BATNA là gì?",["Mức giá cao nhất","Phương án thay thế tốt nhất nếu không đạt thỏa thuận","Thỏa thuận tốt nhất có thể","Điều khoản bắt buộc"],1,"Best Alternative To a Negotiated Agreement."],["Chiến lược nào thắng giải đấu của Axelrod?",["Luôn phản bội","Luôn hợp tác","Ăn miếng trả miếng","Ngẫu nhiên"],2,"Tit for tat đơn giản, dễ hiểu, biết tha thứ và biết trả đũa."]],"refs":["Nash, J. F. (1950). Equilibrium Points in n-Person Games. Proceedings of the National Academy of Sciences, 36(1).","Axelrod, R. (1984). The Evolution of Cooperation. Basic Books.","Fisher, R. & Ury, W. (1981). Getting to Yes: Negotiating Agreement Without Giving In. Houghton Mifflin."],"legal":false,"words":888},{"n":8,"title":"Quyết định nhóm, nhiễu và vệ sinh quyết định","en":"Group Decisions, Noise and Decision Hygiene","summary":"Quyết định trong tổ chức hiếm khi do một người đưa ra. Nhóm có thể thông minh hơn cá nhân nếu ý kiến được thu thập độc lập, nhưng cũng có thể tệ hơn do tư duy nhóm và hiệu ứng lan truyền. Bên cạnh thiên kiến, nhiễu, tức sự biến thiên không mong muốn giữa các đánh giá lẽ ra phải giống nhau, là nguồn sai số lớn nhưng ít được chú ý. Vệ sinh quyết định là tập hợp thực hành giảm cả hai.","origin":"Irving Janis mô tả tư duy nhóm trong Victims of Groupthink (1972), phân tích vụ Vịnh Con Lợn. Francis Galton (1907) quan sát trung bình dự đoán của đám đông về cân nặng con bò rất gần giá trị thật; James Surowiecki phổ biến ý tưởng này trong The Wisdom of Crowds (2004). Phương pháp Delphi được RAND phát triển thập niên 1950. Gary Klein giới thiệu kỹ thuật tiền khám nghiệm trên HBR năm 2007. Kahneman, Olivier Sibony và Cass Sunstein xuất bản Noise năm 2021.","concepts":[["Tư duy nhóm (Groupthink)","Nhóm gắn kết ưu tiên đồng thuận hơn đánh giá thực tế, dẫn tới bỏ qua cảnh báo và phương án khác."],["Nhiễu (Noise)","Biến thiên không mong muốn giữa các đánh giá của những người khác nhau hoặc cùng một người ở thời điểm khác nhau cho cùng một trường hợp."],["Kiểm toán nhiễu (Noise audit)","Cho nhiều người đánh giá cùng các trường hợp rồi đo mức độ khác biệt."],["Tiền khám nghiệm (Premortem)","Giả định dự án đã thất bại sau một năm và yêu cầu mỗi người viết lý do thất bại, giúp nêu rủi ro mà không sợ bị coi là tiêu cực."],["Phương pháp Delphi (Delphi method)","Nhiều vòng thu thập ý kiến chuyên gia ẩn danh có phản hồi tổng hợp, giảm ảnh hưởng của người có vị thế."],["Đánh giá trung gian (Mediating assessments)","Chia quyết định thành các tiêu chí đánh giá độc lập trước khi đưa ra kết luận tổng thể."]],"diagram":{"type":"flow","items":["Đánh giá độc lập trước khi thảo luận","Chia thành tiêu chí trung gian","Tổng hợp có cấu trúc","Tiền khám nghiệm","Quyết định và ghi nhật ký"],"caption":"Quy trình vệ sinh quyết định cho hội đồng hoặc nhóm."},"model":"Quy tắc đơn giản nhưng hiệu quả nhất: thu thập ý kiến độc lập trước khi thảo luận và cho người có vị thế thấp nhất phát biểu trước. Nếu người có vị thế cao nói trước, các ý kiến sau thường bị kéo về phía đó.","steps":["Xác định loại quyết định lặp lại cần chuẩn hóa như thẩm định, tuyển dụng, đánh giá nhà cung cấp.","Làm kiểm toán nhiễu nhỏ để đo mức khác biệt hiện tại.","Xây thang đánh giá có mốc mô tả cụ thể cho từng tiêu chí.","Yêu cầu thành viên chấm độc lập trước buổi họp.","Thảo luận tập trung vào các điểm khác biệt lớn, dùng tiền khám nghiệm cho quyết định quan trọng.","Ghi nhật ký quyết định và rà soát định kỳ so với kết quả."],"apps":[["Giảm nhiễu trong phê duyệt tín dụng doanh nghiệp nhỏ","Kiểm toán nhiễu giả lập cho thấy cùng một hồ sơ, các chuyên viên đề xuất hạn mức chênh nhau tới hai lần. Ngân hàng áp dụng thang đánh giá có mốc mô tả và chấm độc lập theo tiêu chí trung gian trước khi tổng hợp. Biến thiên giảm rõ rệt. Đánh đổi: chuyên viên cảm thấy mất bớt quyền tự quyết, cần giải thích lý do."],["Tiền khám nghiệm trước khi khởi động dự án","Trước khi phê duyệt dự án chuyển đổi, nhà tài trợ yêu cầu nhóm dành 30 phút viết lý do dự án thất bại. Nhiều rủi ro chưa từng được nêu trong họp xuất hiện, như phụ thuộc vào một chuyên gia sắp nghỉ hưu hay xung đột lịch với đợt khóa sổ cuối năm. Kế hoạch được điều chỉnh trước khi khởi động."]],"pitfalls":["Thảo luận trước rồi mới hỏi ý kiến từng người.","Để người có vị thế cao nhất phát biểu đầu tiên.","Nhầm đồng thuận nhanh với quyết định tốt."],"links":[["4.2","Thiên kiến là sai lệch hệ thống, nhiễu là biến thiên ngẫu nhiên"],["4.4","Chấm điểm đa tiêu chí độc lập"],["6.6","Nhật ký quyết định và bài học rút ra"]],"quiz":[["Theo Kahneman, Sibony và Sunstein, nhiễu khác thiên kiến thế nào?",["Nhiễu là sai lệch hệ thống, thiên kiến là ngẫu nhiên","Nhiễu là biến thiên không mong muốn giữa các đánh giá, thiên kiến là sai lệch có hướng","Hai khái niệm là một","Nhiễu chỉ có trong máy móc"],1,"Thiên kiến lệch về một phía; nhiễu phân tán các đánh giá."],["Kỹ thuật tiền khám nghiệm yêu cầu nhóm làm gì?",["Phân tích dự án đã thất bại trong quá khứ","Giả định dự án đã thất bại và viết lý do","Kiểm tra sức khỏe thành viên","Đo hiệu suất sau dự án"],1,"Premortem của Gary Klein giúp nêu rủi ro mà không bị coi là tiêu cực."],["Điều kiện quan trọng nhất để trí tuệ đám đông hiệu quả là gì?",["Mọi người thảo luận kỹ trước","Ý kiến được thu thập độc lập và đa dạng","Chỉ hỏi chuyên gia","Có trưởng nhóm mạnh"],1,"Tính độc lập giúp các sai số triệt tiêu nhau."]],"refs":["Kahneman, D., Sibony, O. & Sunstein, C. R. (2021). Noise: A Flaw in Human Judgment. Little, Brown Spark.","Janis, I. L. (1972). Victims of Groupthink. Houghton Mifflin.","Klein, G. (2007). Performing a Project Premortem. Harvard Business Review, 85(9)."],"legal":false,"words":929}]},{"id":5,"code":"VIII.5","title":"Ethics","vi":"Đạo đức học ứng dụng","color":"#9C3D3D","colorDark":"#E08A8A","intro":"Các lý thuyết đạo đức và khung thực hành giúp nhận diện, lập luận và hành động đúng trong kinh doanh, dữ liệu, AI, nghiên cứu và nghề nghiệp, đặt trong bối cảnh ngân hàng Việt Nam.","question":"Điều gì hợp pháp chưa chắc đã đúng, vậy lấy gì làm chuẩn?","chapters":[{"n":1,"title":"Các lý thuyết đạo đức chuẩn tắc","en":"Normative Ethical Theories","summary":"Đạo đức học chuẩn tắc trả lời câu hỏi nên làm gì và vì sao. Bốn truyền thống lớn là đạo đức nghĩa vụ tập trung vào nguyên tắc, hệ quả luận tập trung vào kết quả, đạo đức đức hạnh tập trung vào tính cách, và đạo đức chăm sóc tập trung vào quan hệ. Không lý thuyết nào đủ cho mọi tình huống; người ra quyết định trưởng thành biết dùng chúng như các lăng kính bổ sung cho nhau.","origin":"Aristotle trình bày đạo đức đức hạnh trong Đạo đức học Nicomachean vào thế kỷ 4 trước Công nguyên. Immanuel Kant viết Nền tảng siêu hình học về đạo đức (1785), đưa ra mệnh lệnh tuyệt đối. Jeremy Bentham (1789) và John Stuart Mill (Utilitarianism, 1863) phát triển chủ nghĩa công lợi. Carol Gilligan (In a Different Voice, 1982) và Nel Noddings (1984) khởi xướng đạo đức chăm sóc. John Rawls viết A Theory of Justice (1971) với ý tưởng tấm màn vô minh.","concepts":[["Đạo đức nghĩa vụ (Deontology)","Đúng sai phụ thuộc vào việc tuân thủ nguyên tắc và nghĩa vụ, không chỉ vào kết quả. Kant yêu cầu đối xử với con người luôn như mục đích, không bao giờ chỉ như phương tiện."],["Hệ quả luận và công lợi (Consequentialism and utilitarianism)","Hành động đúng là hành động tạo ra kết quả tốt nhất cho số đông; đòi hỏi tính đến mọi bên chịu ảnh hưởng."],["Đạo đức đức hạnh (Virtue ethics)","Câu hỏi trung tâm là một người có phẩm chất tốt như trung thực, can đảm, công bằng sẽ làm gì trong tình huống này."],["Đạo đức chăm sóc (Ethics of care)","Nhấn mạnh trách nhiệm trong các mối quan hệ cụ thể và sự chú ý tới người dễ bị tổn thương."],["Tấm màn vô minh (Veil of ignorance)","Rawls đề xuất chọn nguyên tắc công bằng như thể không biết mình sẽ ở vị trí nào trong xã hội."]],"diagram":{"type":"hub","items":["Câu hỏi đạo đức","Nghĩa vụ: nguyên tắc nào áp dụng?","Hệ quả: ai được, ai mất, bao nhiêu?","Đức hạnh: người tốt sẽ làm gì?","Chăm sóc: ai dễ bị tổn thương?","Công bằng: có chấp nhận nếu ở vị trí người khác?"],"caption":"Năm lăng kính đạo đức dùng bổ sung cho nhau khi xem xét một tình huống."},"model":"Khi các lăng kính cùng chỉ về một hướng, quyết định tương đối rõ. Khi chúng mâu thuẫn, như kết quả tốt cho đa số nhưng vi phạm quyền của một nhóm nhỏ, đó là dấu hiệu cần thảo luận rộng hơn và có thể cần cấp thẩm quyền cao hơn.","steps":["Mô tả tình huống và các bên chịu ảnh hưởng.","Áp dụng lăng kính nghĩa vụ: có quy tắc, cam kết, quyền nào liên quan?","Áp dụng lăng kính hệ quả: liệt kê lợi ích và tổn hại cho từng bên.","Áp dụng lăng kính đức hạnh và chăm sóc: hành động này thể hiện con người và tổ chức thế nào?","Kiểm tra bằng tấm màn vô minh: có chấp nhận quyết định nếu mình là bên yếu thế?","Ghi lại lập luận và chọn phương án hài hòa nhất giữa các lăng kính."],"apps":[["Tự động hóa và cắt giảm vị trí","Dự án tự động hóa xử lý hồ sơ giúp tiết kiệm chi phí đáng kể, một lập luận hệ quả mạnh. Lăng kính chăm sóc và công bằng đặt câu hỏi về nhân viên bị ảnh hưởng. Phương án hài hòa là lộ trình chuyển đổi, đào tạo lại và thông báo minh bạch. Đánh đổi: chi phí chuyển đổi làm giảm một phần lợi ích ngắn hạn."],["Thu phí dịch vụ với khách hàng lớn tuổi","Một khoản phí hợp lệ và đã công bố, nhưng nhiều khách hàng lớn tuổi không hiểu vì sao bị thu. Lăng kính nghĩa vụ cho rằng đã đủ minh bạch về hình thức; lăng kính chăm sóc cho rằng cần giải thích chủ động cho nhóm dễ tổn thương. Đây là điểm nối sang chương về rủi ro hành vi."]],"pitfalls":["Chọn lý thuyết phù hợp với kết luận mình muốn sau khi đã quyết định.","Coi hợp pháp là đủ đạo đức.","Chỉ tính hệ quả tài chính, bỏ qua tổn hại khó định lượng như niềm tin."],"links":[["5.7","Chuyển lý thuyết thành quy trình ra quyết định"],["4.1","Công lợi gần với tối đa hóa độ hữu dụng kỳ vọng"],["5.8","Chăm sóc khách hàng dễ bị tổn thương"]],"quiz":[["Nguyên tắc đối xử với con người luôn như mục đích, không chỉ như phương tiện thuộc về lý thuyết nào?",["Công lợi","Đạo đức nghĩa vụ của Kant","Đạo đức đức hạnh","Đạo đức chăm sóc"],1,"Đây là một cách phát biểu mệnh lệnh tuyệt đối của Kant."],["Tấm màn vô minh là ý tưởng của ai?",["Mill","Rawls","Aristotle","Gilligan"],1,"John Rawls trong A Theory of Justice năm 1971."],["Khi các lăng kính đạo đức mâu thuẫn nhau, nên làm gì?",["Chọn lăng kính có lợi nhất","Thảo luận rộng hơn và có thể đưa lên cấp thẩm quyền cao hơn","Bỏ qua vấn đề","Chọn ngẫu nhiên"],1,"Mâu thuẫn là tín hiệu tình huống cần cân nhắc kỹ hơn."]],"refs":["Kant, I. (1785). Grundlegung zur Metaphysik der Sitten (Groundwork of the Metaphysics of Morals).","Mill, J. S. (1863). Utilitarianism. Parker, Son and Bourn.","Rawls, J. (1971). A Theory of Justice. Harvard University Press; Gilligan, C. (1982). In a Different Voice. Harvard University Press."],"legal":false,"words":913},{"n":2,"title":"Đạo đức kinh doanh và quản trị doanh nghiệp","en":"Business Ethics and Corporate Governance","summary":"Đạo đức kinh doanh hỏi doanh nghiệp có trách nhiệm với ai và tới mức nào. Quản trị doanh nghiệp là hệ thống quy tắc, quan hệ và cơ chế kiểm soát để trách nhiệm đó được thực thi. Với ngân hàng, một tổ chức nhận tiền gửi của công chúng và hoạt động dựa trên niềm tin, quản trị tốt không chỉ là yêu cầu tuân thủ mà là điều kiện tồn tại.","origin":"Milton Friedman lập luận năm 1970 trên New York Times Magazine rằng trách nhiệm xã hội của doanh nghiệp là tăng lợi nhuận trong khuôn khổ luật chơi. R. Edward Freeman đưa ra lý thuyết các bên liên quan năm 1984. Archie Carroll đề xuất tháp trách nhiệm xã hội bốn tầng năm 1991. Báo cáo Cadbury (1992) tại Anh định hình quản trị hiện đại. Bộ Nguyên tắc Quản trị Công ty G20/OECD được ban hành năm 2015 và sửa đổi năm 2023. IIA công bố Mô hình Ba tuyến năm 2020.","concepts":[["Lý thuyết cổ đông (Shareholder theory)","Mục tiêu chính của doanh nghiệp là tạo giá trị cho cổ đông trong khuôn khổ pháp luật và chuẩn mực."],["Lý thuyết các bên liên quan (Stakeholder theory)","Doanh nghiệp phải cân bằng lợi ích của khách hàng, nhân viên, nhà cung cấp, cộng đồng, cơ quan quản lý và cổ đông."],["Tháp trách nhiệm xã hội (CSR pyramid)","Carroll xếp bốn tầng: kinh tế, pháp lý, đạo đức và từ thiện; tầng dưới là nền cho tầng trên."],["Mô hình Ba tuyến (Three Lines Model)","Tuyến một quản lý rủi ro trong hoạt động kinh doanh, tuyến hai giám sát rủi ro và tuân thủ, kiểm toán nội bộ độc lập là tuyến ba."],["Vấn đề người đại diện (Agency problem)","Xung đột khi người quản lý có động cơ khác với chủ sở hữu hoặc các bên họ phục vụ."]],"diagram":{"type":"layers","items":["Từ thiện: đóng góp cho cộng đồng","Đạo đức: làm điều đúng, công bằng, tránh gây hại","Pháp lý: tuân thủ pháp luật và quy định","Kinh tế: có lãi để tồn tại và phát triển"],"caption":"Tháp trách nhiệm xã hội của Carroll (1991)."},"model":"Carroll nhấn mạnh các tầng không phải lựa chọn thay thế mà là đồng thời. Tầng đạo đức đặc biệt quan trọng trong ngân hàng vì quy định luôn đi sau đổi mới sản phẩm, và khoảng trống đó chỉ được lấp bằng chuẩn mực đạo đức của chính tổ chức.","steps":["Lập bản đồ các bên liên quan và lợi ích chính của từng bên với quyết định.","Xác định bên nào chịu rủi ro mà không có tiếng nói trong quyết định.","Kiểm tra quyết định ở cả bốn tầng của tháp trách nhiệm.","Xác định vai trò của từng tuyến trong mô hình Ba tuyến đối với rủi ro liên quan.","Kiểm tra xung đột lợi ích và cơ chế công bố.","Báo cáo minh bạch lên cấp quản trị phù hợp."],"apps":[["Thiết kế cơ chế thưởng cho kênh bán","Cơ chế thưởng chỉ dựa trên doanh số tạo vấn đề người đại diện: nhân viên có động cơ bán sản phẩm không phù hợp. Quản trị tốt đòi hỏi thêm chỉ số chất lượng như tỷ lệ khiếu nại và hủy hợp đồng sớm vào công thức thưởng. Đánh đổi: doanh số ngắn hạn có thể giảm."],["Vai trò của BA và PMO trong mô hình Ba tuyến","Đội dự án công nghệ thuộc tuyến một: tự nhận diện và quản lý rủi ro trong yêu cầu và thiết kế. Khối quản lý rủi ro và tuân thủ là tuyến hai, rà soát các thay đổi có ảnh hưởng lớn. Hiểu rõ vai trò giúp BA đưa yêu cầu kiểm soát vào BRD từ đầu thay vì chờ tuyến hai phát hiện."]],"pitfalls":["Coi quản trị doanh nghiệp là việc riêng của hội đồng quản trị.","Thiết kế KPI mà không kiểm tra động cơ lệch lạc có thể phát sinh.","Tách rời đạo đức với chiến lược, coi đạo đức là chi phí."],"links":[["1.8","Luật chơi và mục tiêu là điểm đòn bẩy cao"],["5.8","Rủi ro hành vi từ cơ chế khuyến khích"],["4.7","Quản trị như thiết kế luật chơi giữa các bên"]],"quiz":[["Tầng dưới cùng trong tháp trách nhiệm xã hội của Carroll là gì?",["Từ thiện","Đạo đức","Pháp lý","Kinh tế"],3,"Doanh nghiệp phải có lãi để tồn tại, là nền cho các trách nhiệm khác."],["Trong mô hình Ba tuyến của IIA, kiểm toán nội bộ đóng vai trò gì?",["Tuyến một","Tuyến hai","Tuyến ba, đảm bảo độc lập","Không thuộc mô hình"],2,"Kiểm toán nội bộ cung cấp đảm bảo độc lập cho cơ quan quản trị."],["Ai đưa ra lý thuyết các bên liên quan năm 1984?",["Milton Friedman","R. Edward Freeman","Archie Carroll","Adrian Cadbury"],1,"Freeman trong Strategic Management: A Stakeholder Approach."]],"refs":["Freeman, R. E. (1984). Strategic Management: A Stakeholder Approach. Pitman.","Carroll, A. B. (1991). The Pyramid of Corporate Social Responsibility. Business Horizons, 34(4).","OECD (2023). G20/OECD Principles of Corporate Governance 2023; IIA (2020). The IIA's Three Lines Model."],"legal":false,"words":850},{"n":3,"title":"Đạo đức dữ liệu và quyền riêng tư","en":"Data Ethics and Privacy","summary":"Ngân hàng nắm giữ một trong những kho dữ liệu cá nhân nhạy cảm nhất: giao dịch, thu nhập, quan hệ, vị trí. Đạo đức dữ liệu hỏi không chỉ có được phép dùng dữ liệu hay không, mà còn có nên dùng không, dùng thế nào để không phản bội kỳ vọng hợp lý của người có dữ liệu. Khung pháp lý Việt Nam về dữ liệu cá nhân đã thay đổi đáng kể trong giai đoạn 2023–2026.","origin":"Bộ Hướng dẫn về Bảo vệ Quyền riêng tư của OECD năm 1980 đặt ra các nguyên tắc thực hành thông tin công bằng. Helen Nissenbaum đề xuất lý thuyết tính toàn vẹn ngữ cảnh năm 2004 và phát triển trong Privacy in Context (2010). Ann Cavoukian đưa ra bảy nguyên tắc bảo vệ quyền riêng tư từ thiết kế. GDPR của Liên minh châu Âu được thông qua năm 2016, áp dụng từ 2018. Tại Việt Nam, Nghị định 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân có hiệu lực từ 1/7/2023; Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 được thông qua năm 2025 và có hiệu lực từ 1/1/2026. Các mốc pháp lý cần được đối chiếu với văn bản gốc.","concepts":[["Tính toàn vẹn ngữ cảnh (Contextual integrity)","Luồng dữ liệu phù hợp khi tuân theo chuẩn mực của ngữ cảnh nơi dữ liệu được chia sẻ; dữ liệu giao dịch cung cấp để thanh toán không mặc nhiên phù hợp cho quảng cáo."],["Giới hạn mục đích (Purpose limitation)","Dữ liệu chỉ được xử lý cho mục đích đã xác định và thông báo, không dùng cho mục đích không tương thích."],["Tối thiểu hóa dữ liệu (Data minimization)","Chỉ thu thập và giữ dữ liệu thực sự cần thiết cho mục đích."],["Bảo vệ quyền riêng tư từ thiết kế (Privacy by design)","Đưa bảo vệ dữ liệu vào kiến trúc và quy trình ngay từ đầu, là thiết lập mặc định chứ không phải tùy chọn bổ sung."],["Dữ liệu cá nhân nhạy cảm (Sensitive personal data)","Nhóm dữ liệu được bảo vệ ở mức cao hơn theo quy định, như sức khỏe, tài chính, sinh trắc học, vị trí; cần đối chiếu danh mục theo văn bản hiện hành."],["Đánh giá tác động xử lý dữ liệu (Data protection impact assessment)","Đánh giá rủi ro với chủ thể dữ liệu trước khi triển khai hoạt động xử lý, là yêu cầu trong nhiều khung pháp lý."]],"diagram":{"type":"flow","items":["Thu thập: có căn cứ, thông báo rõ","Lưu trữ: phân loại, mã hóa, phân quyền","Sử dụng: đúng mục đích đã nêu","Chia sẻ: kiểm soát bên thứ ba","Lưu giữ và xóa: đúng thời hạn"],"caption":"Vòng đời dữ liệu cá nhân và câu hỏi đạo đức ở mỗi bước."},"model":"Câu hỏi kiểm tra đơn giản theo tính toàn vẹn ngữ cảnh: nếu khách hàng biết chính xác dữ liệu của họ được dùng thế nào, họ có ngạc nhiên hay cảm thấy bị phản bội không? Nếu có, luồng dữ liệu đó cần được xem xét lại dù về mặt kỹ thuật có thể đã có sự đồng ý.","steps":["Lập danh mục dữ liệu cá nhân mà sáng kiến sẽ xử lý và phân loại mức nhạy cảm.","Xác định căn cứ pháp lý và mục đích cho từng loại dữ liệu.","Đánh giá tính toàn vẹn ngữ cảnh: luồng dữ liệu có đúng kỳ vọng hợp lý của khách hàng?","Áp dụng tối thiểu hóa, ẩn danh hóa hoặc bí danh hóa khi có thể.","Thực hiện đánh giá tác động theo yêu cầu quy định hiện hành và phối hợp với bộ phận pháp chế.","Thiết kế quy trình thực hiện quyền của chủ thể dữ liệu và xóa dữ liệu khi hết mục đích."],"apps":[["Dùng dữ liệu giao dịch để gợi ý sản phẩm","Nhóm phân tích muốn dùng lịch sử giao dịch để gợi ý khoản vay. Về kỹ thuật dữ liệu đã có, nhưng việc suy luận khó khăn tài chính từ giao dịch rồi chào vay có thể vượt kỳ vọng khách hàng và nhạy cảm theo quy định. Phương án tốt hơn là cho khách hàng lựa chọn tham gia rõ ràng và loại trừ các suy luận nhạy cảm. Đánh đổi: tỷ lệ tiếp cận thấp hơn."],["Dữ liệu thật trong môi trường kiểm thử","Dự án cần dữ liệu thực tế để kiểm thử UAT. Sao chép dữ liệu sản xuất vào môi trường kiểm thử vi phạm tối thiểu hóa và tăng rủi ro rò rỉ. Giải pháp là che dữ liệu hoặc tạo dữ liệu tổng hợp, được đưa vào yêu cầu phi chức năng của BRD ngay từ đầu."]],"pitfalls":["Coi dấu tích đồng ý trong điều khoản dài là đủ cho mọi mục đích sử dụng.","Giữ dữ liệu vô thời hạn vì có thể sẽ hữu ích.","Dùng dữ liệu sản xuất chưa che trong môi trường phát triển và kiểm thử."],"links":[["5.4","Dữ liệu là đầu vào của hệ thống AI"],["6.8","Phân loại dữ liệu trước khi đưa vào hệ thống RAG"],["2.4","Kết nối dữ liệu nhiều nguồn làm tăng rủi ro suy luận"]],"quiz":[["Theo Nissenbaum, luồng dữ liệu phù hợp khi nào?",["Khi có sự đồng ý bằng văn bản","Khi tuân theo chuẩn mực của ngữ cảnh nơi dữ liệu được chia sẻ","Khi dữ liệu đã mã hóa","Khi có lợi cho doanh nghiệp"],1,"Tính toàn vẹn ngữ cảnh đặt trọng tâm vào chuẩn mực của ngữ cảnh."],["Nguyên tắc nào bị vi phạm khi sao chép toàn bộ dữ liệu khách hàng thật vào môi trường kiểm thử?",["Minh bạch","Tối thiểu hóa dữ liệu","Chính xác","Trách nhiệm giải trình"],1,"Môi trường kiểm thử không cần dữ liệu cá nhân thật."],["Nghị định 13/2023/NĐ-CP điều chỉnh vấn đề gì?",["An ninh mạng","Bảo vệ dữ liệu cá nhân","Giao dịch điện tử","Phòng chống rửa tiền"],1,"Đây là văn bản chuyên ngành đầu tiên về bảo vệ dữ liệu cá nhân tại Việt Nam, có hiệu lực từ 1/7/2023."]],"refs":["Nissenbaum, H. (2010). Privacy in Context: Technology, Policy, and the Integrity of Social Life. Stanford University Press.","OECD (1980, sửa đổi 2013). Guidelines on the Protection of Privacy and Transborder Flows of Personal Data.","Chính phủ Việt Nam (2023). Nghị định 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân; Quốc hội (2025). Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15. Cần đối chiếu văn bản gốc và hướng dẫn thi hành."],"legal":true,"words":1084},{"n":4,"title":"Đạo đức trí tuệ nhân tạo","en":"AI Ethics","summary":"Hệ thống AI đưa ra hoặc hỗ trợ quyết định ở quy mô lớn, nên sai sót và thiên lệch cũng được nhân lên ở quy mô lớn. Đạo đức AI chuyển các nguyên tắc chung như công bằng, minh bạch và trách nhiệm giải trình thành yêu cầu cụ thể cho vòng đời mô hình. Với ngân hàng, các ứng dụng như chấm điểm tín dụng, phát hiện gian lận và trợ lý khách hàng đều nằm trong vùng rủi ro cần quản trị chặt.","origin":"Luciano Floridi và Josh Cowls tổng hợp năm nguyên tắc chung năm 2019: có lợi, không gây hại, tự chủ, công bằng và khả năng giải thích. OECD ban hành Nguyên tắc AI năm 2019, cập nhật năm 2024. NIST công bố Khung quản lý rủi ro AI phiên bản 1.0 năm 2023. Đạo luật AI của EU có hiệu lực từ 2024 với cách tiếp cận theo mức rủi ro. Jon Kleinberg và cộng sự (2016) cùng Alexandra Chouldechova (2017) chứng minh các tiêu chí công bằng thống kê nhìn chung không thể đồng thời thỏa mãn. Tại Việt Nam, Luật Trí tuệ nhân tạo, được tổ chức ghi nhận là Luật số 134/2025, là khung pháp lý cần theo dõi; chi tiết cần đối chiếu văn bản chính thức.","concepts":[["Công bằng thuật toán (Algorithmic fairness)","Các tiêu chí đo mức đối xử công bằng giữa các nhóm như cân bằng tỷ lệ chấp thuận, cân bằng tỷ lệ sai hoặc hiệu chỉnh xác suất."],["Định lý bất khả công bằng (Fairness impossibility)","Khi tỷ lệ nền khác nhau giữa các nhóm, không thể đồng thời đạt hiệu chỉnh và cân bằng tỷ lệ sai; phải chọn và giải trình."],["Khả năng giải thích (Explainability)","Khả năng đưa ra lý do dễ hiểu cho một kết quả của mô hình, cần thiết cho khách hàng bị từ chối và cho người kiểm soát."],["Con người trong vòng lặp (Human in the loop)","Thiết kế để con người có thẩm quyền và năng lực thực sự kiểm tra, sửa hoặc bác bỏ kết quả của AI."],["Tiếp cận theo mức rủi ro (Risk-based approach)","Mức kiểm soát tương xứng với mức rủi ro của ứng dụng: chấm điểm tín dụng rủi ro cao hơn gợi ý bài viết."],["Ảo giác mô hình (Hallucination)","Mô hình ngôn ngữ tạo ra nội dung nghe hợp lý nhưng sai hoặc không có căn cứ."]],"diagram":{"type":"cycle","items":["Map: xác định bối cảnh và rủi ro","Measure: đo lường và kiểm thử","Manage: xử lý và giám sát rủi ro"],"caption":"Khung NIST AI RMF 1.0: Govern là chức năng xuyên suốt ở trung tâm, ba chức năng còn lại lặp theo vòng đời hệ thống.","center":"Govern: quản trị xuyên suốt"},"model":"Govern gồm chính sách, vai trò, trách nhiệm và văn hóa. Map xác định mục đích sử dụng, các bên bị ảnh hưởng và rủi ro. Measure dùng chỉ số định lượng và định tính để đánh giá. Manage ưu tiên và xử lý rủi ro, bao gồm quyết định không triển khai nếu rủi ro không chấp nhận được.","steps":["Phân loại ứng dụng AI theo mức rủi ro dựa trên tác động tới khách hàng và nhân viên.","Xác định các nhóm có thể bị ảnh hưởng khác nhau và chọn tiêu chí công bằng phù hợp, có giải trình.","Kiểm tra dữ liệu huấn luyện về tính đại diện và thiên lệch lịch sử.","Đánh giá mô hình theo từng nhóm, không chỉ độ chính xác tổng.","Thiết kế cơ chế giải thích, khiếu nại và can thiệp của con người.","Giám sát sau triển khai, gồm trôi dữ liệu và thay đổi hiệu suất theo nhóm."],"apps":[["Mô hình chấm điểm tín dụng tiêu dùng","Mô hình có độ chính xác tổng cao nhưng tỷ lệ từ chối nhầm ở nhóm khách hàng trẻ, ít lịch sử tín dụng cao gấp đôi. Ngân hàng phải chọn tiêu chí công bằng, bổ sung dữ liệu thay thế có căn cứ và có quy trình xem xét lại thủ công cho hồ sơ gần ngưỡng. Đánh đổi: tăng chi phí vận hành và có thể giảm nhẹ độ chính xác tổng."],["Trợ lý AI nội bộ trả lời về quy trình","Trợ lý dùng mô hình ngôn ngữ có thể trả lời sai về hạn mức phê duyệt, gây rủi ro tuân thủ. Kiểm soát gồm chỉ trả lời dựa trên tài liệu được quản trị và có trích dẫn, gắn nhãn rõ đây là nội dung AI tạo, đo tỷ lệ trả lời sai định kỳ và có kênh báo lỗi. Người dùng vẫn chịu trách nhiệm kiểm tra nguồn."]],"pitfalls":["Chỉ đo độ chính xác tổng mà không đo theo nhóm.","Đặt con người trong vòng lặp nhưng không cho họ thời gian, thông tin hay thẩm quyền để bác bỏ AI.","Coi đạo đức AI là việc của đội dữ liệu thay vì trách nhiệm chung có người chịu trách nhiệm rõ ràng."],"links":[["5.3","Dữ liệu cá nhân trong huấn luyện và vận hành AI"],["6.8","Kiến trúc trợ lý tri thức có căn cứ"],["4.5","Tỷ lệ nền và báo động giả trong mô hình phát hiện"]],"quiz":[["Trong khung NIST AI RMF, chức năng nào xuyên suốt các chức năng còn lại?",["Map","Measure","Manage","Govern"],3,"Govern thiết lập chính sách, vai trò và văn hóa cho toàn bộ vòng đời."],["Định lý bất khả công bằng cho thấy điều gì?",["AI luôn thiên lệch","Khi tỷ lệ nền khác nhau giữa các nhóm, không thể thỏa mãn đồng thời mọi tiêu chí công bằng thống kê","Công bằng là không thể đo","Chỉ cần xóa biến nhạy cảm"],1,"Kleinberg và cộng sự, Chouldechova chứng minh sự đánh đổi này."],["Con người trong vòng lặp chỉ có ý nghĩa khi nào?",["Khi có người ký duyệt","Khi người đó có thời gian, thông tin và thẩm quyền thực sự để bác bỏ AI","Khi AI sai","Khi có quy định"],1,"Nếu không, đó chỉ là đóng dấu hình thức cho quyết định của máy."]],"refs":["Floridi, L. & Cowls, J. (2019). A Unified Framework of Five Principles for AI in Society. Harvard Data Science Review, 1(1).","NIST (2023). Artificial Intelligence Risk Management Framework (AI RMF 1.0). NIST AI 100-1.","Chouldechova, A. (2017). Fair Prediction with Disparate Impact. Big Data, 5(2); Liên minh châu Âu (2024). Regulation (EU) 2024/1689 (AI Act). Văn bản pháp luật Việt Nam về AI cần đối chiếu bản chính thức."],"legal":true,"words":1077},{"n":5,"title":"Đạo đức nghiên cứu","en":"Research Ethics","summary":"Đạo đức nghiên cứu bảo vệ những người tham gia nghiên cứu khỏi bị tổn hại hoặc bị lợi dụng. Dù thường gắn với y sinh học, các nguyên tắc này áp dụng trực tiếp cho công việc hàng ngày trong tổ chức: phỏng vấn người dùng, khảo sát nhân viên, thử nghiệm A/B trên khách hàng và phân tích dữ liệu hành vi. Câu hỏi then chốt là người tham gia có thực sự hiểu và tự nguyện không.","origin":"Bộ luật Nuremberg (1947) ra đời sau các thí nghiệm phi nhân tính thời Thế chiến thứ hai, đặt đồng ý tự nguyện làm nguyên tắc tuyệt đối. Tuyên bố Helsinki của Hiệp hội Y khoa Thế giới được ban hành năm 1964 và sửa đổi nhiều lần. Nghiên cứu giang mai Tuskegee tại Mỹ kéo dài 1932–1972 dẫn tới Báo cáo Belmont năm 1979 với ba nguyên tắc: tôn trọng con người, hữu ích và công bằng. Năm 2014, nghiên cứu lan truyền cảm xúc trên Facebook gây tranh luận lớn về đồng ý trong thử nghiệm trực tuyến.","concepts":[["Đồng ý có hiểu biết (Informed consent)","Người tham gia được thông tin đầy đủ về mục đích, rủi ro, lợi ích, quyền rút lui và tự nguyện đồng ý."],["Tôn trọng con người (Respect for persons)","Đối xử với cá nhân như chủ thể tự chủ và bảo vệ thêm những người có năng lực tự chủ hạn chế."],["Hữu ích (Beneficence)","Không gây hại, tối đa hóa lợi ích và giảm thiểu tổn hại có thể có."],["Công bằng trong nghiên cứu (Justice in research)","Phân bổ công bằng gánh nặng và lợi ích của nghiên cứu, không chọn nhóm dễ tiếp cận hay dễ bị tổn thương chỉ vì tiện."],["Hội đồng đạo đức (Ethics review board)","Cơ quan độc lập xem xét rủi ro và biện pháp bảo vệ trước khi nghiên cứu bắt đầu."]],"diagram":{"type":"hub","items":["Nghiên cứu có con người tham gia","Tôn trọng con người","Hữu ích","Công bằng","Đồng ý có hiểu biết","Bảo mật dữ liệu người tham gia"],"caption":"Ba nguyên tắc của Báo cáo Belmont và hai thực hành thường gặp."},"model":"Mối quan hệ quyền lực là rủi ro đặc thù trong tổ chức: nhân viên được quản lý mời phỏng vấn có thể thấy khó từ chối, khách hàng cần khoản vay có thể đồng ý mọi điều kiện. Thiết kế nghiên cứu nội bộ cần tính tới điều này.","steps":["Xác định nghiên cứu có liên quan tới con người, dữ liệu hành vi hay can thiệp nào không.","Đánh giá rủi ro với người tham gia: tâm lý, tài chính, danh tiếng, quyền riêng tư.","Soạn thông tin đồng ý ngắn gọn, dễ hiểu, nêu rõ quyền từ chối và rút lui.","Giảm tác động của quan hệ quyền lực, như nhờ người trung lập thực hiện phỏng vấn.","Ẩn danh hoặc bí danh hóa dữ liệu, giới hạn người được truy cập.","Với thử nghiệm trên khách hàng, nhờ bộ phận pháp chế, tuân thủ hoặc hội đồng phù hợp xem xét."],"apps":[["Khảo sát nhân viên về văn hóa làm việc","Bộ phận nhân sự muốn khảo sát ẩn danh, nhưng với đơn vị nhỏ và câu hỏi về vị trí, thâm niên, danh tính có thể bị suy ra. Giải pháp là gộp nhóm nhân khẩu học, chỉ báo cáo khi nhóm đủ lớn và thông báo rõ ai được xem dữ liệu thô. Đánh đổi: mất một phần chi tiết phân tích."],["Thử nghiệm A/B về mức phí hiển thị","Nhóm sản phẩm muốn thử hiển thị phí theo hai cách khác nhau để xem cách nào tăng chuyển đổi. Nếu một cách làm khách hàng hiểu sai tổng chi phí, thử nghiệm gây hại thực và có thể vi phạm quy định bảo vệ người tiêu dùng. Nguyên tắc: chỉ thử nghiệm các phương án đều đạt chuẩn minh bạch."]],"pitfalls":["Coi thử nghiệm A/B là cải tiến sản phẩm nên không cần cân nhắc đạo đức.","Gọi khảo sát là ẩn danh khi dữ liệu có thể suy ra danh tính.","Dùng dữ liệu thu thập cho nghiên cứu vào đánh giá cá nhân."],"links":[["3.2","Thiết kế thực nghiệm và thử nghiệm A/B"],["3.3","Phỏng vấn và dữ liệu định tính"],["5.3","Bảo vệ dữ liệu của người tham gia"]],"quiz":[["Ba nguyên tắc của Báo cáo Belmont là gì?",["Minh bạch, trách nhiệm, bảo mật","Tôn trọng con người, hữu ích, công bằng","Tự do, bình đẳng, bác ái","Hiệu quả, hiệu lực, kinh tế"],1,"Báo cáo Belmont năm 1979 đặt ba nguyên tắc này."],["Vì sao khảo sát ẩn danh ở đơn vị nhỏ vẫn có rủi ro?",["Vì tốn chi phí","Vì danh tính có thể bị suy ra từ thông tin nhân khẩu học","Vì người tham gia không trung thực","Vì phần mềm lỗi"],1,"Kết hợp vị trí, thâm niên, giới tính trong nhóm nhỏ có thể xác định cá nhân."],["Văn bản nào ra đời năm 1947 đặt đồng ý tự nguyện làm nguyên tắc tuyệt đối?",["Tuyên bố Helsinki","Bộ luật Nuremberg","Báo cáo Belmont","GDPR"],1,"Bộ luật Nuremberg ra đời sau phiên tòa xét xử các bác sĩ."]],"refs":["National Commission for the Protection of Human Subjects (1979). The Belmont Report.","World Medical Association (1964, sửa đổi nhiều lần). Declaration of Helsinki.","Kramer, A. D. I., Guillory, J. E. & Hancock, J. T. (2014). Experimental Evidence of Massive-Scale Emotional Contagion through Social Networks. PNAS, 111(24)."],"legal":false,"words":912},{"n":6,"title":"Chuẩn mực đạo đức nghề nghiệp","en":"Professional Codes of Ethics","summary":"Các hiệp hội nghề nghiệp như IIBA cho phân tích nghiệp vụ, PMI cho quản lý dự án, ISACA cho kiểm soát công nghệ thông tin và ACM cho điện toán đều ban hành bộ chuẩn mực đạo đức. Các bộ chuẩn mực này chuyển giá trị chung thành hành vi cụ thể trong nghề và cung cấp căn cứ để người hành nghề từ chối yêu cầu không phù hợp một cách chuyên nghiệp.","origin":"PMI ban hành Code of Ethics and Professional Conduct năm 2006 với bốn giá trị: trách nhiệm, tôn trọng, công bằng và trung thực, mỗi giá trị có tiêu chuẩn mong muốn và tiêu chuẩn bắt buộc. IIBA ban hành Code of Ethical Conduct and Professional Standards cho người hành nghề phân tích nghiệp vụ. ISACA có Code of Professional Ethics cho thành viên và người giữ chứng chỉ. ACM cập nhật Code of Ethics and Professional Conduct năm 2018, nhấn mạnh trách nhiệm với xã hội và tránh gây hại.","concepts":[["Trách nhiệm (Responsibility)","Nhận quyền sở hữu với quyết định, hành động và hệ quả, kể cả khi sai sót."],["Trung thực (Honesty)","Hiểu và truyền đạt sự thật, như không che giấu rủi ro dự án hay báo cáo tiến độ đẹp hơn thực tế."],["Công bằng (Fairness)","Ra quyết định khách quan, công bố và tránh xung đột lợi ích."],["Xung đột lợi ích (Conflict of interest)","Tình huống lợi ích cá nhân có thể ảnh hưởng tới phán đoán nghề nghiệp, như quan hệ với nhà cung cấp đang tham gia đánh giá."],["Năng lực chuyên môn (Professional competence)","Chỉ nhận việc trong phạm vi năng lực và liên tục duy trì, cập nhật kiến thức."]],"diagram":{"type":"hub","items":["Người hành nghề chuyên nghiệp","Trách nhiệm","Tôn trọng","Công bằng","Trung thực"],"caption":"Bốn giá trị cốt lõi trong Bộ chuẩn mực đạo đức của PMI, cũng xuất hiện dưới nhiều hình thức trong chuẩn mực IIBA, ISACA và ACM."},"model":"Áp lực lớn nhất với BA và PMO thường không phải gian lận rõ ràng mà là các tình huống xám: làm đẹp báo cáo trạng thái, im lặng về rủi ro để giữ hòa khí, hay viết yêu cầu theo ý người có vị thế cao dù biết không phục vụ người dùng. Bộ chuẩn mực giúp gọi tên và có căn cứ để lên tiếng.","steps":["Nhận diện giá trị nào đang bị thử thách trong tình huống.","Tra cứu tiêu chuẩn bắt buộc và tiêu chuẩn mong muốn liên quan trong bộ chuẩn mực nghề.","Công bố xung đột lợi ích tiềm năng ngay khi nhận ra.","Trao đổi trực tiếp với người liên quan trước khi leo thang.","Leo thang theo kênh chính thức của tổ chức nếu vấn đề không được giải quyết.","Ghi lại sự việc và lập luận của mình một cách khách quan."],"apps":[["Báo cáo trạng thái dự án","Nhà tài trợ đề nghị PMO giữ trạng thái xanh trong báo cáo lên ban điều hành dù dự án đang trễ hai tuần trên đường găng. Theo giá trị trung thực, PMO báo cáo đúng trạng thái kèm kế hoạch khắc phục. Cách làm chuyên nghiệp là trao đổi trước với nhà tài trợ để không gây bất ngờ. Đánh đổi: có thể gây căng thẳng ngắn hạn."],["Tham gia hội đồng đánh giá nhà cung cấp","Một thành viên hội đồng có người thân làm việc tại một nhà cung cấp dự thầu. Chuẩn mực yêu cầu công bố xung đột lợi ích và rút khỏi phần đánh giá liên quan. Việc này bảo vệ cả cá nhân lẫn tính hợp lệ của quyết định mua sắm."]],"pitfalls":["Coi bộ chuẩn mực là văn bản treo tường, không dùng trong quyết định hàng ngày.","Im lặng về rủi ro vì sợ bị coi là tiêu cực.","Không công bố xung đột lợi ích vì tin mình vẫn khách quan."],"links":[["5.7","Quy trình ra quyết định khi gặp tình huống khó"],["4.4","Đánh giá nhà cung cấp minh bạch"],["6.4","Cộng đồng thực hành giúp lan tỏa chuẩn mực nghề"]],"quiz":[["Bốn giá trị trong Bộ chuẩn mực đạo đức của PMI là gì?",["Chất lượng, chi phí, thời gian, phạm vi","Trách nhiệm, tôn trọng, công bằng, trung thực","Minh bạch, bảo mật, hiệu quả, sáng tạo","Lãnh đạo, hợp tác, đổi mới, kỷ luật"],1,"PMI Code of Ethics and Professional Conduct năm 2006."],["Khi có người thân làm tại một nhà cung cấp đang được đánh giá, nên làm gì?",["Tiếp tục đánh giá khách quan","Công bố xung đột lợi ích và rút khỏi phần đánh giá liên quan","Chấm điểm thấp cho nhà cung cấp đó","Không nói gì"],1,"Công bố và rút lui bảo vệ tính hợp lệ của quyết định."],["ACM cập nhật bộ chuẩn mực đạo đức vào năm nào?",["1992","2006","2018","2023"],2,"Phiên bản 2018 thay thế bản năm 1992."]],"refs":["Project Management Institute (2006). PMI Code of Ethics and Professional Conduct.","International Institute of Business Analysis. IIBA Code of Ethical Conduct and Professional Standards.","ACM (2018). ACM Code of Ethics and Professional Conduct; ISACA. Code of Professional Ethics."],"legal":false,"words":854},{"n":7,"title":"Khung ra quyết định đạo đức","en":"Ethical Decision-Making Frameworks","summary":"Biết lý thuyết đạo đức chưa đủ để hành động đúng. Khung ra quyết định đạo đức cung cấp quy trình từng bước để đi từ nhận ra có vấn đề tới hành động và suy ngẫm. Mô hình bốn thành phần của Rest giải thích vì sao người biết điều đúng vẫn không làm: có thể họ không nhận ra vấn đề, lập luận sai, thiếu động lực hoặc thiếu can đảm thực hiện.","origin":"James Rest đề xuất mô hình bốn thành phần năm 1986 dựa trên nghiên cứu tâm lý đạo đức. Thomas Jones (1991) bổ sung khái niệm cường độ đạo đức, cho thấy mức độ nghiêm trọng và gần gũi của hệ quả ảnh hưởng tới việc người ta có nhận ra vấn đề không. Trung tâm Đạo đức Ứng dụng Markkula tại Đại học Santa Clara phát triển khung năm bước được dùng rộng rãi trong đào tạo doanh nghiệp. Mary Gentile phát triển chương trình Giving Voice to Values (2010), tập trung vào kỹ năng lên tiếng.","concepts":[["Nhạy cảm đạo đức (Moral sensitivity)","Khả năng nhận ra tình huống có khía cạnh đạo đức và ai sẽ bị ảnh hưởng."],["Phán đoán đạo đức (Moral judgment)","Lập luận để xác định hành động nào là đúng."],["Động lực đạo đức (Moral motivation)","Ưu tiên giá trị đạo đức hơn các giá trị khác như thăng tiến hay hòa khí."],["Tính cách đạo đức (Moral character)","Can đảm và kiên trì để thực hiện hành động đúng dù gặp áp lực."],["Phép thử công khai (Publicity test)","Tự hỏi mình có thoải mái nếu quyết định và lý do được đăng công khai hoặc trình bày trước người bị ảnh hưởng."],["Lên tiếng vì giá trị (Giving voice to values)","Chuẩn bị trước cách nói và hành động khi đã biết điều đúng, thay vì chỉ tranh luận điều gì là đúng."]],"diagram":{"type":"flow","items":["Nhận diện vấn đề đạo đức","Thu thập sự kiện","Đánh giá phương án qua các lăng kính","Chọn và kiểm tra phương án","Hành động và suy ngẫm"],"caption":"Năm bước ra quyết định đạo đức theo khung của Trung tâm Markkula."},"model":"Ở bước kiểm tra, ba câu hỏi hữu ích: phương án này có được người tôi tôn trọng chấp nhận không, tôi có thoải mái giải thích nó với người bị ảnh hưởng không, và nếu mọi người trong vị trí tôi làm như vậy thì tổ chức sẽ ra sao.","steps":["Dừng lại khi có cảm giác không ổn và gọi tên vấn đề.","Thu thập sự kiện, phân biệt điều biết chắc và điều giả định.","Xác định các bên liên quan và lợi ích của họ.","Liệt kê ít nhất ba phương án, không chỉ làm hay không làm.","Đánh giá qua các lăng kính và các phép thử, chọn phương án.","Chuẩn bị cách trình bày, hành động, rồi suy ngẫm về kết quả để học."],"apps":[["Yêu cầu bỏ bước kiểm soát để kịp hạn","Gần hạn phát hành, trưởng nhóm đề nghị bỏ qua bước kiểm thử bảo mật vì tính năng nhỏ. BA nhận ra đây là vấn đề đạo đức vì rủi ro rơi vào khách hàng. Các phương án gồm phát hành đúng hạn không kiểm thử, lùi hạn, hoặc phát hành với tính năng tắt mặc định và kiểm thử trong tuần kế tiếp. Phương án thứ ba cân bằng được các lợi ích."],["Chuẩn bị lên tiếng trong cuộc họp","Một chuyên viên biết con số trong bản trình bày lên ban điều hành đã được làm tròn theo hướng có lợi. Theo Giving Voice to Values, chị chuẩn bị trước câu nói tập trung vào mục tiêu chung, như muốn ban điều hành có số liệu chính xác để quyết định, và đề xuất sửa cụ thể. Đánh đổi: rủi ro quan hệ ngắn hạn, lợi ích là uy tín và chất lượng quyết định."]],"pitfalls":["Chỉ cân nhắc hai phương án cực đoan.","Nhầm cảm giác khó chịu về xung đột với cảm giác không ổn về đạo đức.","Không suy ngẫm sau hành động, bỏ lỡ cơ hội học."],"links":[["5.1","Các lăng kính đạo đức dùng ở bước đánh giá"],["5.6","Chuẩn mực nghề làm căn cứ cho phán đoán"],["4.8","Tiền khám nghiệm cũng giúp nêu rủi ro đạo đức"]],"quiz":[["Theo mô hình bốn thành phần của Rest, người biết điều đúng nhưng không làm vì sợ áp lực đang thiếu thành phần nào?",["Nhạy cảm đạo đức","Phán đoán đạo đức","Tính cách đạo đức","Kiến thức pháp luật"],2,"Tính cách đạo đức là can đảm và kiên trì thực hiện."],["Bước đầu tiên trong khung năm bước của Markkula là gì?",["Thu thập sự kiện","Nhận diện vấn đề đạo đức","Hành động","Đánh giá phương án"],1,"Không nhận ra vấn đề thì các bước sau không diễn ra."],["Giving Voice to Values tập trung vào điều gì?",["Tranh luận triết học","Kỹ năng lên tiếng và hành động khi đã biết điều đúng","Viết quy định","Đo lường đạo đức"],1,"Mary Gentile chuyển trọng tâm từ biết sang làm."]],"refs":["Rest, J. R. (1986). Moral Development: Advances in Research and Theory. Praeger.","Markkula Center for Applied Ethics. A Framework for Ethical Decision Making. Santa Clara University.","Gentile, M. C. (2010). Giving Voice to Values: How to Speak Your Mind When You Know What's Right. Yale University Press."],"legal":false,"words":897},{"n":8,"title":"Rủi ro hành vi và bảo vệ người tiêu dùng tài chính","en":"Conduct Risk and Financial Consumer Protection","summary":"Rủi ro hành vi là rủi ro tổ chức hoặc nhân viên hành xử gây kết quả không công bằng cho khách hàng hoặc làm tổn hại tính toàn vẹn thị trường. Các vụ bán sai sản phẩm tại nhiều thị trường cho thấy tổn thất về tiền phạt, bồi hoàn và niềm tin có thể vượt xa lợi nhuận thu được. Tại Việt Nam, bảo vệ người tiêu dùng tài chính và việc bán chéo bảo hiểm qua ngân hàng đã trở thành trọng tâm quản lý.","origin":"G20 thông qua Nguyên tắc cấp cao về Bảo vệ người tiêu dùng tài chính do OECD soạn thảo năm 2011, cập nhật năm 2022. Cơ quan Quản lý Hành vi Tài chính Anh (FCA) được thành lập năm 2013 với trọng tâm hành vi. Vụ bán sai bảo hiểm bảo vệ khoản vay (PPI) tại Anh buộc các ngân hàng bồi hoàn hàng chục tỷ bảng. Năm 2016, Wells Fargo bị phạt vì nhân viên mở hàng triệu tài khoản không được khách hàng cho phép dưới áp lực chỉ tiêu. Tại Việt Nam, Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15 có hiệu lực từ 1/7/2024; Luật Các tổ chức tín dụng số 32/2024/QH15 và Thông tư 67/2023/TT-BTC có các quy định liên quan tới bán bảo hiểm qua ngân hàng. Chi tiết cần đối chiếu văn bản gốc.","concepts":[["Rủi ro hành vi (Conduct risk)","Rủi ro phát sinh từ cách tổ chức và nhân viên đối xử với khách hàng và thị trường."],["Bán sai sản phẩm (Mis-selling)","Bán sản phẩm không phù hợp với nhu cầu, khả năng hoặc mức hiểu biết của khách hàng, hoặc bán kèm không tự nguyện."],["Quản trị sản phẩm (Product governance)","Kiểm soát xuyên suốt vòng đời sản phẩm: thiết kế cho thị trường mục tiêu, kênh phân phối phù hợp, giám sát kết quả với khách hàng."],["Khách hàng dễ bị tổn thương (Vulnerable customer)","Khách hàng do hoàn cảnh cá nhân như tuổi tác, sức khỏe, hiểu biết tài chính hạn chế nên dễ chịu thiệt hại hơn."],["Kết quả công bằng cho khách hàng (Fair customer outcomes)","Thước đo cuối cùng của hành vi là khách hàng có nhận được giá trị tương xứng và hiểu đúng sản phẩm không, không chỉ quy trình có được tuân thủ hình thức không."]],"diagram":{"type":"flow","items":["Thiết kế sản phẩm cho thị trường mục tiêu","Chọn kênh và cơ chế thưởng","Tư vấn và bán","Hậu mãi và xử lý khiếu nại","Giám sát kết quả khách hàng"],"caption":"Vòng đời sản phẩm và các điểm kiểm soát rủi ro hành vi."},"model":"Điểm kiểm soát bị bỏ qua nhiều nhất là cơ chế thưởng. Khi thưởng chỉ gắn với doanh số, quy trình tư vấn chặt đến đâu cũng bị áp lực bào mòn dần. Đây chính là nguyên mẫu Mục tiêu bị bào mòn trong tư duy hệ thống.","steps":["Xác định thị trường mục tiêu và nhóm khách hàng không phù hợp cho từng sản phẩm.","Rà soát cơ chế thưởng của kênh bán, bổ sung chỉ số chất lượng.","Thiết kế quy trình tư vấn có bước kiểm tra mức độ hiểu của khách hàng.","Tách bạch rõ sản phẩm bắt buộc và tự nguyện, không điều kiện hóa dịch vụ ngân hàng với sản phẩm tự nguyện.","Giám sát chỉ số sớm như hủy hợp đồng trong thời gian cân nhắc, khiếu nại, tỷ lệ bán theo nhân viên bất thường.","Phân tích nguyên nhân gốc của khiếu nại và điều chỉnh sản phẩm hoặc quy trình."],"apps":[["Bán chéo bảo hiểm tại quầy giao dịch","Chỉ tiêu bán bảo hiểm theo từng giao dịch viên khiến một số trường hợp bảo hiểm được giới thiệu như điều kiện để giải ngân khoản vay. Quản trị tốt yêu cầu tách tư vấn bảo hiểm khỏi quy trình tín dụng, ghi nhận xác nhận tự nguyện, gọi điện xác nhận sau bán và giám sát tỷ lệ hủy. Đánh đổi: doanh thu phí giảm trong ngắn hạn, nhưng giảm rủi ro pháp lý và danh tiếng."],["Yêu cầu hệ thống cho bảo vệ người tiêu dùng","Khi xây dựng hệ thống bán hàng mới, BA đưa vào yêu cầu: hiển thị tổng chi phí trước khi xác nhận, lưu bằng chứng tư vấn, cảnh báo khi khách hàng thuộc nhóm cần chú ý đặc biệt, báo cáo chỉ số hành vi cho tuyến hai. Đưa từ đầu rẻ hơn nhiều so với bổ sung sau khi có yêu cầu từ cơ quan quản lý."]],"pitfalls":["Đo tuân thủ bằng việc có đủ chữ ký thay vì bằng kết quả khách hàng.","Coi khiếu nại là chi phí vận hành thay vì tín hiệu về sản phẩm và hành vi.","Thiết kế chỉ tiêu bán mà không đánh giá động cơ lệch lạc có thể phát sinh."],"links":[["1.3","Nguyên mẫu Mục tiêu bị bào mòn giải thích cơ chế"],["5.2","Quản trị doanh nghiệp và cơ chế thưởng"],["3.6","Đánh giá tác động của thay đổi chính sách bán hàng"]],"quiz":[["Vụ Wells Fargo năm 2016 liên quan tới hành vi nào?",["Rửa tiền","Nhân viên mở tài khoản không được khách hàng cho phép dưới áp lực chỉ tiêu","Lỗi hệ thống","Gian lận kế toán"],1,"Áp lực chỉ tiêu bán chéo là nguyên nhân cốt lõi."],["Thước đo cuối cùng của rủi ro hành vi là gì?",["Số chữ ký trên hồ sơ","Kết quả công bằng cho khách hàng","Doanh số","Số buổi đào tạo"],1,"Tuân thủ hình thức chưa đảm bảo khách hàng được đối xử công bằng."],["Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15 có hiệu lực từ khi nào?",["1/1/2023","1/7/2023","1/7/2024","1/1/2026"],2,"Luật có hiệu lực từ 1/7/2024; cần đối chiếu văn bản gốc khi áp dụng."]],"refs":["OECD (2011, cập nhật 2022). G20 High-Level Principles on Financial Consumer Protection.","Financial Conduct Authority (UK). Tài liệu về rủi ro hành vi và Consumer Duty.","Quốc hội Việt Nam (2023). Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15; Quốc hội (2024). Luật Các tổ chức tín dụng số 32/2024/QH15; Bộ Tài chính (2023). Thông tư 67/2023/TT-BTC. Cần đối chiếu văn bản gốc."],"legal":true,"words":1034}]},{"id":6,"code":"VIII.6","title":"Knowledge Management","vi":"Quản trị tri thức","color":"#4F6F2F","colorDark":"#9CC27A","intro":"Cách tổ chức tạo ra, lưu giữ, chia sẻ và tái sử dụng tri thức, từ tri thức ngầm trong đầu chuyên gia tới kho tài liệu và trợ lý AI dựa trên tri thức doanh nghiệp.","question":"Tổ chức biết gì mà không biết rằng mình biết, và sẽ mất gì khi một người nghỉ việc?","chapters":[{"n":1,"title":"Tháp DIKW: dữ liệu, thông tin, tri thức, trí tuệ","en":"The DIKW Hierarchy","summary":"Tháp DIKW phân biệt bốn cấp: dữ liệu là ký hiệu thô, thông tin là dữ liệu có ngữ cảnh, tri thức là thông tin được hiểu và có thể dùng để hành động, trí tuệ là khả năng phán đoán điều gì nên làm. Mô hình đơn giản này giúp tránh nhầm lẫn phổ biến rằng có nhiều dữ liệu và báo cáo nghĩa là tổ chức có nhiều tri thức.","origin":"Russell Ackoff phổ biến mô hình trong bài phát biểu và bài báo From Data to Wisdom năm 1989, với năm cấp gồm cả hiểu biết. Milan Zeleny và Harlan Cleveland cũng đề xuất các phiên bản tương tự trong thập niên 1980. Ý tưởng về chuỗi thông tin, tri thức, trí tuệ đã xuất hiện trong văn học trước đó. Jennifer Rowley (2007) tổng hợp các định nghĩa và chỉ ra mô hình được dùng rộng rãi nhưng ít được kiểm chứng. Nhiều nhà nghiên cứu phê phán tính tuyến tính của tháp.","concepts":[["Dữ liệu (Data)","Ký hiệu, con số, sự kiện thô chưa có ngữ cảnh, như một giá trị 1.250.000 trong một cột."],["Thông tin (Information)","Dữ liệu được tổ chức và đặt trong ngữ cảnh để trả lời ai, cái gì, khi nào, ở đâu, như số dư 1.250.000 đồng của tài khoản X ngày Y."],["Tri thức (Knowledge)","Thông tin được tích hợp với kinh nghiệm để trả lời như thế nào, cho phép hành động, như biết khi nào một biến động số dư là dấu hiệu rủi ro."],["Trí tuệ (Wisdom)","Khả năng phán đoán điều gì nên làm và vì sao, cân nhắc giá trị và hệ quả dài hạn."],["Siêu dữ liệu (Metadata)","Dữ liệu mô tả dữ liệu như nguồn, định nghĩa, chủ sở hữu, thời điểm cập nhật; là cầu nối từ dữ liệu sang thông tin."]],"diagram":{"type":"layers","items":["Trí tuệ: nên làm gì và vì sao","Tri thức: làm thế nào","Thông tin: ai, cái gì, khi nào, ở đâu","Dữ liệu: ký hiệu và sự kiện thô"],"caption":"Tháp DIKW: đi lên là tăng ngữ cảnh, ý nghĩa và giá trị cho hành động."},"model":"Hạn chế của tháp là gợi ý quá trình tuyến tính một chiều. Trong thực tế, tri thức quyết định dữ liệu nào đáng thu thập và cách diễn giải chúng. Một nhà phân tích giàu kinh nghiệm nhìn cùng bảng số liệu sẽ thấy thông tin khác với người mới.","steps":["Với một báo cáo hoặc dashboard, xác định nó đang cung cấp dữ liệu hay thông tin.","Hỏi người dùng báo cáo: thông tin này giúp quyết định gì?","Ghi lại tri thức cần có để diễn giải đúng, như ngưỡng, ngoại lệ, bối cảnh.","Bổ sung siêu dữ liệu và định nghĩa để dữ liệu được hiểu nhất quán.","Đưa tri thức diễn giải vào hướng dẫn, chú thích hoặc quy tắc cảnh báo.","Đánh giá định kỳ: báo cáo có dẫn tới hành động không, hay chỉ được xem."],"apps":[["Dashboard nhiều nhưng quyết định chậm","Một khối kinh doanh có hàng chục dashboard nhưng các cuộc họp vẫn tranh luận con số nào đúng. Phân tích theo DIKW cho thấy phần lớn dashboard chỉ dừng ở dữ liệu, thiếu định nghĩa chỉ số thống nhất và ngữ cảnh so sánh. Dự án từ điển dữ liệu nghiệp vụ và chú thích diễn giải giúp chuyển từ dữ liệu sang thông tin có thể hành động."],["BRD cho hệ thống báo cáo","Thay vì liệt kê các trường cần hiển thị, BA hỏi mỗi báo cáo phục vụ quyết định nào và người dùng cần biết gì để diễn giải. Yêu cầu vì vậy gồm cả định nghĩa chỉ số, ngưỡng cảnh báo và so sánh với kỳ trước. Đánh đổi: tốn thời gian làm việc với BU hơn nhưng giảm báo cáo không ai dùng."]],"pitfalls":["Đo thành công của hệ thống tri thức bằng số tài liệu hay dung lượng lưu trữ.","Nghĩ rằng tri thức có thể chuyển từ tháp dưới lên tự động bằng công cụ.","Bỏ qua siêu dữ liệu, khiến cùng một chỉ số được hiểu khác nhau giữa các phòng ban."],"links":[["6.2","Tri thức ngầm là phần khó nắm bắt nhất của tháp"],["6.5","Phân loại và ontology tổ chức thông tin"],["1.1","Thông tin là phản hồi của hệ thống"]],"quiz":[["Trong tháp DIKW, cấp nào trả lời câu hỏi làm thế nào?",["Dữ liệu","Thông tin","Tri thức","Trí tuệ"],2,"Tri thức kết hợp thông tin với kinh nghiệm để hành động."],["Ai phổ biến mô hình DIKW qua bài From Data to Wisdom năm 1989?",["Ikujiro Nonaka","Russell Ackoff","Michael Polanyi","Peter Drucker"],1,"Ackoff trình bày năm cấp gồm cả hiểu biết."],["Phê phán chính đối với tháp DIKW là gì?",["Quá phức tạp","Gợi ý quá trình tuyến tính một chiều trong khi tri thức cũng định hình cách thu thập dữ liệu","Không có dữ liệu","Chỉ dùng cho khoa học"],1,"Quan hệ giữa các cấp là hai chiều."]],"refs":["Ackoff, R. L. (1989). From Data to Wisdom. Journal of Applied Systems Analysis, 16.","Rowley, J. (2007). The Wisdom Hierarchy: Representations of the DIKW Hierarchy. Journal of Information Science, 33(2).","Davenport, T. H. & Prusak, L. (1998). Working Knowledge: How Organizations Manage What They Know. Harvard Business School Press."],"legal":false,"words":883},{"n":2,"title":"Tri thức ngầm, tri thức hiện và mô hình SECI","en":"Tacit and Explicit Knowledge and the SECI Model","summary":"Tri thức hiện là tri thức có thể viết ra, như quy trình, tài liệu, mã nguồn. Tri thức ngầm nằm trong kinh nghiệm, trực giác và kỹ năng, khó diễn đạt thành lời. Phần lớn giá trị của một chuyên gia là tri thức ngầm. Mô hình SECI mô tả bốn cách tri thức chuyển đổi giữa hai dạng này và giải thích cách tổ chức tạo ra tri thức mới.","origin":"Nhà triết học Michael Polanyi đưa ra khái niệm tri thức ngầm trong The Tacit Dimension (1966), với ý chính rằng con người biết nhiều hơn những gì họ có thể nói ra. Ikujiro Nonaka công bố lý thuyết động về tạo tri thức tổ chức năm 1994, sau đó cùng Hirotaka Takeuchi viết The Knowledge-Creating Company (1995) dựa trên nghiên cứu các công ty Nhật Bản. Nonaka và Noboru Konno bổ sung khái niệm Ba, không gian chia sẻ cho tạo tri thức, năm 1998.","concepts":[["Tri thức ngầm (Tacit knowledge)","Tri thức cá nhân gắn với bối cảnh, khó hình thức hóa, như cảm nhận một hồ sơ tín dụng có gì đó không ổn."],["Tri thức hiện (Explicit knowledge)","Tri thức được mã hóa bằng ngôn ngữ, ký hiệu, có thể lưu trữ và truyền đạt, như quy trình thẩm định."],["Xã hội hóa (Socialization)","Ngầm sang ngầm: chia sẻ kinh nghiệm qua làm cùng, quan sát, kèm cặp."],["Ngoại hóa (Externalization)","Ngầm sang hiện: diễn đạt tri thức ngầm thành khái niệm, mô hình, ẩn dụ, tài liệu."],["Kết hợp (Combination)","Hiện sang hiện: tổng hợp, sắp xếp, kết nối các tri thức hiện thành hệ thống mới."],["Nội hóa (Internalization)","Hiện sang ngầm: học qua thực hành để tri thức hiện trở thành kỹ năng của cá nhân."]],"diagram":{"type":"matrix","items":["Xã hội hóa: ngầm sang ngầm. Làm cùng, kèm cặp","Ngoại hóa: ngầm sang hiện. Mô hình, ẩn dụ, tài liệu","Nội hóa: hiện sang ngầm. Học qua thực hành","Kết hợp: hiện sang hiện. Tổng hợp, hệ thống hóa"],"caption":"Mô hình SECI của Nonaka và Takeuchi; tri thức tổ chức phát triển theo vòng xoắn đi qua cả bốn chế độ."},"model":"Nhiều chương trình quản trị tri thức chỉ tập trung vào góc Kết hợp, tức xây kho tài liệu và cổng thông tin. Nhưng tri thức mới chủ yếu được tạo ở Xã hội hóa và Ngoại hóa, còn giá trị chỉ được hiện thực khi Nội hóa thành năng lực hành động.","steps":["Xác định lĩnh vực tri thức quan trọng và người đang nắm giữ nó.","Tạo cơ hội xã hội hóa: làm cặp, dự các buổi làm việc của chuyên gia, luân chuyển.","Ngoại hóa bằng phỏng vấn có cấu trúc, câu chuyện tình huống, sơ đồ quyết định.","Kết hợp vào kho tri thức có cấu trúc, liên kết với tài liệu liên quan.","Thiết kế bài tập thực hành và tình huống để người khác nội hóa.","Lặp lại vòng xoắn khi có kinh nghiệm mới."],"apps":[["Chuyển giao kinh nghiệm thẩm định tín dụng","Chuyên viên thẩm định lâu năm có trực giác về dấu hiệu rủi ro không có trong quy trình. Chương trình kèm cặp cho chuyên viên mới dự các buổi thẩm định (xã hội hóa), phỏng vấn chuyên gia để viết thành danh sách dấu hiệu cảnh báo kèm ví dụ (ngoại hóa), đưa vào bộ hướng dẫn (kết hợp) và luyện với hồ sơ giả lập (nội hóa)."],["Tri thức về hệ thống lõi","Một kỹ sư hiểu vì sao cấu hình batch trên core được đặt theo một thứ tự đặc biệt, nhưng điều này không có trong tài liệu. Ngoại hóa bằng bản ghi quyết định kiến trúc với bối cảnh, lựa chọn và lý do giúp tránh việc người sau thay đổi cấu hình và gây sự cố. Đánh đổi: tốn thời gian của chuyên gia, nguồn lực khan hiếm nhất."]],"pitfalls":["Nghĩ rằng mọi tri thức ngầm đều có thể và nên được viết ra.","Chỉ đầu tư vào công cụ lưu trữ, bỏ qua hoạt động xã hội hóa.","Viết tài liệu mà không có bước thực hành để người đọc nội hóa."],"links":[["6.7","Giữ tri thức ngầm khi nhân sự chủ chốt rời đi"],["6.4","Cộng đồng thực hành là không gian xã hội hóa"],["3.3","Phỏng vấn định tính để ngoại hóa tri thức"]],"quiz":[["Chế độ chuyển đổi nào trong SECI là chuyển tri thức ngầm thành tri thức hiện?",["Xã hội hóa","Ngoại hóa","Kết hợp","Nội hóa"],1,"Ngoại hóa diễn đạt tri thức ngầm thành khái niệm và tài liệu."],["Kèm cặp, làm cặp và quan sát chuyên gia thuộc chế độ nào?",["Xã hội hóa","Ngoại hóa","Kết hợp","Nội hóa"],0,"Chia sẻ trực tiếp kinh nghiệm là ngầm sang ngầm."],["Ai đưa ra khái niệm tri thức ngầm năm 1966?",["Nonaka","Polanyi","Takeuchi","Wenger"],1,"Michael Polanyi trong The Tacit Dimension."]],"refs":["Polanyi, M. (1966). The Tacit Dimension. Doubleday.","Nonaka, I. (1994). A Dynamic Theory of Organizational Knowledge Creation. Organization Science, 5(1).","Nonaka, I. & Takeuchi, H. (1995). The Knowledge-Creating Company. Oxford University Press."],"legal":false,"words":844},{"n":3,"title":"Khung quản trị tri thức và mô hình trưởng thành","en":"KM Frameworks and Maturity Models","summary":"Quản trị tri thức hiệu quả cần kết hợp con người, quy trình, công nghệ và quản trị, không chỉ một nền tảng phần mềm. Các khung và mô hình trưởng thành giúp tổ chức đánh giá hiện trạng, đặt mục tiêu thực tế và lập lộ trình. Tiêu chuẩn ISO 30401 lần đầu đưa ra yêu cầu cho hệ thống quản trị tri thức như một hệ thống quản lý có thể đánh giá.","origin":"Thomas Davenport và Laurence Prusak viết Working Knowledge (1998), một trong những sách nền tảng của lĩnh vực. Tổ chức APQC xây dựng mô hình Levels of Knowledge Management Maturity với năm cấp độ. Tổ chức Tiêu chuẩn Quốc tế ban hành ISO 30401:2018 Knowledge management systems — Requirements. Nhiều ngân hàng và tổ chức tư vấn quốc tế thành lập vị trí Giám đốc tri thức từ thập niên 1990.","concepts":[["Con người, quy trình, công nghệ, quản trị (People, process, technology, governance)","Bốn thành phần phải cùng phát triển; thiếu một thành phần thì các thành phần còn lại không phát huy tác dụng."],["Mô hình trưởng thành APQC (APQC KM maturity)","Năm cấp: khởi đầu, phát triển, chuẩn hóa, tối ưu, đổi mới."],["ISO 30401","Tiêu chuẩn quốc tế đặt yêu cầu cho hệ thống quản trị tri thức: bối cảnh, lãnh đạo, hoạch định, hỗ trợ, vận hành, đánh giá, cải tiến."],["Luồng tri thức (Knowledge flow)","Đường đi của tri thức giữa người, nhóm và hệ thống; điểm nghẽn thường là cơ hội cải thiện lớn nhất."],["Chủ sở hữu tri thức (Knowledge owner)","Người chịu trách nhiệm về độ chính xác và cập nhật của một lĩnh vực tri thức."]],"diagram":{"type":"layers","items":["Cấp 5 Đổi mới: tri thức là lợi thế cạnh tranh, liên tục cải tiến","Cấp 4 Tối ưu: đo lường, cải tiến dựa trên dữ liệu","Cấp 3 Chuẩn hóa: quy trình, vai trò, công cụ thống nhất","Cấp 2 Phát triển: có chiến lược, thí điểm một số lĩnh vực","Cấp 1 Khởi đầu: hoạt động tự phát, phụ thuộc cá nhân"],"caption":"Năm cấp độ trưởng thành quản trị tri thức theo tinh thần mô hình của APQC."},"model":"Sai lầm phổ biến là muốn nhảy từ cấp 1 lên cấp 4 bằng một nền tảng công nghệ đắt tiền. Mỗi cấp cần nền của cấp dưới: không có vai trò và quy trình chuẩn hóa thì dữ liệu đo lường ở cấp 4 cũng không đáng tin.","steps":["Đánh giá hiện trạng theo bốn thành phần và năm cấp độ.","Xác định lĩnh vực tri thức quan trọng nhất với chiến lược kinh doanh.","Đặt mục tiêu tăng một cấp trong 12–18 tháng cho lĩnh vực ưu tiên.","Chỉ định chủ sở hữu tri thức và quy trình cập nhật.","Chọn công cụ sau khi đã rõ quy trình và vai trò.","Đo lường bằng chỉ số sử dụng và giá trị, như thời gian tìm câu trả lời, tỷ lệ tái sử dụng."],"apps":[["Đánh giá quản trị tri thức của một đơn vị công nghệ","Đánh giá cho thấy đơn vị ở cấp 2: có kho tài liệu dự án nhưng không chuẩn cấu trúc, không có chủ sở hữu, tìm kiếm khó. Lộ trình lên cấp 3 gồm chuẩn hóa mẫu tài liệu, quy tắc đặt tên, chỉ định chủ sở hữu cho từng hệ thống và gắn cập nhật tài liệu vào Definition of Done."],["Lựa chọn nền tảng tri thức","Ban lãnh đạo đề xuất mua một nền tảng quản trị tri thức mới. Phân tích cho thấy vấn đề chính là thiếu quy trình cập nhật và chủ sở hữu, không phải thiếu tính năng. Đề xuất là cấu hình lại công cụ hiện có trước, đầu tư nền tảng mới sau khi quy trình đã vận hành. Đánh đổi: kết quả chậm hơn kỳ vọng của lãnh đạo."]],"pitfalls":["Coi quản trị tri thức là dự án công nghệ.","Không có chủ sở hữu, khiến kho tri thức nhanh chóng lỗi thời và mất niềm tin.","Đo thành công bằng số tài liệu thay vì mức độ sử dụng và giá trị."],"links":[["6.1","Mục tiêu là chuyển từ dữ liệu sang tri thức hành động được"],["1.6","Quản trị tri thức hỗ trợ các chức năng S2 và S4"],["3.8","Phát triển hệ thống tri thức theo khoa học thiết kế"]],"quiz":[["Tiêu chuẩn quốc tế nào đặt yêu cầu cho hệ thống quản trị tri thức?",["ISO 27001","ISO 9001","ISO 30401","ISO 20022"],2,"ISO 30401:2018 Knowledge management systems — Requirements."],["Theo mô hình trưởng thành, vì sao không nên nhảy từ cấp 1 lên cấp 4?",["Vì quá đắt","Vì mỗi cấp cần nền của cấp dưới như vai trò và quy trình chuẩn hóa","Vì không có công cụ","Vì quy định cấm"],1,"Đo lường và tối ưu cần quy trình ổn định làm nền."],["Bốn thành phần cần phát triển đồng bộ trong quản trị tri thức là gì?",["Con người, quy trình, công nghệ, quản trị","Dữ liệu, thông tin, tri thức, trí tuệ","Kế hoạch, thực hiện, kiểm tra, hành động","Chi phí, thời gian, phạm vi, chất lượng"],0,"Thiếu một thành phần thì các thành phần khác kém hiệu quả."]],"refs":["Davenport, T. H. & Prusak, L. (1998). Working Knowledge. Harvard Business School Press.","ISO (2018). ISO 30401:2018 Knowledge Management Systems — Requirements.","APQC. Levels of Knowledge Management Maturity. American Productivity & Quality Center."],"legal":false,"words":902},{"n":4,"title":"Cộng đồng thực hành","en":"Communities of Practice","summary":"Cộng đồng thực hành là nhóm người cùng quan tâm tới một lĩnh vực, thường xuyên tương tác để học hỏi và cải thiện cách làm. Khác với nhóm dự án có mục tiêu và thời hạn, cộng đồng tồn tại lâu dài quanh một thực hành nghề nghiệp. Đây là một trong những cơ chế hiệu quả nhất để lan tỏa tri thức ngầm và chuẩn mực nghề nghiệp trong tổ chức lớn.","origin":"Jean Lave và Etienne Wenger đưa ra khái niệm trong Situated Learning (1991), nghiên cứu cách người học nghề trở thành chuyên gia qua tham gia ngoại vi hợp pháp. Wenger phát triển lý thuyết trong Communities of Practice (1998). Wenger, Richard McDermott và William Snyder viết Cultivating Communities of Practice (2002) với bảy nguyên tắc nuôi dưỡng cộng đồng. Ngân hàng Thế giới là một trong những tổ chức đầu tiên dùng cộng đồng thực hành một cách có hệ thống từ cuối thập niên 1990.","concepts":[["Lĩnh vực (Domain)","Chủ đề chung tạo bản sắc cho cộng đồng, như phân tích nghiệp vụ hay kiến trúc dữ liệu."],["Cộng đồng (Community)","Quan hệ giữa các thành viên, sự tin tưởng và thói quen tương tác."],["Thực hành (Practice)","Kho chung gồm công cụ, mẫu, câu chuyện, cách giải quyết vấn đề mà cộng đồng phát triển."],["Tham gia ngoại vi hợp pháp (Legitimate peripheral participation)","Người mới học bằng cách tham gia từ vị trí ngoại vi, dần tiến vào trung tâm khi năng lực tăng."],["Điều phối viên cộng đồng (Community coordinator)","Người duy trì nhịp hoạt động, kết nối thành viên và nuôi dưỡng thực hành; vai trò then chốt nhưng thường bị đánh giá thấp."]],"diagram":{"type":"hub","items":["Cộng đồng thực hành","Lĩnh vực: chủ đề chung","Cộng đồng: quan hệ và tin tưởng","Thực hành: công cụ, mẫu, câu chuyện","Điều phối viên","Thành viên nòng cốt và ngoại vi"],"caption":"Ba thành phần cấu trúc của cộng đồng thực hành theo Wenger và hai vai trò quan trọng."},"model":"Một trong bảy nguyên tắc của Wenger, McDermott và Snyder là thiết kế cho nhiều mức độ tham gia: nhóm nòng cốt nhỏ, nhóm tích cực và đông đảo thành viên ngoại vi. Thành viên ngoại vi không phải thất bại, họ vẫn học và có thể trở thành nòng cốt khi chủ đề liên quan tới công việc của họ.","steps":["Xác định lĩnh vực có giá trị chiến lược và đủ người thực hành.","Tìm nhà tài trợ và điều phối viên có thời gian được công nhận chính thức.","Bắt đầu với nhóm nòng cốt nhỏ và một vấn đề thực tế đang được quan tâm.","Thiết lập nhịp hoạt động đều đặn: sinh hoạt định kỳ, kênh trao đổi, kho thực hành.","Tạo các mức tham gia khác nhau và cơ chế ghi nhận đóng góp.","Đo giá trị qua câu chuyện ảnh hưởng và việc tái sử dụng thực hành, không chỉ số người tham dự."],"apps":[["Cộng đồng phân tích nghiệp vụ trong ngân hàng","BA thuộc nhiều khối khác nhau hiếm khi gặp nhau. Một cộng đồng BA sinh hoạt định kỳ để chia sẻ tình huống khó, rà soát chéo tài liệu và phát triển mẫu chung. Sau một thời gian, chất lượng tài liệu đồng đều hơn và BA mới hòa nhập nhanh hơn. Đánh đổi: cần thời gian của BA cấp cao, vốn đang chịu áp lực dự án."],["Cộng đồng người dùng AI nội bộ","Khi triển khai công cụ AI tạo sinh, một cộng đồng người dùng chia sẻ mẫu câu lệnh hiệu quả, cảnh báo lỗi thường gặp và cách tuân thủ quy định dữ liệu. Cộng đồng giúp lan tỏa thực hành tốt nhanh hơn đào tạo chính thức và cung cấp phản hồi cho nhóm quản trị AI."]],"pitfalls":["Biến cộng đồng thành cuộc họp báo cáo do cấp trên chỉ đạo.","Không công nhận thời gian điều phối, khiến điều phối viên kiệt sức và cộng đồng tan rã.","Đo thành công bằng số người tham dự thay vì giá trị tạo ra."],"links":[["6.2","Cộng đồng là không gian xã hội hóa tri thức ngầm"],["2.2","Cộng đồng tự tổ chức quanh thực hành"],["5.6","Lan tỏa chuẩn mực nghề nghiệp"]],"quiz":[["Ba thành phần cấu trúc của cộng đồng thực hành theo Wenger là gì?",["Mục tiêu, ngân sách, thời hạn","Lĩnh vực, cộng đồng, thực hành","Con người, quy trình, công nghệ","Lãnh đạo, thành viên, khách hàng"],1,"Domain, community và practice."],["Tham gia ngoại vi hợp pháp mô tả điều gì?",["Người ngoài không được tham gia","Người mới học bằng cách tham gia từ ngoại vi rồi dần vào trung tâm","Quy định pháp lý về cộng đồng","Thành viên không tích cực bị loại"],1,"Lave và Wenger mô tả con đường học nghề qua tham gia."],["Điểm khác biệt chính giữa cộng đồng thực hành và nhóm dự án là gì?",["Cộng đồng có ngân sách lớn hơn","Cộng đồng tồn tại lâu dài quanh một thực hành, không có thời hạn cố định","Nhóm dự án không cần giao tiếp","Không có khác biệt"],1,"Nhóm dự án có mục tiêu và thời hạn; cộng đồng tồn tại quanh lĩnh vực."]],"refs":["Lave, J. & Wenger, E. (1991). Situated Learning: Legitimate Peripheral Participation. Cambridge University Press.","Wenger, E. (1998). Communities of Practice: Learning, Meaning, and Identity. Cambridge University Press.","Wenger, E., McDermott, R. & Snyder, W. M. (2002). Cultivating Communities of Practice. Harvard Business School Press."],"legal":false,"words":913},{"n":5,"title":"Phân loại, ontology và đồ thị tri thức","en":"Taxonomy, Ontology and Knowledge Graphs","summary":"Tri thức chỉ có giá trị khi tìm được và hiểu được. Phân loại tổ chức thuật ngữ theo cấp bậc, ontology mô tả các khái niệm và quan hệ một cách hình thức để máy có thể suy luận, còn đồ thị tri thức kết nối các thực thể cụ thể theo ontology đó. Đây là nền tảng cho tìm kiếm doanh nghiệp, quản trị dữ liệu và ngày càng quan trọng cho các hệ thống AI dựa trên tri thức.","origin":"Tom Gruber (1993) định nghĩa ontology là đặc tả hình thức của một khái niệm hóa được chia sẻ. W3C chuẩn hóa RDF, ngôn ngữ ontology OWL năm 2004 và chuẩn SKOS cho hệ thống tổ chức tri thức năm 2009. Google giới thiệu Knowledge Graph năm 2012, phổ biến thuật ngữ này. Hội đồng EDM phát triển FIBO, ontology nghiệp vụ tài chính mở. Hogan và cộng sự công bố tổng quan toàn diện về đồ thị tri thức năm 2021.","concepts":[["Từ vựng kiểm soát (Controlled vocabulary)","Danh sách thuật ngữ chuẩn được thống nhất để gắn nhãn và tìm kiếm."],["Phân loại (Taxonomy)","Cấu trúc phân cấp cha con của thuật ngữ, như Sản phẩm, Cho vay, Cho vay tiêu dùng."],["Từ điển đồng nghĩa (Thesaurus)","Bổ sung quan hệ đồng nghĩa và liên quan vào phân loại, như thẻ ghi nợ và thẻ debit."],["Ontology","Mô hình hình thức của khái niệm, thuộc tính và quan hệ trong một lĩnh vực, cho phép máy suy luận."],["Đồ thị tri thức (Knowledge graph)","Mạng các thực thể cụ thể và quan hệ giữa chúng, thường được tổ chức theo một ontology."],["Siêu dữ liệu mô tả (Descriptive metadata)","Các thuộc tính gắn với tài liệu như chủ đề, hệ thống, chủ sở hữu, ngày hiệu lực, giúp tìm kiếm và lọc."]],"diagram":{"type":"layers","items":["Đồ thị tri thức: thực thể và quan hệ cụ thể","Ontology: khái niệm, thuộc tính, quan hệ hình thức","Từ điển đồng nghĩa: đồng nghĩa, liên quan","Phân loại: cấp bậc cha con","Từ vựng kiểm soát: danh sách thuật ngữ chuẩn"],"caption":"Thang độ phong phú ngữ nghĩa của hệ thống tổ chức tri thức, từ đơn giản ở dưới tới phong phú ở trên."},"model":"Không phải tổ chức nào cũng cần ontology đầy đủ. Với phần lớn nhu cầu tìm kiếm tài liệu nội bộ, một từ vựng kiểm soát và phân loại tốt đã mang lại phần lớn giá trị. Ontology và đồ thị tri thức đáng đầu tư khi cần kết nối dữ liệu nhiều hệ thống hoặc cho máy suy luận.","steps":["Xác định mục đích: tìm kiếm, tích hợp dữ liệu, hay suy luận.","Thu thập thuật ngữ từ tài liệu, nhật ký tìm kiếm và phỏng vấn người dùng.","Xây từ vựng kiểm soát và phân loại, thống nhất với các bên nghiệp vụ.","Bổ sung đồng nghĩa, viết tắt, thuật ngữ tiếng Anh thường dùng.","Nếu cần, mở rộng thành ontology dựa trên chuẩn như SKOS, OWL hoặc tham chiếu FIBO.","Chỉ định người quản trị và quy trình cập nhật, đo chất lượng tìm kiếm."],"apps":[["Tìm kiếm tài liệu quy trình nội bộ","Nhân viên tìm quy định về hạn mức nhưng tài liệu dùng thuật ngữ khác nhau giữa các khối. Một phân loại chung kèm từ điển đồng nghĩa, được gắn vào siêu dữ liệu tài liệu, giúp tìm kiếm trả về đúng kết quả. Đánh đổi: cần người quản trị thuật ngữ lâu dài."],["Đồ thị phụ thuộc hệ thống và dữ liệu","Kiến trúc sư xây đồ thị tri thức với các thực thể hệ thống, bảng dữ liệu, API, báo cáo và quan hệ sử dụng giữa chúng. Khi có yêu cầu thay đổi một trường dữ liệu, truy vấn đồ thị cho ra danh sách báo cáo và hệ thống bị ảnh hưởng trong vài phút thay vì vài ngày hỏi các nhóm."]],"pitfalls":["Xây ontology phức tạp khi chỉ cần phân loại đơn giản.","Tạo phân loại theo sơ đồ tổ chức, khiến nó lỗi thời mỗi lần tái cấu trúc.","Không có người quản trị, để thuật ngữ trùng lặp và mâu thuẫn tích tụ."],"links":[["2.4","Đồ thị tri thức là ứng dụng của khoa học mạng lưới"],["6.8","Siêu dữ liệu và phân loại cải thiện truy xuất trong RAG"],["6.1","Siêu dữ liệu chuyển dữ liệu thành thông tin"]],"quiz":[["Theo Gruber, ontology là gì?",["Một cơ sở dữ liệu quan hệ","Đặc tả hình thức của một khái niệm hóa được chia sẻ","Danh sách từ khóa","Một loại báo cáo"],1,"Định nghĩa năm 1993 được trích dẫn rộng rãi."],["Chuẩn nào của W3C được thiết kế cho phân loại và từ điển đồng nghĩa?",["HTML","SKOS","SQL","JSON"],1,"SKOS là Simple Knowledge Organization System."],["FIBO là gì?",["Một thuật toán tìm kiếm","Ontology nghiệp vụ tài chính mở do Hội đồng EDM phát triển","Chuẩn thanh toán","Phần mềm quản lý tài liệu"],1,"Financial Industry Business Ontology."]],"refs":["Gruber, T. R. (1993). A Translation Approach to Portable Ontology Specifications. Knowledge Acquisition, 5(2).","W3C (2009). SKOS Simple Knowledge Organization System Reference.","Hogan, A. et al. (2021). Knowledge Graphs. ACM Computing Surveys, 54(4)."],"legal":false,"words":860},{"n":6,"title":"Bài học kinh nghiệm và đánh giá sau hành động","en":"Lessons Learned and After Action Review","summary":"Hầu hết tổ chức đều thu thập bài học kinh nghiệm, nhưng rất ít tổ chức thực sự học từ chúng: báo cáo cuối dự án được lưu và không ai đọc lại. Đánh giá sau hành động là kỹ thuật ngắn, có cấu trúc, thực hiện ngay sau sự kiện với chính những người tham gia. Vòng học đầy đủ gồm học trước, trong và sau, và chỉ khép lại khi bài học làm thay đổi cách làm.","origin":"Quân đội Mỹ phát triển After Action Review từ thập niên 1970 và chính thức hóa trong hướng dẫn TC 25-20 năm 1993. Chris Collison và Geoff Parcell mô tả thực hành tại BP trong Learning to Fly (2001), gồm hỗ trợ đồng nghiệp trước dự án và đánh giá hồi cứu sau dự án. Esther Derby và Diana Larsen viết Agile Retrospectives (2006). Chris Argyris và Donald Schön phân biệt học vòng đơn và học vòng kép năm 1978.","concepts":[["Đánh giá sau hành động (After Action Review)","Bốn câu hỏi: dự kiến điều gì xảy ra, điều gì thực sự xảy ra, vì sao có khác biệt, lần sau duy trì và thay đổi gì."],["Hỗ trợ đồng nghiệp (Peer assist)","Mời nhóm đã làm việc tương tự chia sẻ kinh nghiệm trước khi bắt đầu dự án mới."],["Hồi cứu (Retrospect)","Buổi đánh giá có điều phối sau khi kết thúc dự án hoặc giai đoạn lớn."],["Học vòng đơn và vòng kép (Single-loop and double-loop learning)","Vòng đơn sửa hành động để đạt mục tiêu; vòng kép xem lại chính giả định và mục tiêu."],["Văn hóa không đổ lỗi (Blameless culture)","Tập trung vào hệ thống và quyết định trong bối cảnh lúc đó, không trừng phạt cá nhân vì lỗi trung thực."]],"diagram":{"type":"cycle","items":["Học trước: hỗ trợ đồng nghiệp","Hành động","Học trong: đánh giá sau hành động","Học sau: hồi cứu","Cập nhật quy trình và kho bài học"],"caption":"Vòng học trước, trong và sau theo mô hình tại BP; vòng chỉ khép khi quy trình thực sự thay đổi."},"model":"Chỉ số tốt nhất của một hệ thống bài học không phải số bài học được ghi mà là số thay đổi trong quy trình, mẫu tài liệu, bảng kiểm hay đào tạo có nguồn gốc từ bài học. Bài học chưa thay đổi hành vi thì mới chỉ là bài học được ghi nhận.","steps":["Lên lịch đánh giá sau hành động ngay sau mốc quan trọng, trong 15–60 phút.","Chỉ mời những người tham gia trực tiếp, có người điều phối trung lập.","Đi qua bốn câu hỏi, tập trung vào sự kiện trước khi diễn giải.","Chọn một đến ba hành động cụ thể có người chịu trách nhiệm và thời hạn.","Chuyển bài học quan trọng thành thay đổi trong quy trình, mẫu hoặc bảng kiểm.","Trước dự án mới, tra cứu bài học liên quan và mời hỗ trợ đồng nghiệp."],"apps":[["Sau một đợt triển khai có sự cố","Đợt triển khai hệ thống thanh toán có sự cố gián đoạn ngắn. Buổi đánh giá sau hành động không đổ lỗi cho thấy kịch bản quay lui chưa được diễn tập với dữ liệu thực tế. Hành động là thêm bước diễn tập quay lui vào bảng kiểm triển khai, có hiệu lực cho mọi dự án sau. Đánh đổi: mỗi đợt triển khai tốn thêm nửa ngày chuẩn bị."],["Kho bài học dự án không ai dùng","PMO có kho hàng trăm bài học nhưng tỷ lệ tra cứu gần như bằng không. Thay vì yêu cầu mọi người đọc kho, PMO rút ra mười bài học lặp lại nhiều nhất và nhúng chúng vào mẫu kế hoạch dự án và buổi khởi động dự án. Bài học đến với người cần đúng lúc cần."]],"pitfalls":["Tổ chức đánh giá quá muộn khi mọi người đã quên chi tiết.","Biến buổi đánh giá thành tìm người chịu trách nhiệm.","Ghi bài học mà không có hành động, người chịu trách nhiệm và thời hạn."],"links":[["1.2","Tìm cấu trúc và mô hình tư duy đằng sau sự cố"],["2.8","Học từ sự cố nhỏ làm hệ phản mong manh"],["3.7","Tổng hợp bài học có hệ thống từ nhiều dự án"]],"quiz":[["Câu hỏi nào không thuộc bốn câu hỏi của đánh giá sau hành động?",["Dự kiến điều gì xảy ra?","Điều gì thực sự xảy ra?","Ai là người gây ra lỗi?","Lần sau duy trì và thay đổi gì?"],2,"AAR tập trung vào khác biệt và bài học, không tìm người để đổ lỗi."],["Học vòng kép khác học vòng đơn ở điểm nào?",["Học hai lần","Xem lại chính giả định và mục tiêu, không chỉ sửa hành động","Học nhanh gấp đôi","Có hai người điều phối"],1,"Argyris và Schön phân biệt hai loại học này."],["Chỉ số tốt nhất cho hệ thống bài học kinh nghiệm là gì?",["Số bài học được ghi","Số thay đổi trong quy trình, mẫu, bảng kiểm có nguồn gốc từ bài học","Dung lượng kho","Số người truy cập"],1,"Bài học chỉ có giá trị khi thay đổi hành vi."]],"refs":["U.S. Army (1993). TC 25-20: A Leader's Guide to After-Action Reviews.","Collison, C. & Parcell, G. (2001). Learning to Fly: Practical Lessons from One of the World's Leading Knowledge Companies. Capstone.","Derby, E. & Larsen, D. (2006). Agile Retrospectives: Making Good Teams Great. Pragmatic Bookshelf."],"legal":false,"words":900},{"n":7,"title":"Giữ lại tri thức và chuyển giao khi nhân sự thay đổi","en":"Knowledge Retention and Transfer","summary":"Khi một chuyên gia lâu năm nghỉ hưu hoặc chuyển việc, tổ chức có thể mất tri thức tích lũy qua nhiều năm: vì sao hệ thống được cấu hình như vậy, ai cần liên hệ khi có vấn đề, các ngoại lệ không có trong tài liệu. Giữ lại tri thức là quá trình chủ động đánh giá rủi ro mất tri thức và chuyển giao trước khi quá muộn, đặc biệt với hệ thống legacy và nghiệp vụ đặc thù.","origin":"David DeLong phân tích hiện tượng mất tri thức do lực lượng lao động già hóa trong Lost Knowledge (2004). Dorothy Leonard và Walter Swap nghiên cứu cách chuyển giao chuyên môn sâu trong Deep Smarts (2005), nhấn mạnh học qua thực hành có hướng dẫn. Michael Nygard đề xuất bản ghi quyết định kiến trúc năm 2011 như cách nhẹ nhàng để ghi lại lý do quyết định kỹ thuật. Nhiều tổ chức hạt nhân, hàng không và năng lượng có chương trình giữ lại tri thức bài bản.","concepts":[["Đánh giá rủi ro mất tri thức (Knowledge loss risk assessment)","Đánh giá từng vị trí theo mức độ quan trọng của tri thức và xác suất người nắm giữ rời đi."],["Chuyên môn sâu (Deep smarts)","Chuyên môn dựa trên kinh nghiệm cho phép phán đoán nhanh và đúng trong tình huống phức tạp; chủ yếu là tri thức ngầm."],["Học có hướng dẫn qua thực hành (Guided experience)","Người học làm việc thật với sự quan sát, hỏi đáp và phản hồi của chuyên gia."],["Bản ghi quyết định kiến trúc (Architecture Decision Record)","Tài liệu ngắn ghi bối cảnh, quyết định, phương án đã cân nhắc và hệ quả của một quyết định kỹ thuật."],["Điểm lỗi đơn lẻ về tri thức (Knowledge single point of failure)","Tri thức quan trọng chỉ một người nắm giữ; tương tự điểm lỗi đơn lẻ trong kiến trúc hệ thống."]],"diagram":{"type":"matrix","items":["Quan trọng cao, rủi ro rời đi thấp: kế hoạch kế nhiệm dài hạn","Quan trọng cao, rủi ro rời đi cao: ưu tiên chuyển giao ngay","Quan trọng thấp, rủi ro rời đi thấp: theo dõi","Quan trọng thấp, rủi ro rờ
