i đi cao: tài liệu hóa cơ bản"],"caption":"Ma trận ưu tiên giữ lại tri thức theo mức độ quan trọng và rủi ro mất nhân sự.","axes":{"x":["Rủi ro người nắm giữ rời đi","Thấp","Cao"],"y":["Mức độ quan trọng của tri thức","Thấp","Cao"]}},"model":"Góc trên bên phải cần hành động trong vài tuần chứ không phải vài tháng. Phương pháp hiệu quả nhất cho chuyên môn sâu không phải là yêu cầu chuyên gia viết tài liệu, vì họ thường không nhận ra điều gì cần viết, mà là cho người kế nhiệm làm việc thật dưới sự kèm cặp.","steps":["Lập danh sách vị trí và hệ thống then chốt, đánh giá theo ma trận ưu tiên.","Với vị trí ưu tiên cao, phỏng vấn chuyên gia để lập bản đồ tri thức: quyết định, quan hệ, ngoại lệ.","Chọn người kế nhiệm và lên kế hoạch học có hướng dẫn qua các tình huống thật.","Ghi lại quyết định quan trọng bằng bản ghi quyết định và câu chuyện tình huống.","Kiểm tra chuyển giao bằng cách để người kế nhiệm xử lý độc lập trong khi chuyên gia còn làm.","Đưa đánh giá rủi ro tri thức vào quy trình nhân sự định kỳ."],"apps":[["Chuyên gia hệ thống lõi sắp nghỉ hưu","Một kỹ sư là người duy nhất hiểu các chương trình tùy chỉnh trên hệ thống lõi cũ. Đánh giá xếp vị trí vào góc ưu tiên chuyển giao ngay. Kế hoạch gồm sáu tháng làm cặp với hai kỹ sư trẻ, ghi bản ghi quyết định cho các tùy chỉnh quan trọng và để người kế nhiệm dẫn dắt xử lý sự cố trong ba tháng cuối. Đánh đổi: giảm năng suất ngắn hạn của đội."],["Luân chuyển BA giữa các dự án","Khi BA chuyển dự án, tri thức về lý do của từng yêu cầu thường bị mất, dẫn tới tranh luận lại với BU. Quy tắc bàn giao gồm nhật ký quyết định yêu cầu, danh sách stakeholder với ghi chú, một tuần làm song song, giúp giảm rủi ro này."]],"pitfalls":["Chỉ yêu cầu chuyên gia viết tài liệu vào những tuần cuối trước khi nghỉ.","Không nhận ra điểm lỗi đơn lẻ về tri thức cho tới khi người đó đã rời đi.","Chọn người kế nhiệm nhưng không cho họ thời gian học thực tế."],"links":[["6.2","Chuyển giao tri thức ngầm qua xã hội hóa"],["6.4","Cộng đồng giảm phụ thuộc vào một cá nhân"],["2.8","Dự phòng về con người là một phần của khả năng chống chịu"]],"quiz":[["Vị trí có tri thức quan trọng cao và rủi ro rời đi cao cần hành động gì?",["Theo dõi","Tài liệu hóa cơ bản","Ưu tiên chuyển giao ngay","Không cần làm gì"],2,"Đây là góc rủi ro cao nhất trong ma trận."],["Theo Leonard và Swap, chuyên môn sâu được chuyển giao hiệu quả nhất bằng cách nào?",["Đọc tài liệu","Học có hướng dẫn qua thực hành","Xem video","Tham dự hội thảo"],1,"Deep smarts chủ yếu là tri thức ngầm, cần thực hành có kèm cặp."],["Bản ghi quyết định kiến trúc ghi lại những gì?",["Chỉ sơ đồ hệ thống","Bối cảnh, quyết định, phương án đã cân nhắc và hệ quả","Mã nguồn","Danh sách nhân sự"],1,"ADR giúp người sau hiểu vì sao, không chỉ cái gì."]],"refs":["DeLong, D. W. (2004). Lost Knowledge: Confronting the Threat of an Aging Workforce. Oxford University Press.","Leonard, D. & Swap, W. (2005). Deep Smarts: How to Cultivate and Transfer Enduring Business Wisdom. Harvard Business School Press.","Nygard, M. (2011). Documenting Architecture Decisions. Bài blog tại cognitect.com."],"legal":false,"words":954},{"n":8,"title":"Quản trị tri thức trong kỷ nguyên AI","en":"Knowledge Management in the AI Era","summary":"Mô hình ngôn ngữ lớn thay đổi cách con người truy cập tri thức: thay vì tìm tài liệu, người dùng đặt câu hỏi và nhận câu trả lời tổng hợp. Kiến trúc truy xuất tăng cường sinh (RAG) cho phép mô hình trả lời dựa trên tri thức của chính tổ chức. Nhưng chất lượng câu trả lời phụ thuộc hoàn toàn vào chất lượng, cấu trúc và quản trị của nguồn tri thức, nên quản trị tri thức trở nên quan trọng hơn chứ không kém đi.","origin":"Patrick Lewis và cộng sự tại Facebook AI Research giới thiệu RAG năm 2020. Ziwei Ji và cộng sự công bố tổng quan về hiện tượng ảo giác trong sinh ngôn ngữ năm 2023. Sự bùng nổ của các trợ lý AI tạo sinh từ cuối năm 2022 khiến nhiều tổ chức triển khai trợ lý tri thức nội bộ. Tại Việt Nam, các khung pháp lý về dữ liệu cá nhân và trí tuệ nhân tạo đặt thêm yêu cầu về phân loại dữ liệu, kiểm soát truy cập và trách nhiệm giải trình khi đưa tài liệu nội bộ vào hệ thống AI.","concepts":[["Truy xuất tăng cường sinh (Retrieval-Augmented Generation)","Truy xuất đoạn tài liệu liên quan tới câu hỏi rồi đưa vào ngữ cảnh để mô hình sinh câu trả lời có căn cứ."],["Phân đoạn tài liệu (Chunking)","Chia tài liệu thành các đoạn phù hợp để lập chỉ mục; cách chia ảnh hưởng lớn tới chất lượng truy xuất."],["Nhúng vector (Embedding)","Biểu diễn văn bản thành vector số để tìm các đoạn gần nghĩa với câu hỏi."],["Có căn cứ và trích dẫn (Grounding and citation)","Câu trả lời gắn với nguồn cụ thể để người dùng kiểm chứng; giảm nhưng không loại bỏ ảo giác."],["Kiểm soát truy cập theo tài liệu (Document-level access control)","Trợ lý chỉ truy xuất tài liệu mà người hỏi có quyền xem, tránh rò rỉ qua câu trả lời."],["Vận hành tri thức (Knowledge operations)","Quy trình liên tục cập nhật, gỡ bỏ tài liệu lỗi thời, đánh giá chất lượng câu trả lời và xử lý phản hồi."]],"diagram":{"type":"flow","items":["Nguồn tri thức được quản trị","Làm sạch và phân đoạn","Chỉ mục vector kèm siêu dữ liệu và quyền","Truy xuất theo câu hỏi","Sinh câu trả lời có trích dẫn","Phản hồi và cập nhật nguồn"],"caption":"Kiến trúc RAG nhìn từ góc độ quản trị tri thức: bước đầu và bước cuối quyết định chất lượng."},"model":"Nguyên tắc rác vào, rác ra áp dụng mạnh hơn với AI: tài liệu lỗi thời hoặc mâu thuẫn sẽ được trả lời một cách trôi chảy và tự tin. Trước khi lập chỉ mục, cần xác định chủ sở hữu, ngày hiệu lực, mức phân loại dữ liệu và loại bỏ phiên bản cũ.","steps":["Chọn phạm vi tri thức ban đầu có chủ sở hữu rõ và giá trị cao.","Phân loại dữ liệu theo quy định nội bộ và pháp luật trước khi đưa vào hệ thống.","Làm sạch, loại bỏ trùng lặp, gắn siêu dữ liệu về hiệu lực và quyền truy cập.","Xây bộ câu hỏi đánh giá với đáp án chuẩn do chuyên gia xác nhận.","Đo độ chính xác, tỷ lệ có trích dẫn đúng, tỷ lệ từ chối trả lời phù hợp.","Vận hành: cập nhật nguồn, xử lý phản hồi, rà soát định kỳ và báo cáo cho bộ phận quản trị AI."],"apps":[["Trợ lý tra cứu quy trình cho nhân viên chi nhánh","Trợ lý trả lời câu hỏi về quy trình mở tài khoản và biểu phí dựa trên tài liệu nội bộ. Thí điểm cho thấy phần lớn câu trả lời sai đến từ việc kho chứa cả phiên bản quy trình cũ. Sau khi áp dụng chủ sở hữu và ngày hiệu lực cho từng tài liệu, tỷ lệ sai giảm mạnh. Đánh đổi: cần đội vận hành tri thức thường trực."],["Không đưa mọi tài liệu vào trợ lý","Nhóm dự án muốn lập chỉ mục toàn bộ ổ chia sẻ. Đánh giá cho thấy trong đó có hồ sơ khách hàng, dữ liệu nhân sự và tài liệu mật. Quyết định là chỉ lập chỉ mục các kho đã được phân loại và cấp quyền rõ ràng, kèm kiểm soát truy cập theo tài liệu, phù hợp yêu cầu bảo vệ dữ liệu cá nhân và bảo mật thông tin."]],"pitfalls":["Nghĩ rằng AI sẽ tự sắp xếp được kho tri thức lộn xộn.","Lập chỉ mục tài liệu chứa dữ liệu cá nhân hoặc mật mà không kiểm soát truy cập.","Đánh giá trợ lý bằng cảm nhận thay vì bộ câu hỏi chuẩn."],"links":[["5.4","Quản trị rủi ro và đạo đức AI"],["5.3","Phân loại và bảo vệ dữ liệu cá nhân"],["6.5","Phân loại và siêu dữ liệu cải thiện truy xuất"]],"quiz":[["Nguồn gốc phổ biến của câu trả lời sai trong hệ thống RAG nội bộ là gì?",["Mô hình quá lớn","Kho tài liệu chứa phiên bản lỗi thời hoặc mâu thuẫn","Người dùng hỏi quá nhiều","Mạng chậm"],1,"Chất lượng nguồn quyết định chất lượng câu trả lời."],["Kiểm soát truy cập theo tài liệu trong trợ lý AI nhằm mục đích gì?",["Tăng tốc độ","Chỉ truy xuất tài liệu người hỏi có quyền xem, tránh rò rỉ qua câu trả lời","Giảm chi phí","Tăng số tài liệu"],1,"Không có kiểm soát này, trợ lý có thể tiết lộ nội dung mật."],["Ai giới thiệu kiến trúc RAG năm 2020?",["Ji và cộng sự","Lewis và cộng sự","Nonaka và Takeuchi","Gruber"],1,"Lewis et al., Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks."]],"refs":["Lewis, P. et al. (2020). Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks. Advances in Neural Information Processing Systems 33 (NeurIPS 2020).","Ji, Z. et al. (2023). Survey of Hallucination in Natural Language Generation. ACM Computing Surveys, 55(12).","NIST (2024). Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile (NIST AI 600-1)."],"legal":true,"words":998}]}],"edges":[[1,2,"Mô hình hóa hệ phi tuyến","Khoa học hệ thống cung cấp ngôn ngữ phản hồi và độ trễ; khoa học phức hợp bổ sung tác nhân dị biệt, tính trồi và giới hạn của dự báo. Kết hợp hai bên cho mô hình vừa có cấu trúc vừa tôn trọng sự bất định.",["1.4","2.6","2.1"]],[2,6,"Tri thức trồi từ mạng lưới","Tri thức tổ chức không nằm trong kho tài liệu mà lan truyền qua mạng quan hệ. Cynefin ra đời từ quản trị tri thức; cộng đồng thực hành là một dạng tự tổ chức.",["2.7","2.4","6.4"]],[6,3,"Bằng chứng và tái sử dụng","Nghiên cứu tạo ra bằng chứng; quản trị tri thức lưu giữ, cấu trúc hóa và đưa bằng chứng tới người cần. Tổng quan hệ thống và kho bài học có chung logic minh bạch về nguồn.",["3.7","6.6","6.2"]],[3,5,"Đạo đức nghiên cứu","Mọi nghiên cứu có con người tham gia, kể cả phỏng vấn người dùng và thử nghiệm A/B, đều cần đồng ý, bảo vệ dữ liệu và cân nhắc tổn hại.",["5.5","3.2","3.3"]],[5,4,"Quyết định có giá trị","Khoa học quyết định cho biết cách chọn phương án tốt nhất theo mục tiêu; đạo đức hỏi mục tiêu và ràng buộc nào là chính đáng, và ai gánh chịu hệ quả.",["5.7","4.4","5.1"]],[4,1,"Hệ quả bậc hai","Quyết định tốt cần thấy vòng phản hồi và độ trễ mà quyết định sẽ kích hoạt. Mô phỏng hệ thống là công cụ thử chính sách trước khi quyết định.",["1.3","1.8","4.3"]],[1,6,"Tổ chức học tập","Senge đặt tư duy hệ thống làm trung tâm của tổ chức học tập; học vòng kép và đánh giá sau hành động giúp tổ chức thay đổi chính cấu trúc tạo ra vấn đề.",["1.2","6.6","6.3"]],[2,4,"Quyết định trong bất định","Khi phân phối có đuôi dày và hệ phức hợp, tối ưu giá trị kỳ vọng không còn đủ; cần kịch bản, quyền chọn và thử nghiệm an toàn để thất bại.",["2.7","4.6","2.5"]],[3,4,"Bằng chứng cho quyết định","Suy luận nhân quả và Bayes chuyển dữ liệu thành niềm tin có căn cứ; giá trị thông tin cho biết khi nào đáng nghiên cứu thêm trước khi quyết định.",["3.6","4.5","4.3"]],[5,6,"Tri thức có trách nhiệm","Đưa tri thức nội bộ vào hệ thống AI đặt ra câu hỏi về dữ liệu cá nhân, quyền truy cập, trách nhiệm giải trình và độ tin cậy của câu trả lời.",["6.8","5.4","5.3"]]],"cases":[{"title":"Dự án thay thế hệ thống lõi liên tục trễ hạn","context":"Một dự án thay thế hệ thống lõi giả lập đã trễ hai lần mốc UAT. Ban điều hành đề xuất bổ sung 15 nhân sự thuê ngoài và tăng tần suất báo cáo lên hàng ngày. Đội dự án phản ánh số lỗi mở tăng nhanh sau mỗi đợt bổ sung người.","lenses":[["1.4","Mô hình kho và dòng cho thấy nhân sự mới cần vài tháng để đạt năng suất, trong khi người cũ mất thời gian kèm cặp: đúng tinh thần luật Brooks. Bổ sung ồ ạt làm năng lực thực giảm trong ngắn hạn."],["1.5","Sơ đồ vòng nhân quả làm lộ vòng tăng cường: áp lực tiến độ, bỏ qua rà soát, lỗi lọt sang UAT, làm lại, áp lực tiến độ tăng. Báo cáo hàng ngày thêm áp lực mà không phá vòng."],["4.2","Kế hoạch ban đầu là nạn nhân của ngụy biện lập kế hoạch. Dự báo lớp tham chiếu từ các dự án thay thế hệ thống lõi khác sẽ cho mốc thực tế hơn."],["2.7","Chuyển đổi dữ liệu và cấu hình sản phẩm là vùng phức tạp cần chuyên gia; thay đổi thói quen người dùng tại chi nhánh là vùng phức hợp cần thí điểm. Dùng một kế hoạch chi tiết cho cả hai là sai công cụ."],["6.6","Đánh giá sau hành động không đổ lỗi sau mỗi đợt UAT giúp tìm nguyên nhân gốc lặp lại, thay vì mỗi lần trễ lại có một lời giải thích mới."]],"lesson":"Giải pháp trực giác là thêm người và thêm kiểm soát lại củng cố chính vòng phản hồi gây trễ. Can thiệp hiệu quả hơn là giảm phạm vi đợt phát hành, đặt cổng chất lượng trước UAT, lập lại kế hoạch theo lớp tham chiếu và tách các phần việc theo bối cảnh Cynefin.","questions":["Chỉ số nào nên thay thế báo cáo tiến độ hàng ngày để phản ánh đúng sức khỏe dự án?","Nếu buộc phải bổ sung nhân sự, nên bổ sung vào vị trí nào và theo nhịp nào để giảm tác động của luật Brooks?"]},{"title":"Triển khai trợ lý AI trả lời quy trình nội bộ","context":"Ngân hàng giả lập muốn triển khai trợ lý AI giúp nhân viên chi nhánh tra cứu quy trình và biểu phí. Nhóm công nghệ đề xuất lập chỉ mục toàn bộ ổ chia sẻ để có nhiều tri thức nhất. Khối tuân thủ lo ngại về câu trả lời sai và rò rỉ dữ liệu.","lenses":[["6.8","Chất lượng câu trả lời phụ thuộc vào nguồn: ổ chia sẻ chứa nhiều phiên bản cũ và tài liệu mâu thuẫn. Cần chọn phạm vi có chủ sở hữu, gắn ngày hiệu lực và vận hành tri thức thường xuyên."],["5.4","Trợ lý hỗ trợ quyết định nghiệp vụ nên cần quản trị theo mức rủi ro: trích dẫn nguồn, gắn nhãn nội dung AI, đo tỷ lệ sai và có kênh báo lỗi."],["5.3","Ổ chia sẻ có thể chứa dữ liệu khách hàng và nhân sự. Phân loại dữ liệu và kiểm soát truy cập theo tài liệu là điều kiện trước khi lập chỉ mục."],["3.2","Đánh giá trợ lý cần thiết kế như một thực nghiệm: bộ câu hỏi chuẩn, đáp án do chuyên gia xác nhận, so sánh với cách tra cứu hiện tại."],["6.5","Phân loại và từ điển đồng nghĩa giúp truy xuất đúng khi các khối dùng thuật ngữ khác nhau cho cùng một khái niệm."]],"lesson":"Nhiều tri thức hơn không có nghĩa là trợ lý tốt hơn. Phạm vi nhỏ, nguồn được quản trị, kiểm soát truy cập và đánh giá có phương pháp là con đường ít rủi ro nhất để tạo giá trị và niềm tin.","questions":["Tiêu chí nào nên dùng để chọn phạm vi tri thức cho giai đoạn thí điểm?","Ai trong tổ chức nên chịu trách nhiệm khi trợ lý trả lời sai và nhân viên làm theo?"]},{"title":"Chọn nhà cung cấp hệ thống quản lý nhân sự","context":"Hội đồng gồm đại diện nhân sự, công nghệ, tài chính và mua sắm phải chọn một trong ba nhà cung cấp giả lập. Các buổi họp trước kéo dài vì mỗi bên ủng hộ một nhà cung cấp khác nhau. Một thành viên có quan hệ cá nhân với một nhà cung cấp.","lenses":[["4.4","MCDA làm lộ nguyên nhân bất đồng: mỗi bên ngầm dùng trọng số khác nhau. Thống nhất trọng số trước khi chấm điểm và xử lý yêu cầu lưu trữ dữ liệu trong nước như ràng buộc."],["4.8","Chấm điểm độc lập trước khi thảo luận và để người có vị thế thấp phát biểu trước giúp giảm nhiễu và hiệu ứng lan truyền."],["2.7","Các tiêu chí chức năng thuộc vùng phức tạp và đánh giá được bằng demo; mức độ chấp nhận của người dùng thuộc vùng phức hợp, nên cần thí điểm trước khi ký hợp đồng toàn diện."],["5.6","Thành viên có quan hệ cá nhân phải công bố xung đột lợi ích và rút khỏi phần đánh giá liên quan để bảo vệ tính hợp lệ của quyết định."]],"lesson":"Quyết định nhóm tốt đến từ quy trình tốt: trọng số minh bạch, đánh giá độc lập, xử lý xung đột lợi ích và phân tích độ nhạy. Quy trình như vậy cũng giúp bảo vệ quyết định khi bị kiểm toán sau này.","questions":["Nếu phân tích độ nhạy cho thấy thứ hạng thay đổi khi trọng số chi phí tăng nhẹ, hội đồng nên làm gì?","Làm sao để đánh giá rủi ro nhà cung cấp dài hạn, một tiêu chí khó định lượng?"]},{"title":"Giảm cảnh báo gian lận giả trên thẻ","context":"Hệ thống phát hiện gian lận giả lập tạo ra rất nhiều cảnh báo, đội xác minh quá tải và khách hàng phàn nàn vì giao dịch hợp lệ bị chặn. Đề xuất ban đầu là hạ ngưỡng nhạy của mô hình.","lenses":[["4.5","Với tỷ lệ gian lận nền rất thấp, ngay cả mô hình chính xác cao cũng cho phần lớn cảnh báo là nhầm. Hạ ngưỡng giảm cảnh báo nhưng có thể bỏ lọt gian lận; cần tính toán cả hai phía."],["2.4","Bổ sung tín hiệu mạng lưới, như tài khoản nhận có liên kết với cụm đáng ngờ, cung cấp bằng chứng độc lập để phân tầng cảnh báo."],["5.4","Cần kiểm tra tỷ lệ cảnh báo nhầm theo nhóm khách hàng; nếu một nhóm bị chặn nhầm nhiều hơn hẳn, đó là vấn đề công bằng và trải nghiệm."],["1.3","Chặn nhầm nhiều làm khách hàng chuyển sang kênh khác và đội xác minh bỏ qua cảnh báo vì quá tải: nguyên mẫu Giải pháp phản tác dụng."]],"lesson":"Vấn đề không nằm ở một ngưỡng duy nhất mà ở thiết kế hệ quyết định: phân tầng cảnh báo theo mức bằng chứng, xác minh nhẹ cho mức thấp, chặn khi có tín hiệu độc lập, và giám sát công bằng theo nhóm.","questions":["Chi phí của một lần chặn nhầm và một lần bỏ lọt gian lận nên được ước lượng thế nào để chọn ngưỡng?","Chỉ số nào cho biết đội xác minh đang bị quá tải tới mức ảnh hưởng chất lượng?"]},{"title":"Chương trình bán chéo bảo hiểm qua kênh ngân hàng","context":"Doanh thu phí từ bán bảo hiểm qua kênh ngân hàng giả lập tăng mạnh nhờ chỉ tiêu theo giao dịch viên, nhưng tỷ lệ hủy hợp đồng trong thời gian cân nhắc và khiếu nại cũng tăng. Một số khách hàng cho rằng họ được thông báo bảo hiểm là điều kiện giải ngân.","lenses":[["5.8","Đây là dấu hiệu điển hình của rủi ro hành vi và bán sai sản phẩm. Cần tách tư vấn bảo hiểm khỏi quy trình tín dụng và đo kết quả khách hàng, đối chiếu với quy định hiện hành về bán bảo hiểm qua ngân hàng."],["1.3","Nguyên mẫu Mục tiêu bị bào mòn: áp lực chỉ tiêu làm chuẩn tư vấn hạ dần, mỗi lần hạ lại trở thành chuẩn mới."],["1.8","Điểm đòn bẩy nằm ở luật chơi, tức cơ chế thưởng, chứ không phải ở thêm đào tạo hay thêm chữ ký xác nhận."],["3.6","Để biết thay đổi cơ chế thưởng có giảm bán sai không, có thể dùng khác biệt trong khác biệt giữa các vùng áp dụng trước và sau."]],"lesson":"Kiểm soát hình thức không đủ khi cơ chế khuyến khích đẩy theo hướng ngược lại. Sửa luật chơi, đo kết quả khách hàng và đánh giá tác động bằng phương pháp nhân quả là cách tiếp cận bền vững.","questions":["Chỉ số chất lượng nào nên đưa vào công thức thưởng mà không làm mất động lực bán hàng chính đáng?","Tín hiệu sớm nào giúp phát hiện bán sai trước khi khiếu nại tăng?"]},{"title":"Mất tri thức về hệ thống legacy khi chuyên gia nghỉ hưu","context":"Hai kỹ sư giả lập hiểu rõ các chương trình tùy chỉnh trên một hệ thống cũ sẽ nghỉ hưu trong sáu tháng. Tài liệu kỹ thuật lỗi thời, và mỗi sự cố lớn đều phải gọi một trong hai người.","lenses":[["6.7","Ma trận rủi ro xếp hai vị trí vào góc ưu tiên chuyển giao ngay. Yêu cầu viết tài liệu vào tuần cuối sẽ không đủ; cần học có hướng dẫn qua các tình huống thật."],["6.2","Phần lớn tri thức ở dạng ngầm. Kết hợp xã hội hóa qua làm cặp, ngoại hóa qua bản ghi quyết định và câu chuyện sự cố, nội hóa qua diễn tập."],["6.4","Thành lập nhóm nhỏ quanh hệ thống này giúp tri thức không lại tập trung vào một người kế nhiệm duy nhất."],["2.8","Chuyên gia duy nhất là điểm lỗi đơn lẻ; đầu tư dự phòng về con người là một phần của khả năng chống chịu hoạt động."]],"lesson":"Rủi ro mất tri thức giống rủi ro kỹ thuật và cần được quản lý với cùng mức nghiêm túc: nhận diện sớm, ưu tiên theo mức độ quan trọng, chuyển giao bằng thực hành và kiểm tra bằng xử lý độc lập.","questions":["Làm sao phát hiện các điểm lỗi đơn lẻ về tri thức trước khi có thông báo nghỉ việc?","Chuyển giao tri thức nên được đưa vào kế hoạch nhân sự hay kế hoạch công nghệ, ai chịu trách nhiệm?"]}],"paths":[{"role":"Business Analyst","goal":"Phân tích vấn đề sâu hơn danh sách yêu cầu, làm việc với bất đồng giữa các bên và đảm bảo yêu cầu có căn cứ.","hours":22,"items":["1.1","1.2","1.7","3.3","3.4","6.1","6.2","4.4","4.2","5.3","5.6","6.6"]},{"role":"PMO và quản lý dự án","goal":"Lập kế hoạch thực tế, nhìn thấy động lực hệ thống của dự án và xây dựng năng lực học của tổ chức.","hours":20,"items":["1.3","1.4","4.2","4.3","2.7","4.8","5.6","6.6","6.3","2.8","1.8"]},{"role":"Solution Architect","goal":"Thiết kế hệ thống chống chịu, quản trị phụ thuộc, ghi lại quyết định và đưa AI vào kiến trúc có trách nhiệm.","hours":21,"items":["1.1","1.6","2.4","2.5","2.8","4.6","6.5","6.7","6.8","5.4","5.3"]},{"role":"Quản lý và lãnh đạo","goal":"Ra quyết định trong bất định, thiết kế luật chơi đúng và xây văn hóa học tập, có đạo đức.","hours":19,"items":["1.2","1.8","2.1","2.7","4.6","4.8","5.1","5.2","5.8","6.4","6.3"]}],"stats":{"rows":[["Số lĩnh vực","6"],["Số chương","48"],["Tổng số từ nội dung chương (xấp xỉ)","44.305"],["Số từ mỗi chương: thấp nhất / trung bình / cao nhất","844 / 923 / 1084"],["Sơ đồ SVG trong chương","48"],["Sơ đồ SVG tổng hợp (bản đồ giao thoa)","1 (dùng ở trang chủ và trang bản đồ)"],["Số thuật ngữ trong glossary","248"],["Số câu hỏi tự kiểm tra","144"],["Liên kết chéo giữa chương","144, không có liên kết hỏng"],["Case study liên ngành","6"],["Lộ trình học theo vai trò","4"],["Điểm giao thoa trên bản đồ","10"],["Kích thước file","349 KB, một file HTML chạy offline"]],"limits":["Số từ mỗi chương tính trên cả 10 phần (gồm câu hỏi và tài liệu tham khảo) nằm trong khoảng 600–1000 từ; riêng phần thân bài (phần 1–7) khoảng 590–780 từ, trung bình 656, tức sát cận dưới của mục tiêu; các chủ đề ở mức nhập môn có định hướng ứng dụng, chưa đi sâu.","Mỗi chương có 3 câu hỏi tự kiểm tra thay vì 5.","Nội dung pháp luật Việt Nam (Nghị định 13/2023/NĐ-CP, Luật 91/2025/QH15, Luật 19/2023/QH15, Luật 32/2024/QH15, Thông tư 67/2023/TT-BTC, Luật AI số 134/2025) chỉ mang tính liên hệ, cần đối chiếu văn bản gốc và hướng dẫn thi hành hiện hành.","Tài liệu tham khảo là các tác phẩm có thật được nêu theo trí nhớ của mô hình; số tập, số kỳ và năm tái bản nên được kiểm tra lại trước khi trích dẫn chính thức.","Sơ đồ được sinh bởi một bộ vẽ SVG dùng chung (5 dạng), nên mang tính minh họa cấu trúc hơn là đồ họa thiết kế riêng cho từng chương.","Các ví dụ ngân hàng và dự án IT là tình huống giả lập, không dùng số liệu nội bộ thật."]}};</script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var DOM=DATA.domains, byId={}, ORDER=[];
DOM.forEach(function(d){d.chapters.forEach(function(c){c.id=d.id+'.'+c.n;c.dom=d;byId[c.id]=c;ORDER.push(c.id);});});
var TOTAL=ORDER.length;
function dById(i){for(var k=0;k<DOM.length;k++){if(DOM[k].id===i)return DOM[k];}return null;}
function chHref(id){var p=id.split('.');return '#/c/'+p[0]+'/'+p[1];}
function accStyle(d){return '--acc:'+d.color+';--acc-d:'+d.colorDark;}

/* storage: memory first, localStorage optional */
var store={mem:{},get:function(k,def){try{var v=window.localStorage.getItem('viii:'+k);if(v!==null)return JSON.parse(v);}catch(e){}return Object.prototype.hasOwnProperty.call(this.mem,k)?this.mem[k]:def;},
set:function(k,v){this.mem[k]=v;try{window.localStorage.setItem('viii:'+k,JSON.stringify(v));}catch(e){}}};
var readSet={};(store.get('read',[])||[]).forEach(function(id){if(byId[id])readSet[id]=1;});
function readCount(list){return (list||ORDER).filter(function(id){return readSet[id];}).length;}
function saveRead(){store.set('read',Object.keys(readSet));updateProg();}
function updateProg(){var n=readCount();$('#progTxt').textContent=n+'/'+TOTAL;$('#progBar').style.width=(TOTAL?100*n/TOTAL:0)+'%';}

/* theme */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);}
var theme=store.get('theme',null);
if(!theme){try{theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){theme='light';}}
applyTheme(theme);
$('#themeBtn').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';applyTheme(theme);store.set('theme',theme);});

/* text folding for diacritic-insensitive search, index-preserving */
function foldCh(ch){var f=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(f==='đ')f='d';return f.length===1?f:ch.toLowerCase().charAt(0)||ch;}
function fold(s){var o='';for(var i=0;i<s.length;i++)o+=foldCh(s[i]);return o;}

/* ---------- SVG diagram engine ---------- */
var svgN=0;
function wrapT(t,max){var w=String(t).split(/\s+/),L=[],cur='';w.forEach(function(x){var nx=cur?cur+' '+x:x;if(nx.length>max&&cur){L.push(cur);cur=x;}else cur=nx;});if(cur)L.push(cur);return L;}
function txt(x,y,t,max,cls,lh){var L=wrapT(t,max);lh=lh||16;var y0=y-(L.length-1)*lh/2;
return '<text x="'+x+'" y="'+y0.toFixed(1)+'" class="'+(cls||'dt')+'" text-anchor="middle" dominant-baseline="middle">'+L.map(function(l,i){return '<tspan x="'+x+'" dy="'+(i?lh:0)+'">'+esc(l)+'</tspan>';}).join('')+'</text>';}
function defs(id){return '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>';}
function edgeDist(ux,uy,hw,hh){var a=Math.abs(ux)<1e-6?1e9:hw/Math.abs(ux),b=Math.abs(uy)<1e-6?1e9:hh/Math.abs(uy);return Math.min(a,b);}
function arrow(p,q,hw,hh,mid,gap){var dx=q.x-p.x,dy=q.y-p.y,L=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/L,uy=dy/L;gap=gap||5;
var s=edgeDist(ux,uy,hw,hh)+gap,e=edgeDist(ux,uy,hw,hh)+gap+2;if(s+e>=L)return '';
return '<line class="ar" x1="'+(p.x+ux*s).toFixed(1)+'" y1="'+(p.y+uy*s).toFixed(1)+'" x2="'+(q.x-ux*e).toFixed(1)+'" y2="'+(q.y-uy*e).toFixed(1)+'" marker-end="url(#'+mid+')"/>';}
function box(p,w,h,t,cls){var mx=Math.max(8,Math.floor(w/7.1));return '<rect class="nd '+(cls||'t')+'" x="'+(p.x-w/2).toFixed(1)+'" y="'+(p.y-h/2).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h+'" rx="7"/>'+txt(p.x,p.y,t,mx,cls==='c'?'dt c':'dt');}
function svgWrap(w,h,inner,label){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||'Sơ đồ')+'">'+inner+'</svg>';}
function dgCycle(g){var it=g.items,n=it.length,W=660,H=400,cx=330,cy=200,rx=235,ry=140,bw=152,bh=58,mid='m'+(++svgN),P=[],o=defs(mid);
for(var i=0;i<n;i++){var a=-Math.PI/2+2*Math.PI*i/n;P.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)});}
for(i=0;i<n;i++)o+=arrow(P[i],P[(i+1)%n],bw/2,bh/2,mid,6);
if(g.center)o+=box({x:cx,y:cy},170,62,g.center,'c');
for(i=0;i<n;i++)o+=box(P[i],bw,bh,it[i]);return svgWrap(W,H,o,g.caption);}
function dgFlow(g){var it=g.items,n=it.length,W=660,cols=n>5?Math.ceil(n/2):n,rows=n>5?2:1,gap=26,bw=(W-24-gap*(cols-1))/cols,bh=74,rh=112,H=rows*rh+10,mid='m'+(++svgN),P=[],o=defs(mid);
for(var i=0;i<n;i++){var r=Math.floor(i/cols),c=i%cols;P.push({x:12+bw/2+c*(bw+gap),y:10+rh/2+r*rh-8});}
for(i=1;i<n;i++)o+=arrow(P[i-1],P[i],bw/2,bh/2,mid,4);
for(i=0;i<n;i++)o+=box(P[i],bw,bh,it[i]);return svgWrap(W,H,o,g.caption);}
function dgLayers(g){var it=g.items,n=it.length,W=660,lh=52,gp=8,H=n*(lh+gp)+12,o='';
for(var i=0;i<n;i++){var w=250+360*(n>1?i/(n-1):1),x=(W-w)/2,y=6+i*(lh+gp),op=(0.10+0.5*(1-i/Math.max(1,n-1))).toFixed(2);
o+='<rect class="nd" x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+lh+'" rx="6" style="fill:var(--acc);fill-opacity:'+op+'"/>'+txt(W/2,y+lh/2,it[i],Math.floor(w/7.2));}
return svgWrap(W,H,o,g.caption);}
function dgMatrix(g){var it=g.items,W=660,H=430,x0=g.axes?96:20,y0=16,w=W-x0-16,h=H-y0-(g.axes?64:18),o='',Q=[[x0,y0],[x0+w/2,y0],[x0,y0+h/2],[x0+w/2,y0+h/2]];
for(var i=0;i<4;i++){o+='<rect class="nd t" x="'+(Q[i][0]+4)+'" y="'+(Q[i][1]+4)+'" width="'+(w/2-8)+'" height="'+(h/2-8)+'" rx="7"/>'+txt(Q[i][0]+w/4,Q[i][1]+h/4,it[i]||'',30);}
if(g.axes){var ax=g.axes.x,ay=g.axes.y,by=y0+h+14;
o+='<line class="axl" x1="'+x0+'" y1="'+by+'" x2="'+(x0+w)+'" y2="'+by+'"/>';
o+='<text class="ax" x="'+(x0+4)+'" y="'+(by+18)+'">'+esc(ax[1])+'</text><text class="ax" x="'+(x0+w-4)+'" y="'+(by+18)+'" text-anchor="end">'+esc(ax[2])+'</text><text class="ax" x="'+(x0+w/2)+'" y="'+(by+38)+'" text-anchor="middle" style="font-weight:600">'+esc(ax[0])+'</text>';
var lx=x0-14;o+='<line class="axl" x1="'+lx+'" y1="'+y0+'" x2="'+lx+'" y2="'+(y0+h)+'"/>';
o+='<text class="ax" x="'+(lx-6)+'" y="'+(y0+h-4)+'" text-anchor="end">'+esc(ay[1])+'</text><text class="ax" x="'+(lx-6)+'" y="'+(y0+12)+'" text-anchor="end">'+esc(ay[2])+'</text>';
o+='<text class="ax" transform="translate('+(lx-58)+','+(y0+h/2)+') rotate(-90)" text-anchor="middle" style="font-weight:600">'+esc(ay[0])+'</text>';}
return svgWrap(W,H,o,g.caption);}
function dgHub(g){var it=g.items,n=it.length-1,W=660,H=400,cx=330,cy=200,rx=235,ry=140,bw=150,bh=56,o='',P=[];
for(var i=0;i<n;i++){var a=-Math.PI/2+2*Math.PI*i/n;P.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)});}
for(i=0;i<n;i++){var dx=P[i].x-cx,dy=P[i].y-cy,L=Math.sqrt(dx*dx+dy*dy),ux=dx/L,uy=dy/L,s=edgeDist(ux,uy,88,33),e=edgeDist(ux,uy,bw/2,bh/2);
o+='<line class="ar" x1="'+(cx+ux*s).toFixed(1)+'" y1="'+(cy+uy*s).toFixed(1)+'" x2="'+(P[i].x-ux*e).toFixed(1)+'" y2="'+(P[i].y-uy*e).toFixed(1)+'"/>';}
o+=box({x:cx,y:cy},176,66,it[0],'c');for(i=0;i<n;i++)o+=box(P[i],bw,bh,it[i+1]);return svgWrap(W,H,o,g.caption);}
function diagram(g){var f={cycle:dgCycle,flow:dgFlow,layers:dgLayers,matrix:dgMatrix,hub:dgHub}[g.type];return f?f(g):'';}

/* meta map */
var RING=[1,2,6,3,5,4];
function metaMap(){var W=820,H=560,cx=410,cy=280,rx=300,ry=205,r=62,pos={},o='';
RING.forEach(function(id,i){var a=-Math.PI/2+2*Math.PI*i/6;pos[id]={x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)};});

box.innerHTML=h||'<div class="empty">Không có kết quả cho "'+esc(q)+'". Thử từ khóa ngắn hơn, tên tác giả hoặc thuật ngữ tiếng Anh.</div>';box.hidden=false;}
var qi=$('#q'),tmr=null;
qi.addEventListener('input',function(){clearTimeout(tmr);var v=this.value;tmr=setTimeout(function(){doSearch(v);},120);});
qi.addEventListener('keydown',function(e){if(e.key==='Escape'){$('#results').hidden=true;this.blur();}if(e.key==='Enter'){var f=$('#results a');if(f){location.hash=f.getAttribute('href');$('#results').hidden=true;}}if(e.key==='ArrowDown'){var a=$('#results a');if(a){e.preventDefault();a.focus();}}});
$('#results').addEventListener('keydown',function(e){var a=document.activeElement;if(e.key==='ArrowDown'&&a.nextElementSibling){e.preventDefault();a.nextElementSibling.focus();}if(e.key==='ArrowUp'){e.preventDefault();(a.previousElementSibling||qi).focus();}if(e.key==='Escape'){this.hidden=true;qi.focus();}});
$('#results').addEventListener('click',function(e){if(e.target.closest('a'))this.hidden=true;});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))$('#results').hidden=true;});
document.addEventListener('keydown',function(e){var t=e.target.tagName;if(e.key==='/'&&t!=='INPUT'&&t!=='TEXTAREA'){e.preventDefault();qi.focus();qi.select();}});
function highlight(root,q){var qf=fold(q.trim());if(qf.length<2)return;var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;while((n=w.nextNode())){if(n.parentNode&&!/^(SCRIPT|STYLE|BUTTON|tspan|text)$/i.test(n.parentNode.nodeName)&&!n.parentNode.closest('svg'))nodes.push(n);}
var first=null;nodes.forEach(function(nd){var s=nd.nodeValue,f=fold(s),i=f.indexOf(qf);if(i<0)return;var frag=document.createDocumentFragment(),last=0;
while(i>=0){frag.appendChild(document.createTextNode(s.slice(last,i)));var m=document.createElement('mark');m.textContent=s.slice(i,i+qf.length);frag.appendChild(m);if(!first)first=m;last=i+qf.length;i=f.indexOf(qf,last);}
frag.appendChild(document.createTextNode(s.slice(last)));nd.parentNode.replaceChild(frag,nd);});
if(first){var qz=first.closest('.qe');if(qz)qz.hidden=false;setTimeout(function(){try{first.scrollIntoView({block:'center'});}catch(e){}},30);}}

/* ---------- router (hash only, no History API) ---------- */
function parse(){var h=(location.hash||'').replace(/^#/,'')||'/',q='',i=h.indexOf('?');if(i>=0){var qs=h.slice(i+1);h=h.slice(0,i);var m=qs.match(/(?:^|&)q=([^&]*)/);if(m){try{q=decodeURIComponent(m[1]);}catch(e){q=m[1];}}}
return {parts:h.split('/').filter(Boolean),q:q};}
function route(){var r=parse(),p=r.parts,h;
try{switch(p[0]){case undefined:h=home();break;case 'd':h=domainPage(+p[1]);break;case 'c':h=chapterPage(p[1]+'.'+p[2]);break;case 'map':h=mapPage();break;case 'cases':h=casesPage();break;
case 'paths':h=pathsPage();break;case 'glossary':h=glossaryPage();break;case 'quiz':h=quizPage(p[1]);break;case 'stats':h=statsPage();break;default:h=notFound();}}
catch(err){h=notFound();if(window.console)console.error(err);}
var m=$('#main');m.innerHTML=h;updateSide(p);closeNav();window.scrollTo(0,0);
if(r.q)highlight(m,r.q);
var gq=$('#glq');if(gq){gq.addEventListener('input',function(){var f=fold(this.value.trim()),g=buildGloss().filter(function(x){return !f||fold(x.t+' '+x.d).indexOf(f)>=0;});$('#glbody').innerHTML=glossBody(g);});}}
$('#main').addEventListener('click',function(e){var o=e.target.closest('.opt');if(o){onOpt(o);return;}
var rb=e.target.closest('[data-read]');if(rb){var id=rb.getAttribute('data-read');if(readSet[id])delete readSet[id];else readSet[id]=1;saveRead();rb.textContent=readSet[id]?'Bỏ đánh dấu đã đọc':'Đánh dấu đã đọc';rb.classList.toggle('solid',!readSet[id]);updateSide(parse().parts);return;}
var lt=e.target.closest('[data-letter]');if(lt){e.preventDefault();var t=document.getElementById('gl-'+lt.getAttribute('data-letter'));if(t)t.scrollIntoView();return;}
if(e.target.closest('[data-reshuffle]')){e.preventDefault();route();return;}
if(e.target.closest('[data-reset]')){readSet={};saveRead();route();}});
window.addEventListener('hashchange',route);
buildSide();updateProg();route();
window.__VIII__={route:route,ORDER:ORDER,byId:byId};
})();
</script>
