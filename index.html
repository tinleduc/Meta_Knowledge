ực đoan hơn nhiều so với ý định của từng cá nhân."]],"diagram":{"type":"flow","items":["Định nghĩa tác nhân và thuộc tính","Viết quy tắc hành vi","Thiết lập môi trường và mạng tương tác","Chạy mô phỏng nhiều lần","Phân tích khuôn mẫu trồi","Hiệu chỉnh và kiểm định"],"caption":"Quy trình xây dựng mô hình dựa trên tác nhân."},"model":"Nguyên tắc KISS trong ABM: bắt đầu với quy tắc đơn giản nhất có thể tái tạo khuôn mẫu cần giải thích, sau đó mới thêm chi tiết. Mô hình quá phức tạp khó kiểm định và dễ cho ra kết quả mà không ai hiểu vì sao.","steps":["Xác định khuôn mẫu cấp hệ cần giải thích hoặc câu hỏi chính sách cần thử.","Chọn các loại tác nhân tối thiểu và thuộc tính cần thiết.","Viết quy tắc hành vi dựa trên dữ liệu hoặc lý thuyết hành vi.","Xây môi trường và cấu trúc tương tác, như lưới không gian hay mạng xã hội.","Chạy nhiều lần, phân tích độ nhạy với các tham số chính.","Kiểm định với dữ liệu thực và ghi lại giới hạn của mô hình."],"apps":[["Mô phỏng hành vi rút tiền trong kịch bản căng thẳng","Mỗi người gửi tiền là một tác nhân với ngưỡng lo ngại khác nhau, chịu ảnh hưởng từ mạng xã hội và tin tức. Mô hình cho thấy cùng một cú sốc có thể dẫn tới kết quả rất khác tùy cấu trúc mạng và tốc độ truyền tin. Đánh đổi: kết quả phụ thuộc nhiều vào giả định hành vi khó kiểm chứng, nên chỉ dùng để khám phá kịch bản chứ không để dự báo."],["Thử nghiệm chính sách phân bổ công việc","Mô phỏng đội hỗ trợ với tác nhân là nhân viên có kỹ năng khác nhau và ticket có độ khó khác nhau. So sánh hai chính sách: giao việc theo hàng đợi chung hay theo chuyên môn. Kết quả giúp chọn chính sách lai trước khi áp dụng thật, giảm rủi ro thay đổi quy trình trên người thật."]],"pitfalls":["Mô hình quá chi tiết ngay từ đầu, không thể giải thích kết quả.","Chạy một lần rồi coi kết quả là đáp án, bỏ qua biến thiên do ngẫu nhiên.","Trình bày kết quả mô phỏng như dự báo chắc chắn."],"links":[["1.4","So sánh với cách tiếp cận kho và dòng"],["2.1","ABM là công cụ mô phỏng hệ thích nghi phức hợp"],["3.8","Mô hình là một dạng tạo tác trong nghiên cứu khoa học thiết kế"]],"quiz":[["Mô hình Schelling minh họa điều gì?",["Sở thích nhẹ của cá nhân có thể tạo khuôn mẫu phân cư mạnh ở cấp hệ","Thị trường luôn hiệu quả","Dữ liệu luôn phân phối chuẩn","Tác nhân luôn hợp lý hoàn toàn"],0,"Khuôn mẫu cấp hệ cực đoan hơn nhiều so với ý định cá nhân."],["Điểm khác biệt chính giữa ABM và System Dynamics là gì?",["ABM không dùng máy tính","ABM giữ sự khác biệt giữa từng tác nhân thay vì dùng kho tổng hợp","ABM không có yếu tố ngẫu nhiên","System Dynamics không có phản hồi"],1,"System Dynamics làm việc với đại lượng tổng hợp; ABM mô phỏng từng tác nhân."],["Vì sao cần chạy mô hình ABM nhiều lần?",["Để máy tính nóng lên","Để thấy phân bố kết quả do yếu tố ngẫu nhiên","Vì lần đầu luôn sai","Để giảm số tác nhân"],1,"Mô phỏng Monte Carlo cho thấy dải kết quả có thể xảy ra."]],"refs":["Schelling, T. C. (1971). Dynamic Models of Segregation. Journal of Mathematical Sociology, 1(2).","Epstein, J. M. & Axtell, R. (1996). Growing Artificial Societies: Social Science from the Bottom Up. Brookings Institution Press / MIT Press.","Wilensky, U. & Rand, W. (2015). An Introduction to Agent-Based Modeling. MIT Press."],"legal":false,"words":909},{"n":7,"title":"Khung Cynefin","en":"Cynefin Framework","summary":"Cynefin là khung ra quyết định giúp nhận diện loại bối cảnh đang đối mặt để chọn cách hành động phù hợp. Khung phân biệt bối cảnh rõ ràng, phức tạp, phức hợp và hỗn loạn, cùng một vùng trung tâm là bối rối khi chưa biết mình đang ở đâu. Sai lầm phổ biến nhất trong quản trị là dùng cách làm của bối cảnh phức tạp cho vấn đề phức hợp.","origin":"Dave Snowden phát triển Cynefin từ năm 1999 khi làm việc tại IBM Global Services trong lĩnh vực quản trị tri thức. Cynefin là từ tiếng xứ Wales, thường được dịch là môi trường sống hay nơi chốn thân thuộc với nhiều tầng ý nghĩa. Bài báo A Leader's Framework for Decision Making của Snowden và Mary Boone trên Harvard Business Review (2007) đưa khung đến đông đảo nhà quản lý. Tên các vùng được điều chỉnh qua thời gian, vùng Simple sau đổi thành Obvious rồi Clear.","concepts":[["Bối cảnh rõ ràng (Clear)","Quan hệ nhân quả hiển nhiên, có thực hành tốt nhất. Cách làm: nhận biết, phân loại, phản ứng."],["Bối cảnh phức tạp (Complicated)","Có quan hệ nhân quả nhưng cần chuyên gia phân tích, có nhiều đáp án tốt. Cách làm: nhận biết, phân tích, phản ứng."],["Bối cảnh phức hợp (Complex)","Quan hệ nhân quả chỉ thấy được khi nhìn lại, không có đáp án đúng từ trước. Cách làm: thăm dò, nhận biết, phản ứng qua thử nghiệm an toàn để thất bại."],["Bối cảnh hỗn loạn (Chaotic)","Không có quan hệ nhân quả rõ ràng ở cấp hệ, cần hành động ngay để ổn định. Cách làm: hành động, nhận biết, phản ứng."],["Thử nghiệm an toàn để thất bại (Safe-to-fail probe)","Thử nghiệm nhỏ, song song, có tiêu chí khuếch đại hoặc dừng, dùng trong vùng phức hợp."]],"diagram":{"type":"matrix","items":["Phức hợp: thăm dò, nhận biết, phản ứng. Thực hành đang trồi","Phức tạp: nhận biết, phân tích, phản ứng. Thực hành tốt","Hỗn loạn: hành động, nhận biết, phản ứng. Thực hành mới","Rõ ràng: nhận biết, phân loại, phản ứng. Thực hành tốt nhất"],"caption":"Bốn vùng của Cynefin theo bố cục chuẩn; vùng bối rối nằm ở giữa khi chưa xác định được bối cảnh."},"model":"Ranh giới giữa vùng rõ ràng và hỗn loạn được Snowden mô tả như một vách đá: tổ chức quá tự tin vào thực hành tốt nhất có thể rơi đột ngột vào khủng hoảng. Một vấn đề lớn thường có các phần nằm ở các vùng khác nhau, nên cần phân rã trước khi chọn cách làm.","steps":["Mô tả vấn đề và liệt kê các thành phần của nó.","Với từng thành phần, hỏi: quan hệ nhân quả có rõ không, cần chuyên gia hay chỉ thấy khi nhìn lại?","Xếp thành phần vào vùng tương ứng, thừa nhận vùng bối rối nếu chưa chắc.","Chọn cách làm theo vùng: quy trình chuẩn, phân tích chuyên gia, thử nghiệm song song hoặc hành động khẩn cấp.","Với vùng phức hợp, thiết kế 3–5 thử nghiệm nhỏ có tiêu chí khuếch đại và dừng.","Theo dõi sự dịch chuyển giữa các vùng theo thời gian."],"apps":[["Phân rã một dự án chuyển đổi số","Nâng cấp hạ tầng máy chủ nằm ở vùng phức tạp, cần chuyên gia và kế hoạch chi tiết. Thay đổi hành vi khách hàng khi chuyển sang kênh số nằm ở vùng phức hợp, cần thử nghiệm ở vài chi nhánh và nhóm khách hàng. Quy trình mở tài khoản chuẩn nằm ở vùng rõ ràng. Dùng một phương pháp quản lý dự án duy nhất cho tất cả là nguồn gốc của thất vọng."],["Xử lý sự cố nghiêm trọng","Khi hệ thống thanh toán ngừng hoạt động giờ cao điểm, đội ứng cứu ở vùng hỗn loạn: ưu tiên hành động ổn định như chuyển sang hệ dự phòng, sau đó mới phân tích nguyên nhân. Sau khi ổn định, việc tìm nguyên nhân gốc chuyển sang vùng phức tạp. Đánh đổi: hành động nhanh có thể chưa tối ưu nhưng giảm thiệt hại."]],"pitfalls":["Dùng phân tích chuyên gia và kế hoạch chi tiết cho vấn đề phức hợp.","Coi Cynefin là ma trận hai trục để phân loại cố định; vấn đề có thể dịch chuyển giữa các vùng.","Bỏ qua vùng bối rối, tự tin xếp vấn đề vào vùng mình quen xử lý."],"links":[["4.6","Ra quyết định trong bất định sâu"],["2.1","Vùng phức hợp tương ứng với hệ thích nghi phức hợp"],["4.4","Phân tích đa tiêu chí phù hợp với vùng phức tạp"]],"quiz":[["Cách làm phù hợp với vùng phức hợp trong Cynefin là gì?",["Nhận biết, phân loại, phản ứng","Nhận biết, phân tích, phản ứng","Thăm dò, nhận biết, phản ứng","Hành động, nhận biết, phản ứng"],2,"Trong vùng phức hợp cần thử nghiệm để thấy khuôn mẫu trồi lên."],["Khi hệ thống thanh toán ngừng hoạt động giờ cao điểm, ưu tiên đầu tiên theo Cynefin là gì?",["Thành lập nhóm phân tích nguyên nhân gốc","Hành động để ổn định tình hình","Viết tài liệu thực hành tốt nhất","Chạy thử nghiệm A/B"],1,"Vùng hỗn loạn yêu cầu hành động ngay để ổn định trước khi phân tích."],["Ai phát triển khung Cynefin?",["Peter Senge","Dave Snowden","Russell Ackoff","Herbert Simon"],1,"Dave Snowden phát triển khung từ năm 1999 tại IBM."]],"refs":["Snowden, D. J. & Boone, M. E. (2007). A Leader's Framework for Decision Making. Harvard Business Review, 85(11).","Kurtz, C. F. & Snowden, D. J. (2003). The New Dynamics of Strategy: Sense-Making in a Complex and Complicated World. IBM Systems Journal, 42(3).","Snowden, D. & Friends (2020). Cynefin: Weaving Sense-Making into the Fabric of Our World. Cognitive Edge."],"legal":false,"words":957},{"n":8,"title":"Khả năng chống chịu và phản mong manh","en":"Resilience and Antifragility","summary":"Khả năng chống chịu là năng lực của hệ hấp thụ cú sốc, duy trì chức năng cốt lõi và phục hồi. Phản mong manh là bước xa hơn: hệ trở nên tốt hơn nhờ biến động và căng thẳng ở mức vừa phải. Với ngân hàng, đây không chỉ là chủ đề lý thuyết mà là yêu cầu quản trị: khả năng chống chịu hoạt động ngày càng được cơ quan quản lý quốc tế coi là trọng tâm.","origin":"Nhà sinh thái học C. S. Holling phân biệt khả năng chống chịu kỹ thuật và khả năng chống chịu sinh thái trong bài báo năm 1973. Nassim Taleb đặt ra thuật ngữ antifragile trong cuốn Antifragile (2012). Ủy ban Basel về Giám sát Ngân hàng ban hành Principles for Operational Resilience năm 2021. Kỹ thuật hỗn loạn (chaos engineering) được Netflix phát triển từ khoảng năm 2010 với công cụ Chaos Monkey.","concepts":[["Khả năng chống chịu kỹ thuật (Engineering resilience)","Tốc độ quay về trạng thái cân bằng cũ sau cú sốc."],["Khả năng chống chịu sinh thái (Ecological resilience)","Mức độ cú sốc mà hệ hấp thụ được trước khi chuyển sang một trạng thái hoàn toàn khác."],["Phản mong manh (Antifragility)","Thuộc tính của hệ được lợi từ biến động, như cơ bắp mạnh lên nhờ tập luyện hay tổ chức học từ các sự cố nhỏ."],["Dự phòng và dư địa (Redundancy and slack)","Năng lực dư thừa có chủ đích giúp hệ chịu được cú sốc, dù trông như lãng phí trong điều kiện bình thường."],["Kỹ thuật hỗn loạn (Chaos engineering)","Chủ động đưa lỗi có kiểm soát vào hệ thống để phát hiện điểm yếu trước khi sự cố thật xảy ra."]],"diagram":{"type":"flow","items":["Mong manh: tổn hại vì biến động","Bền vững: chịu được biến động","Chống chịu: phục hồi sau biến động","Phản mong manh: tốt hơn nhờ biến động"],"caption":"Phổ phản ứng của hệ trước biến động."},"model":"Tối ưu hóa hiệu quả quá mức thường làm hệ mong manh vì loại bỏ dư địa. Mục tiêu không phải loại bỏ hoàn toàn rủi ro, mà là thiết kế để các cú sốc nhỏ mang lại bài học trong khi cú sốc lớn không gây tổn hại không thể phục hồi.","steps":["Xác định các dịch vụ nghiệp vụ trọng yếu và ngưỡng gián đoạn chấp nhận được.","Lập bản đồ nguồn lực mà mỗi dịch vụ phụ thuộc: người, quy trình, công nghệ, đối tác, dữ liệu.","Tìm điểm lỗi đơn lẻ và các phụ thuộc tập trung.","Kiểm thử kịch bản gián đoạn nghiêm trọng nhưng có thể xảy ra.","Đầu tư dự phòng có chọn lọc cho điểm yếu trọng yếu nhất.","Biến sự cố nhỏ thành bài học có hệ thống qua đánh giá sau sự cố không đổ lỗi."],"apps":[["Khả năng chống chịu hoạt động cho dịch vụ thanh toán","Ngân hàng xác định thanh toán liên ngân hàng là dịch vụ trọng yếu với ngưỡng gián đoạn tối đa vài giờ. Bản đồ phụ thuộc cho thấy một đối tác kết nối duy nhất và một nhóm vận hành nhỏ. Giải pháp gồm kênh dự phòng, đào tạo chéo nhân sự và diễn tập định kỳ. Đánh đổi: chi phí duy trì năng lực dư phải được chấp nhận như phí bảo hiểm."],["Học từ sự cố nhỏ","Đội phát triển tổ chức buổi đánh giá sau sự cố không đổ lỗi cho mọi lỗi phát hành, kể cả lỗi nhỏ. Mỗi buổi tạo một thay đổi cụ thể cho pipeline kiểm thử. Theo thời gian, hệ thống phát hành trở nên an toàn hơn chính nhờ các lỗi nhỏ, một ví dụ thực tế của phản mong manh."]],"pitfalls":["Tối ưu chi phí bằng cách loại bỏ mọi dư địa và dự phòng.","Chỉ lập kế hoạch cho kịch bản đã từng xảy ra.","Đổ lỗi cá nhân sau sự cố, khiến mọi người che giấu lỗi nhỏ và mất cơ hội học."],"links":[["2.5","Chuẩn bị cho sự kiện đuôi dày"],["6.6","Đánh giá sau hành động biến sự cố thành bài học"],["1.6","Cân bằng đa dạng trong mô hình hệ khả tồn"]],"quiz":[["Theo Taleb, hệ phản mong manh có đặc điểm gì?",["Không bị ảnh hưởng bởi biến động","Trở nên tốt hơn nhờ biến động vừa phải","Luôn quay về trạng thái cũ","Tránh mọi rủi ro"],1,"Phản mong manh vượt lên trên sự bền vững: hệ hưởng lợi từ căng thẳng."],["Holling phân biệt hai loại khả năng chống chịu nào?",["Tài chính và vận hành","Kỹ thuật và sinh thái","Cá nhân và tập thể","Ngắn hạn và dài hạn"],1,"Bài báo năm 1973 phân biệt tốc độ phục hồi và khả năng hấp thụ trước khi chuyển trạng thái."],["Vì sao tối ưu hiệu quả quá mức có thể làm hệ mong manh?",["Vì tăng chi phí","Vì loại bỏ dư địa cần thiết để hấp thụ cú sốc","Vì tăng dự phòng","Vì giảm tốc độ"],1,"Dư địa trông như lãng phí nhưng là đệm chống sốc."]],"refs":["Holling, C. S. (1973). Resilience and Stability of Ecological Systems. Annual Review of Ecology and Systematics, 4.","Taleb, N. N. (2012). Antifragile: Things That Gain from Disorder. Random House.","Basel Committee on Banking Supervision (2021). Principles for Operational Resilience. Bank for International Settlements."],"legal":false,"words":886}]},{"id":3,"code":"VIII.3","title":"Research Methodology","vi":"Phương pháp luận nghiên cứu","color":"#8A6A1F","colorDark":"#D9B35E","intro":"Cách đặt câu hỏi, thu thập bằng chứng và rút ra kết luận đáng tin cậy, áp dụng từ nghiên cứu học thuật tới khảo sát người dùng, phân tích dữ liệu và đánh giá dự án.","question":"Làm sao biết điều chúng ta tin là đúng thực sự đúng?","chapters":[{"n":1,"title":"Hệ hình nghiên cứu","en":"Research Paradigms","summary":"Mọi nghiên cứu, kể cả một cuộc phỏng vấn người dùng hay một báo cáo phân tích dữ liệu, đều dựa trên giả định ngầm về bản chất thực tại và cách chúng ta biết về nó. Hệ hình nghiên cứu làm rõ các giả định này: thực chứng, diễn giải, hiện thực phê phán và thực dụng. Chọn hệ hình phù hợp giúp chọn đúng phương pháp và tránh kết luận vượt quá bằng chứng.","origin":"Thomas Kuhn phổ biến khái niệm paradigm trong The Structure of Scientific Revolutions (1962), mô tả khoa học tiến triển qua các giai đoạn khoa học bình thường xen kẽ cách mạng hệ hình. Karl Popper trước đó đề xuất tiêu chí khả năng bác bỏ trong Logik der Forschung (1934). Roy Bhaskar phát triển hiện thực phê phán từ năm 1975. Pragmatism bắt nguồn từ Charles Peirce, William James và John Dewey. Mô hình củ hành nghiên cứu của Saunders, Lewis và Thornhill phổ biến trong đào tạo nghiên cứu kinh doanh.","concepts":[["Bản thể luận (Ontology)","Giả định về bản chất thực tại: có một thực tại khách quan độc lập với người quan sát, hay thực tại được kiến tạo xã hội?"],["Nhận thức luận (Epistemology)","Giả định về điều gì được coi là tri thức hợp lệ và cách đạt được nó."],["Thực chứng (Positivism)","Tìm quy luật khách quan qua quan sát và đo lường, ưu tiên phương pháp định lượng và kiểm định giả thuyết."],["Diễn giải (Interpretivism)","Hiểu ý nghĩa mà con người gán cho trải nghiệm, ưu tiên phương pháp định tính và bối cảnh."],["Thực dụng (Pragmatism)","Chọn phương pháp theo câu hỏi nghiên cứu và giá trị thực tiễn của kết quả, thường dẫn tới phương pháp hỗn hợp."]],"diagram":{"type":"layers","items":["Kỹ thuật và thủ tục thu thập, phân tích","Khung thời gian: cắt ngang hay dọc","Chiến lược: thực nghiệm, khảo sát, tình huống","Lựa chọn phương pháp: đơn, đa, hỗn hợp","Cách tiếp cận: suy diễn, quy nạp, giả định dẫn","Triết lý nghiên cứu"],"caption":"Mô hình củ hành nghiên cứu theo Saunders và cộng sự: đi từ lớp ngoài là triết lý vào lõi là kỹ thuật cụ thể. Ở đây vẽ lõi ở trên cùng."},"model":"Người làm thực tiễn thường nhảy thẳng vào lớp kỹ thuật như làm khảo sát hay phỏng vấn. Đi qua các lớp ngoài trước giúp tránh tình trạng dùng khảo sát định lượng để trả lời câu hỏi vì sao, vốn cần phương pháp định tính.","steps":["Viết câu hỏi nghiên cứu và xác định loại câu hỏi: bao nhiêu, cái gì, vì sao, như thế nào.","Nêu giả định về thực tại và tri thức mà câu hỏi ngầm chứa.","Chọn hệ hình phù hợp nhất và ghi rõ lý do.","Chọn cách tiếp cận: kiểm định lý thuyết có sẵn hay xây dựng lý thuyết từ dữ liệu.","Chọn chiến lược và phương pháp nhất quán với các lựa chọn trên.","Ghi lại giới hạn mà hệ hình đặt ra cho việc khái quát hóa kết quả."],"apps":[["Nghiên cứu vì sao khách hàng bỏ dở đăng ký trực tuyến","Câu hỏi bao nhiêu phần trăm bỏ dở và ở bước nào phù hợp tiếp cận thực chứng với dữ liệu phân tích hành vi. Câu hỏi vì sao họ bỏ dở cần tiếp cận diễn giải qua phỏng vấn và quan sát. Một nghiên cứu thực dụng kết hợp cả hai sẽ cho kết luận hữu ích hơn. Đánh đổi: tốn thời gian và năng lực phân tích hơn."],["Đánh giá hiệu quả đào tạo nội bộ","Đo điểm bài kiểm tra trước và sau khóa học là cách nhìn thực chứng. Tìm hiểu học viên áp dụng kiến thức vào công việc thế nào đòi hỏi cách nhìn diễn giải. Ghi rõ hệ hình giúp người đọc báo cáo biết kết luận nào là đo lường khách quan và kết luận nào là diễn giải từ trải nghiệm."]],"pitfalls":["Dùng khảo sát định lượng để trả lời câu hỏi vì sao hoặc như thế nào.","Trộn phương pháp mà không có lý do nhất quán, dẫn tới kết quả không so sánh được.","Coi kết quả định tính là kém khoa học chỉ vì không có con số."],"links":[["3.4","Thực dụng thường dẫn tới phương pháp hỗn hợp"],["1.7","Tư duy hệ thống mềm có gốc diễn giải"],["3.8","Nghiên cứu khoa học thiết kế là hệ hình hướng tạo tác"]],"quiz":[["Câu hỏi nào về bản chất thực tại thuộc về bản thể luận?",["Nên dùng khảo sát hay phỏng vấn?","Thực tại tồn tại khách quan hay được kiến tạo xã hội?","Cỡ mẫu bao nhiêu là đủ?","Nên dùng phần mềm nào?"],1,"Bản thể luận hỏi về bản chất thực tại; nhận thức luận hỏi về tri thức."],["Hệ hình nào chọn phương pháp chủ yếu theo câu hỏi nghiên cứu và giá trị thực tiễn?",["Thực chứng","Diễn giải","Thực dụng","Hậu hiện đại"],2,"Pragmatism ưu tiên cái hữu ích để trả lời câu hỏi."],["Ai phổ biến khái niệm hệ hình trong khoa học năm 1962?",["Karl Popper","Thomas Kuhn","John Dewey","Roy Bhaskar"],1,"Kuhn trình bày trong The Structure of Scientific Revolutions."]],"refs":["Kuhn, T. S. (1962). The Structure of Scientific Revolutions. University of Chicago Press.","Saunders, M., Lewis, P. & Thornhill, A. (2019). Research Methods for Business Students (8th ed.). Pearson.","Creswell, J. W. & Creswell, J. D. (2018). Research Design: Qualitative, Quantitative, and Mixed Methods Approaches (5th ed.). SAGE."],"legal":false,"words":915},{"n":2,"title":"Thiết kế nghiên cứu định lượng","en":"Quantitative Research Design","summary":"Nghiên cứu định lượng trả lời câu hỏi bằng dữ liệu số thu thập có hệ thống: bao nhiêu, mức độ nào, có khác biệt hay quan hệ không. Các thiết kế chính gồm thực nghiệm, bán thực nghiệm, khảo sát và tương quan. Chất lượng kết luận phụ thuộc vào hai loại hiệu lực: hiệu lực nội tại, tức kết luận nhân quả có đúng không, và hiệu lực bên ngoài, tức kết quả có khái quát được không.","origin":"Ronald Fisher đặt nền móng cho thiết kế thực nghiệm hiện đại với The Design of Experiments (1935), gồm ngẫu nhiên hóa và lặp lại. Donald Campbell và Julian Stanley hệ thống hóa các thiết kế bán thực nghiệm năm 1963; Shadish, Cook và Campbell cập nhật năm 2002. Thử nghiệm A/B trên sản phẩm số là ứng dụng hiện đại của thực nghiệm ngẫu nhiên có đối chứng, được Kohavi, Tang và Xu hệ thống hóa năm 2020.","concepts":[["Biến độc lập và biến phụ thuộc (Independent and dependent variables)","Biến độc lập là yếu tố được thay đổi hoặc so sánh; biến phụ thuộc là kết quả được đo."],["Ngẫu nhiên hóa (Randomization)","Phân nhóm ngẫu nhiên để các yếu tố gây nhiễu phân bổ đều, là nền tảng của suy luận nhân quả trong thực nghiệm."],["Hiệu lực nội tại (Internal validity)","Mức độ tin cậy rằng thay đổi ở biến phụ thuộc là do biến độc lập chứ không do yếu tố khác."],["Hiệu lực bên ngoài (External validity)","Mức độ kết quả khái quát được sang người, bối cảnh và thời điểm khác."],["Bán thực nghiệm (Quasi-experiment)","Thiết kế có can thiệp nhưng không phân nhóm ngẫu nhiên, như so sánh chi nhánh thí điểm với chi nhánh tương đồng."]],"diagram":{"type":"flow","items":["Câu hỏi và giả thuyết","Biến số và thang đo","Chọn thiết kế","Thu thập dữ liệu","Phân tích thống kê","Diễn giải và giới hạn"],"caption":"Quy trình thiết kế nghiên cứu định lượng."},"model":"Quyết định quan trọng nhất nằm ở bước chọn thiết kế: nếu cần kết luận nhân quả, ưu tiên thực nghiệm ngẫu nhiên; nếu không thể ngẫu nhiên hóa, chọn thiết kế bán thực nghiệm mạnh nhất có thể và nêu rõ các mối đe dọa với hiệu lực nội tại.","steps":["Viết giả thuyết có thể kiểm định, gồm hướng tác động và biến số cụ thể.","Định nghĩa thao tác cho từng biến: đo bằng gì, đơn vị gì, từ nguồn dữ liệu nào.","Chọn thiết kế phù hợp với mục tiêu nhân quả hay mô tả.","Tính cỡ mẫu cần thiết dựa trên hiệu ứng tối thiểu có ý nghĩa thực tiễn.","Đăng ký trước kế hoạch phân tích để tránh tìm kết quả sau khi thấy dữ liệu.","Phân tích, báo cáo cả kết quả không có ý nghĩa thống kê và nêu giới hạn."],"apps":[["Thử nghiệm A/B màn hình đăng ký thẻ","Nhóm sản phẩm thử hai phiên bản màn hình đăng ký với người dùng được phân ngẫu nhiên. Biến phụ thuộc là tỷ lệ hoàn thành đăng ký, kèm chỉ số bảo vệ là tỷ lệ hồ sơ bị từ chối ở bước thẩm định. Nếu chỉ đo tỷ lệ hoàn thành, một phiên bản dễ dãi có thể tăng đăng ký nhưng tăng hồ sơ kém chất lượng. Đánh đổi: thêm chỉ số bảo vệ làm tăng cỡ mẫu và thời gian thử."],["Đánh giá chương trình thí điểm tại chi nhánh","Không thể chọn ngẫu nhiên chi nhánh vì lý do vận hành, nhóm dự án dùng thiết kế khác biệt trong khác biệt, so sánh thay đổi ở chi nhánh thí điểm với chi nhánh đối chứng tương đồng trước và sau triển khai. Cần kiểm tra giả định hai nhóm có xu hướng song song trước can thiệp."]],"pitfalls":["Kết luận nhân quả từ dữ liệu quan sát không có thiết kế đối chứng.","Dừng thử nghiệm A/B sớm ngay khi thấy kết quả có ý nghĩa thống kê.","Đo quá nhiều chỉ số rồi chỉ báo cáo chỉ số có kết quả đẹp."],"links":[["3.5","Đo lường và cỡ mẫu"],["3.6","Suy luận thống kê và nhân quả"],["5.5","Thử nghiệm trên khách hàng cần cân nhắc đạo đức"]],"quiz":[["Yếu tố nào là nền tảng giúp thực nghiệm hỗ trợ kết luận nhân quả?",["Cỡ mẫu lớn","Phân nhóm ngẫu nhiên","Dùng phần mềm thống kê","Thu thập dữ liệu nhanh"],1,"Ngẫu nhiên hóa phân bổ đều các yếu tố gây nhiễu giữa các nhóm."],["So sánh chi nhánh thí điểm với chi nhánh tương đồng không được chọn ngẫu nhiên là thiết kế gì?",["Thực nghiệm ngẫu nhiên","Bán thực nghiệm","Nghiên cứu tình huống","Tổng quan hệ thống"],1,"Có can thiệp nhưng không ngẫu nhiên hóa là đặc điểm của bán thực nghiệm."],["Vì sao nên đăng ký trước kế hoạch phân tích?",["Để tránh tìm kết quả sau khi đã thấy dữ liệu","Để giảm chi phí","Vì quy định bắt buộc mọi nơi","Để tăng cỡ mẫu"],0,"Đăng ký trước hạn chế thiên lệch do chọn phân tích theo kết quả."]],"refs":["Fisher, R. A. (1935). The Design of Experiments. Oliver & Boyd.","Shadish, W. R., Cook, T. D. & Campbell, D. T. (2002). Experimental and Quasi-Experimental Designs for Generalized Causal Inference. Houghton Mifflin.","Kohavi, R., Tang, D. & Xu, Y. (2020). Trustworthy Online Controlled Experiments: A Practical Guide to A/B Testing. Cambridge University Press."],"legal":false,"words":902},{"n":3,"title":"Nghiên cứu định tính","en":"Qualitative Research","summary":"Nghiên cứu định tính tìm hiểu ý nghĩa, trải nghiệm và quá trình qua dữ liệu dạng lời nói, văn bản và quan sát. Đây là công cụ chính để trả lời câu hỏi vì sao và như thế nào, cũng là nền tảng của khơi gợi yêu cầu trong phân tích nghiệp vụ. Chất lượng không đo bằng cỡ mẫu mà bằng độ sâu, tính hệ thống và độ tin cậy của quá trình diễn giải.","origin":"Barney Glaser và Anselm Strauss giới thiệu lý thuyết nền (grounded theory) trong The Discovery of Grounded Theory (1967). Clifford Geertz đưa ra khái niệm mô tả dày (thick description) năm 1973. Yvonna Lincoln và Egon Guba đề xuất tiêu chí đáng tin cậy cho nghiên cứu định tính năm 1985. Virginia Braun và Victoria Clarke công bố quy trình phân tích chủ đề sáu bước năm 2006, hiện là một trong những bài báo phương pháp được trích dẫn nhiều nhất.","concepts":[["Phỏng vấn bán cấu trúc (Semi-structured interview)","Phỏng vấn theo bộ câu hỏi định hướng nhưng linh hoạt đào sâu theo câu trả lời."],["Phân tích chủ đề (Thematic analysis)","Quy trình xác định, phân tích và báo cáo các khuôn mẫu ý nghĩa trong dữ liệu định tính."],["Mã hóa (Coding)","Gắn nhãn cho đoạn dữ liệu để nhóm các ý tương tự, từ mã mở tới mã trục và mã chọn lọc."],["Bão hòa dữ liệu (Data saturation)","Thời điểm dữ liệu mới không còn tạo ra mã hay chủ đề mới đáng kể."],["Độ đáng tin cậy (Trustworthiness)","Theo Lincoln và Guba gồm độ tin được, khả năng chuyển giao, độ tin cậy quy trình và khả năng xác nhận."]],"diagram":{"type":"flow","items":["Làm quen dữ liệu","Tạo mã ban đầu","Tìm chủ đề","Rà soát chủ đề","Định nghĩa và đặt tên chủ đề","Viết báo cáo"],"caption":"Sáu giai đoạn phân tích chủ đề theo Braun và Clarke (2006); quá trình lặp đi lặp lại chứ không tuyến tính."},"model":"Phân tích chủ đề đặc biệt hữu ích cho BA khi tổng hợp nhiều buổi phỏng vấn stakeholder: thay vì liệt kê yêu cầu theo từng người, BA tìm các chủ đề xuyên suốt, những điểm đau chung và những mâu thuẫn cần giải quyết.","steps":["Xác định mục tiêu và chọn người tham gia có chủ đích, đa dạng vai trò.","Soạn hướng dẫn phỏng vấn với câu hỏi mở, tránh câu hỏi dẫn dắt.","Ghi âm có đồng ý hoặc ghi chép chi tiết ngay sau buổi phỏng vấn.","Mã hóa dữ liệu, tốt nhất có người thứ hai mã hóa độc lập một phần để đối chiếu.","Tổng hợp chủ đề, kiểm tra lại với dữ liệu gốc và với người tham gia.","Báo cáo chủ đề kèm trích dẫn minh họa và nêu giới hạn về phạm vi người tham gia."],"apps":[["Khơi gợi yêu cầu cho hệ thống nhân sự","BA phỏng vấn 12 người thuộc bộ phận tuyển dụng, tính lương, đào tạo và quản lý tuyến. Phân tích chủ đề cho thấy vấn đề chung không phải thiếu tính năng mà là dữ liệu nhân viên bị nhập nhiều lần ở nhiều nơi. Phát hiện này định hướng lại phạm vi dự án theo hướng dữ liệu chủ. Đánh đổi: cần thêm hai tuần phân tích trước khi viết BRD."],["Tìm hiểu trải nghiệm khiếu nại của khách hàng","Thay vì chỉ đếm số khiếu nại theo loại, nhóm trải nghiệm khách hàng phỏng vấn sâu một số khách hàng đã khiếu nại. Chủ đề nổi bật là cảm giác không biết khiếu nại đang được xử lý tới đâu. Giải pháp là thông báo trạng thái chủ động, chi phí thấp nhưng cải thiện đáng kể mức hài lòng."]],"pitfalls":["Đặt câu hỏi dẫn dắt như anh chị có thấy hệ thống này chậm không.","Chỉ phỏng vấn người ủng hộ dự án, bỏ qua người dùng cuối và người phản đối.","Trình bày ý kiến của một người nói nhiều nhất như chủ đề chung."],"links":[["3.4","Kết hợp định tính và định lượng"],["1.7","Bức tranh phong phú trong SSM dùng dữ liệu định tính"],["6.2","Phỏng vấn là cách làm lộ tri thức ngầm"]],"quiz":[["Bão hòa dữ liệu trong nghiên cứu định tính là gì?",["Đã phỏng vấn đủ 30 người","Dữ liệu mới không còn tạo mã hay chủ đề mới đáng kể","Dữ liệu đầy ổ cứng","Mọi người tham gia đồng ý với nhau"],1,"Bão hòa là tiêu chí phổ biến để quyết định dừng thu thập."],["Ai công bố quy trình phân tích chủ đề sáu giai đoạn năm 2006?",["Glaser và Strauss","Braun và Clarke","Lincoln và Guba","Creswell và Plano Clark"],1,"Braun và Clarke công bố trong Qualitative Research in Psychology."],["Câu hỏi phỏng vấn nào ít dẫn dắt nhất?",["Anh chị thấy hệ thống này chậm phải không?","Anh chị có ghét quy trình này không?","Anh chị mô tả cho tôi lần gần nhất anh chị xử lý hồ sơ này?","Hệ thống mới sẽ tốt hơn đúng không?"],2,"Yêu cầu mô tả trải nghiệm cụ thể giúp tránh áp đặt quan điểm."]],"refs":["Glaser, B. G. & Strauss, A. L. (1967). The Discovery of Grounded Theory. Aldine.","Braun, V. & Clarke, V. (2006). Using Thematic Analysis in Psychology. Qualitative Research in Psychology, 3(2).","Lincoln, Y. S. & Guba, E. G. (1985). Naturalistic Inquiry. SAGE."],"legal":false,"words":895},{"n":4,"title":"Phương pháp hỗn hợp","en":"Mixed Methods Research","summary":"Phương pháp hỗn hợp kết hợp dữ liệu định lượng và định tính trong cùng một nghiên cứu để có bức tranh đầy đủ hơn mỗi phương pháp riêng lẻ. Giá trị không nằm ở việc làm cả hai, mà ở cách tích hợp: dùng kết quả của phương pháp này để giải thích, kiểm chứng hoặc xây dựng cho phương pháp kia. Đây là thiết kế tự nhiên nhất cho nghiên cứu ứng dụng trong tổ chức.","origin":"Norman Denzin (1970) đề xuất khái niệm tam giác hóa, dùng nhiều nguồn và phương pháp để kiểm chứng kết luận. Abbas Tashakkori, Charles Teddlie, John Creswell và Vicki Plano Clark hệ thống hóa phương pháp hỗn hợp như một cách tiếp cận riêng từ cuối thập niên 1990. Creswell và Plano Clark mô tả ba thiết kế cốt lõi trong Designing and Conducting Mixed Methods Research.","concepts":[["Tam giác hóa (Triangulation)","Dùng nhiều nguồn dữ liệu, phương pháp hoặc người nghiên cứu để kiểm chứng chéo một kết luận."],["Thiết kế hội tụ (Convergent design)","Thu thập định lượng và định tính song song rồi so sánh, hợp nhất kết quả."],["Thiết kế giải thích tuần tự (Explanatory sequential design)","Định lượng trước để thấy cái gì, định tính sau để giải thích vì sao."],["Thiết kế khám phá tuần tự (Exploratory sequential design)","Định tính trước để khám phá, định lượng sau để kiểm định hoặc đo quy mô."],["Tích hợp (Integration)","Điểm và cách hai loại dữ liệu được kết nối: khi thiết kế, khi thu thập, khi phân tích hay khi diễn giải."]],"diagram":{"type":"hub","items":["Phương pháp hỗn hợp","Hội tụ: song song rồi so sánh","Giải thích tuần tự: định lượng rồi định tính","Khám phá tuần tự: định tính rồi định lượng","Tam giác hóa nhiều nguồn"],"caption":"Các thiết kế cốt lõi của phương pháp hỗn hợp."},"model":"Chọn thiết kế theo mục đích: cần giải thích một kết quả số bất ngờ thì dùng giải thích tuần tự; cần xây dựng bảng hỏi cho một chủ đề mới thì dùng khám phá tuần tự; cần kiểm chứng một kết luận quan trọng thì dùng hội tụ.","steps":["Viết rõ lý do cần cả hai loại dữ liệu, không làm hỗn hợp chỉ vì trông đầy đủ hơn.","Chọn thiết kế cốt lõi và vẽ sơ đồ trình tự các giai đoạn.","Xác định điểm tích hợp: kết quả nào của giai đoạn trước dùng cho giai đoạn sau.","Chọn mẫu phù hợp cho từng phần, mẫu định tính có thể lấy từ mẫu định lượng.","Phân tích riêng từng phần rồi tích hợp bằng bảng đối chiếu kết quả.","Giải thích các điểm mâu thuẫn thay vì bỏ qua chúng."],"apps":[["Đánh giá mức độ chấp nhận ứng dụng nội bộ","Dữ liệu sử dụng cho thấy một nhóm chi nhánh có tỷ lệ dùng thấp bất thường. Nhóm dự án phỏng vấn nhân viên tại các chi nhánh này và phát hiện đường truyền yếu khiến ứng dụng chậm, không phải do thiếu đào tạo như giả định ban đầu. Thiết kế giải thích tuần tự giúp tránh đầu tư sai vào đào tạo lại."],["Xây dựng khảo sát mức độ sẵn sàng chuyển đổi công cụ làm việc","Trước khi khảo sát toàn đơn vị, nhóm phỏng vấn một số người dùng để hiểu mối lo ngại thực tế, sau đó dùng các chủ đề này làm câu hỏi khảo sát định lượng. Đánh đổi: thời gian kéo dài hơn, nhưng bảng hỏi đo đúng điều quan trọng với người dùng."]],"pitfalls":["Làm hai nghiên cứu riêng rẽ rồi đặt kết quả cạnh nhau mà không tích hợp.","Coi phần định tính chỉ là phụ họa cho con số.","Bỏ qua các kết quả mâu thuẫn giữa hai phương pháp thay vì tìm hiểu nguyên nhân."],"links":[["3.2","Phần định lượng của thiết kế"],["3.3","Phần định tính của thiết kế"],["3.1","Hệ hình thực dụng làm nền cho phương pháp hỗn hợp"]],"quiz":[["Thiết kế nào phù hợp khi cần giải thích một kết quả số bất ngờ?",["Khám phá tuần tự","Giải thích tuần tự","Chỉ định lượng","Chỉ định tính"],1,"Giải thích tuần tự dùng định tính để giải thích kết quả định lượng."],["Tam giác hóa được Denzin đề xuất nhằm mục đích gì?",["Giảm chi phí","Kiểm chứng chéo kết luận bằng nhiều nguồn hoặc phương pháp","Tăng tốc nghiên cứu","Tránh phải phân tích"],1,"Nhiều góc nhìn hội tụ làm kết luận đáng tin hơn."],["Giá trị cốt lõi của phương pháp hỗn hợp nằm ở đâu?",["Làm cả hai loại nghiên cứu","Cách tích hợp hai loại dữ liệu","Có nhiều biểu đồ hơn","Có nhiều người tham gia hơn"],1,"Không tích hợp thì chỉ là hai nghiên cứu đặt cạnh nhau."]],"refs":["Creswell, J. W. & Plano Clark, V. L. (2018). Designing and Conducting Mixed Methods Research (3rd ed.). SAGE.","Denzin, N. K. (1970). The Research Act: A Theoretical Introduction to Sociological Methods. Aldine.","Tashakkori, A. & Teddlie, C. (Eds.) (2010). SAGE Handbook of Mixed Methods in Social and Behavioral Research (2nd ed.). SAGE."],"legal":false,"words":846},{"n":5,"title":"Chọn mẫu, đo lường, hiệu lực và độ tin cậy","en":"Sampling, Measurement, Validity and Reliability","summary":"Kết luận chỉ tốt bằng dữ liệu tạo ra nó. Chương này bàn về hai câu hỏi nền tảng: ai được đưa vào dữ liệu và công cụ đo có đo đúng điều cần đo một cách nhất quán không. Sai lệch chọn mẫu và sai số đo lường là hai nguồn gây kết luận sai phổ biến nhất trong báo cáo khảo sát và phân tích dữ liệu doanh nghiệp.","origin":"Rensis Likert giới thiệu thang đo mang tên ông năm 1932. Lee Cronbach đề xuất hệ số alpha đo độ nhất quán nội tại năm 1951, và cùng Paul Meehl phát triển khái niệm hiệu lực cấu trúc năm 1955. Jacob Cohen phổ biến phân tích năng lực thống kê qua cuốn sách năm 1969, tái bản 1988. Cuộc thăm dò bầu cử Mỹ năm 1936 của tạp chí Literary Digest là ví dụ kinh điển về sai lệch chọn mẫu dù cỡ mẫu rất lớn.","concepts":[["Chọn mẫu xác suất (Probability sampling)","Mỗi đơn vị trong tổng thể có xác suất được chọn biết trước, như ngẫu nhiên đơn giản, phân tầng, cụm."],["Sai lệch chọn mẫu (Selection bias)","Mẫu khác tổng thể một cách hệ thống, như chỉ khảo sát khách hàng dùng ứng dụng rồi kết luận cho mọi khách hàng."],["Độ tin cậy (Reliability)","Mức độ công cụ đo cho kết quả nhất quán khi đo lặp lại hoặc giữa các câu hỏi cùng đo một khái niệm."],["Hiệu lực cấu trúc (Construct validity)","Mức độ công cụ đo thực sự đo được khái niệm lý thuyết cần đo, như mức độ hài lòng hay mức độ gắn kết."],["Năng lực thống kê (Statistical power)","Xác suất phát hiện được hiệu ứng nếu nó thực sự tồn tại; phụ thuộc cỡ mẫu, độ lớn hiệu ứng và mức ý nghĩa."]],"diagram":{"type":"matrix","items":["Hiệu lực cao, tin cậy thấp: trung bình gần đúng nhưng phân tán","Hiệu lực cao, tin cậy cao: mục tiêu cần đạt","Hiệu lực thấp, tin cậy thấp: vừa lệch vừa phân tán","Hiệu lực thấp, tin cậy cao: nhất quán nhưng lệch hệ thống"],"caption":"Hiệu lực và độ tin cậy là hai khía cạnh độc lập của chất lượng đo lường.","axes":{"x":["Độ tin cậy","Thấp","Cao"],"y":["Hiệu lực","Thấp","Cao"]}},"model":"Góc dưới bên phải là cái bẫy nguy hiểm nhất: công cụ cho kết quả rất ổn định nên tạo cảm giác tin tưởng, nhưng lại đo sai khái niệm. Ví dụ đo năng suất lập trình viên bằng số dòng code rất nhất quán nhưng hiệu lực thấp.","steps":["Định nghĩa tổng thể mục tiêu và khung chọn mẫu, kiểm tra ai bị bỏ sót.","Chọn phương pháp chọn mẫu, ưu tiên xác suất nếu cần khái quát hóa.","Tính cỡ mẫu dựa trên độ lớn hiệu ứng tối thiểu có ý nghĩa và năng lực mong muốn, thường là 80%.","Dùng thang đo đã được kiểm định nếu có, hoặc thử nghiệm trước với nhóm nhỏ.","Kiểm tra độ tin cậy và hiệu lực sau khi thu thập, như alpha Cronbach và phân tích nhân tố.","Theo dõi tỷ lệ phản hồi và phân tích sai lệch do không phản hồi."],"apps":[["Khảo sát mức độ hài lòng của nhân viên với công cụ nội bộ","Khảo sát chỉ gửi qua email cho người đã đăng nhập công cụ trong tháng, nên bỏ qua những người đã bỏ dùng vì bất tiện, đúng nhóm có thông tin quan trọng nhất. Sửa khung chọn mẫu theo danh sách nhân sự thay vì danh sách người dùng giúp kết quả phản ánh đúng hơn. Đánh đổi: tỷ lệ phản hồi thấp hơn và cần nhắc nhở nhiều hơn."],["Chỉ số đo năng suất đội phát triển","Đội đề xuất đo năng suất bằng số story point hoàn thành. Chỉ số này tin cậy trong một đội nhưng hiệu lực thấp khi so sánh giữa các đội vì mỗi đội ước lượng khác nhau. Dùng thêm thời gian chu trình và tỷ lệ lỗi sau phát hành cho bức tranh có hiệu lực hơn."]],"pitfalls":["Nghĩ rằng cỡ mẫu lớn khắc phục được sai lệch chọn mẫu.","Tự viết câu hỏi khảo sát mà không thử nghiệm trước.","Tính cỡ mẫu sau khi đã thu thập dữ liệu để biện minh kết quả."],"links":[["3.2","Đo lường là nền của thiết kế định lượng"],["3.6","Năng lực thống kê liên quan tới kiểm định"],["4.8","Nhiễu trong đánh giá của con người cũng là vấn đề đo lường"]],"quiz":[["Công cụ đo cho kết quả rất nhất quán nhưng đo sai khái niệm có đặc điểm gì?",["Tin cậy cao, hiệu lực thấp","Tin cậy thấp, hiệu lực cao","Tin cậy cao, hiệu lực cao","Tin cậy thấp, hiệu lực thấp"],0,"Nhất quán là độ tin cậy; đo đúng khái niệm là hiệu lực."],["Cuộc thăm dò của Literary Digest năm 1936 là ví dụ kinh điển về điều gì?",["Cỡ mẫu quá nhỏ","Sai lệch chọn mẫu dù cỡ mẫu rất lớn","Thang đo Likert sai","Lỗi phần mềm"],1,"Mẫu lấy từ danh bạ điện thoại và đăng ký xe thiên lệch về nhóm khá giả."],["Năng lực thống kê là gì?",["Tốc độ máy tính khi phân tích","Xác suất phát hiện hiệu ứng nếu nó thực sự tồn tại","Số biến trong mô hình","Mức ý nghĩa 5%"],1,"Năng lực thường được đặt ở mức 80% khi tính cỡ mẫu."]],"refs":["Cronbach, L. J. & Meehl, P. E. (1955). Construct Validity in Psychological Tests. Psychological Bulletin, 52(4).","Cohen, J. (1988). Statistical Power Analysis for the Behavioral Sciences (2nd ed.). Lawrence Erlbaum.","Groves, R. M. et al. (2009). Survey Methodology (2nd ed.). Wiley."],"legal":false,"words":932},{"n":6,"title":"Suy luận thống kê và suy luận nhân quả","en":"Statistical and Causal Inference","summary":"Suy luận thống kê giúp đánh giá mức độ chắc chắn khi kết luận từ mẫu cho tổng thể; suy luận nhân quả giúp trả lời liệu một can thiệp có thực sự gây ra kết quả không. Nhầm tương quan với nhân quả và hiểu sai giá trị p là hai lỗi phổ biến nhất trong báo cáo phân tích. Khung bậc thang nhân quả của Judea Pearl giúp phân biệt rõ ba cấp độ câu hỏi.","origin":"Fisher phổ biến giá trị p từ thập niên 1920, còn Jerzy Neyman và Egon Pearson phát triển khung kiểm định giả thuyết với sai lầm loại I và loại II. Donald Rubin phát triển mô hình kết quả tiềm năng từ năm 1974. Judea Pearl xây dựng khung đồ thị nhân quả và phép tính can thiệp, nhận giải Turing năm 2011. Hiệp hội Thống kê Hoa Kỳ ra tuyên bố về giá trị p năm 2016 để hạn chế việc sử dụng sai. Joshua Angrist, Guido Imbens và David Card nhận Nobel Kinh tế năm 2021 cho đóng góp vào phương pháp nhân quả với dữ liệu quan sát.","concepts":[["Giá trị p (p-value)","Xác suất quan sát được dữ liệu cực đoan như vậy hoặc hơn nếu giả thuyết không đúng; không phải xác suất giả thuyết đúng."],["Khoảng tin cậy (Confidence interval)","Dải giá trị hợp lý cho tham số tổng thể; truyền đạt cả độ lớn lẫn độ bất định tốt hơn một giá trị p đơn lẻ."],["Độ lớn hiệu ứng (Effect size)","Mức độ lớn của khác biệt hoặc quan hệ; có ý nghĩa thống kê chưa chắc có ý nghĩa thực tiễn."],["Biến gây nhiễu (Confounder)","Biến ảnh hưởng tới cả nguyên nhân và kết quả, tạo ra tương quan giả nếu không kiểm soát."],["Bậc thang nhân quả (Ladder of causation)","Ba cấp của Pearl: liên kết (thấy gì), can thiệp (nếu làm gì thì sao), phản thực (nếu đã làm khác thì sao)."]],"diagram":{"type":"layers","items":["Phản thực: nếu đã làm khác thì kết quả ra sao?","Can thiệp: nếu làm X thì Y thay đổi thế nào?","Liên kết: X và Y có đi cùng nhau không?"],"caption":"Bậc thang nhân quả của Pearl: dữ liệu quan sát đơn thuần chỉ trả lời chắc chắn ở bậc dưới cùng."},"model":"Phần lớn báo cáo dashboard ở bậc liên kết nhưng được đọc như bậc can thiệp. Để leo lên bậc can thiệp cần thực nghiệm hoặc phương pháp nhân quả với dữ liệu quan sát như khác biệt trong khác biệt, hồi quy gián đoạn hay biến công cụ, kèm giả định được nêu rõ.","steps":["Xác định câu hỏi thuộc bậc nào: mô tả, dự đoán hay nhân quả.","Với câu hỏi nhân quả, vẽ sơ đồ các biến và tìm biến gây nhiễu tiềm năng.","Chọn phương pháp: thực nghiệm nếu được, nếu không thì phương pháp bán thực nghiệm phù hợp với dữ liệu.","Báo cáo độ lớn hiệu ứng và khoảng tin cậy, không chỉ giá trị p.","Kiểm tra độ nhạy của kết luận với các giả định chính.","Diễn giải bằng ngôn ngữ phù hợp bậc bằng chứng: liên quan tới thay vì gây ra khi chỉ có tương quan."],"apps":[["Khách hàng dùng ứng dụng có số dư cao hơn","Dashboard cho thấy khách hàng dùng ứng dụng di động có số dư trung bình cao hơn. Kết luận rằng đẩy khách dùng ứng dụng sẽ tăng số dư là nhảy từ liên kết sang can thiệp. Thu nhập và độ tuổi có thể là biến gây nhiễu. Một thử nghiệm khuyến khích dùng ứng dụng ngẫu nhiên hóa sẽ trả lời được câu hỏi nhân quả."],["Đánh giá tác động của thay đổi chính sách phí","Ngân hàng áp dụng chính sách miễn phí cho một phân khúc từ một ngày cố định. Dùng khác biệt trong khác biệt với phân khúc tương đồng không được miễn phí giúp ước lượng tác động lên số giao dịch. Đánh đổi: phương pháp dựa vào giả định xu hướng song song, cần kiểm tra bằng dữ liệu trước can thiệp."]],"pitfalls":["Diễn giải giá trị p là xác suất giả thuyết đúng.","Báo cáo có ý nghĩa thống kê mà không nói hiệu ứng lớn bao nhiêu.","Dùng từ gây ra, dẫn tới khi chỉ có dữ liệu tương quan."],"links":[["3.2","Thiết kế thực nghiệm để leo bậc can thiệp"],["4.5","Suy luận Bayes là cách tiếp cận thay thế giá trị p"],["1.5","Sơ đồ nhân quả trong tư duy hệ thống"]],"quiz":[["Giá trị p bằng 0,03 có nghĩa là gì?",["Xác suất giả thuyết không đúng là 3%","Nếu giả thuyết không đúng, xác suất thấy dữ liệu cực đoan như vậy hoặc hơn là 3%","Hiệu ứng lớn 3%","Kết quả đúng với 97% khách hàng"],1,"Giá trị p là xác suất có điều kiện của dữ liệu theo giả thuyết không, không phải xác suất của giả thuyết."],["Theo bậc thang nhân quả của Pearl, câu hỏi nếu tăng hạn mức thẻ thì chi tiêu thay đổi thế nào thuộc bậc nào?",["Liên kết","Can thiệp","Phản thực","Mô tả"],1,"Câu hỏi về tác động của một hành động là câu hỏi can thiệp."],["Biến gây nhiễu là gì?",["Biến bị đo sai","Biến ảnh hưởng tới cả nguyên nhân và kết quả","Biến không liên quan","Biến có nhiều giá trị thiếu"],1,"Biến gây nhiễu tạo ra tương quan giả giữa nguyên nhân và kết quả."]],"refs":["Pearl, J. & Mackenzie, D. (2018). The Book of Why: The New Science of Cause and Effect. Basic Books.","Wasserstein, R. L. & Lazar, N. A. (2016). The ASA Statement on p-Values: Context, Process, and Purpose. The American Statistician, 70(2).","Angrist, J. D. & Pischke, J.-S. (2009). Mostly Harmless Econometrics. Princeton University Press."],"legal":false,"words":967},{"n":7,"title":"Tổng quan hệ thống và phân tích gộp","en":"Systematic Review and Meta-analysis","summary":"Tổng quan hệ thống là cách tổng hợp bằng chứng có quy trình rõ ràng, minh bạch và có thể lặp lại, khác với tổng quan tài liệu truyền thống dễ bị thiên lệch do tác giả chọn nguồn. Phân tích gộp kết hợp định lượng kết quả của nhiều nghiên cứu để ước lượng hiệu ứng tổng. Với người làm thực tiễn, tư duy tổng quan hệ thống giúp đánh giá xem một thực hành tốt được quảng bá có thực sự dựa trên bằng chứng không.","origin":"Archie Cochrane phê phán y học thiếu bằng chứng tổng hợp từ thập niên 1970; Cochrane Collaboration được thành lập năm 1993 để thực hiện tổng quan hệ thống. Gene Glass đặt thuật ngữ meta-analysis năm 1976. Hướng dẫn báo cáo PRISMA ra đời năm 2009 và được cập nhật thành PRISMA 2020. Khung PICO giúp đặt câu hỏi rõ ràng, còn tổng quan nhanh (rapid review) là biến thể phổ biến cho ra quyết định chính sách.","concepts":[["Câu hỏi PICO","Quần thể, Can thiệp, So sánh, Kết quả: bốn thành phần của câu hỏi tổng quan rõ ràng."],["Giao thức tổng quan (Review protocol)","Kế hoạch viết và đăng ký trước, nêu câu hỏi, nguồn tìm kiếm, tiêu chí chọn và phương pháp tổng hợp."],["Đánh giá nguy cơ thiên lệch (Risk of bias assessment)","Đánh giá chất lượng phương pháp của từng nghiên cứu được đưa vào."],["Biểu đồ rừng (Forest plot)","Biểu đồ hiển thị hiệu ứng và khoảng tin cậy của từng nghiên cứu cùng hiệu ứng gộp."],["Thiên lệch xuất bản (Publication bias)","Nghiên cứu có kết quả tích cực dễ được công bố hơn, khiến bằng chứng công bố phóng đại hiệu ứng."]],"diagram":{"type":"flow","items":["Giao thức và câu hỏi PICO","Xác định nguồn và tìm kiếm","Sàng lọc tiêu đề, tóm tắt","Đánh giá toàn văn","Đưa vào tổng hợp"],"caption":"Luồng lựa chọn nghiên cứu theo tinh thần PRISMA 2020, mỗi bước ghi số lượng và lý do loại trừ."},"model":"Giá trị lớn nhất của quy trình không nằm ở biểu đồ đẹp mà ở tính minh bạch: người đọc biết chính xác nguồn nào được tìm, bao nhiêu nghiên cứu bị loại và vì sao, nên có thể đánh giá hoặc lặp lại kết luận.","steps":["Đặt câu hỏi theo PICO và viết giao thức trước khi tìm kiếm.","Tìm kiếm có hệ thống trên nhiều nguồn, ghi lại chuỗi tìm kiếm.","Hai người sàng lọc độc lập theo tiêu chí đã định, giải quyết bất đồng bằng thảo luận.","Trích xuất dữ liệu bằng biểu mẫu chuẩn và đánh giá nguy cơ thiên lệch.","Tổng hợp định lượng nếu các nghiên cứu đủ tương đồng, nếu không thì tổng hợp tường thuật có cấu trúc.","Báo cáo theo PRISMA và đánh giá mức độ chắc chắn của bằng chứng."],"apps":[["Đánh giá bằng chứng trước khi áp dụng một phương pháp quản trị","Trước khi đề xuất áp dụng một khung năng suất đang thịnh hành, PMO thực hiện tổng quan nhanh với câu hỏi PICO rõ ràng. Kết quả cho thấy đa số bằng chứng là nghiên cứu tình huống do nhà cung cấp tài trợ, rất ít nghiên cứu có đối chứng. Kết luận là thí điểm có đánh giá chứ không triển khai đại trà."],["Tổng hợp bài học từ nhiều dự án","Đơn vị có hàng chục báo cáo kết thúc dự án. Áp dụng tư duy tổng quan hệ thống, với tiêu chí chọn rõ ràng và biểu mẫu trích xuất chuẩn, giúp tìm ra các nguyên nhân trễ hạn lặp lại thay vì dựa vào ấn tượng của người tổng hợp. Đánh đổi: tốn công hơn nhiều so với một buổi họp chia sẻ."]],"pitfalls":["Chỉ tìm nguồn ủng hộ quan điểm có sẵn.","Gộp định lượng các nghiên cứu quá khác nhau về quần thể và cách đo.","Bỏ qua thiên lệch xuất bản và bằng chứng chưa công bố."],"links":[["3.6","Hiểu độ lớn hiệu ứng và khoảng tin cậy trong biểu đồ rừng"],["6.6","Tổng hợp bài học có hệ thống"],["4.8","Quyết định dựa trên bằng chứng giảm nhiễu"]],"quiz":[["Chữ C trong PICO là gì?",["Chi phí","So sánh","Bối cảnh","Kết luận"],1,"Population, Intervention, Comparison, Outcome."],["Điểm khác biệt chính giữa tổng quan hệ thống và tổng quan tài liệu truyền thống là gì?",["Số trang dài hơn","Quy trình tìm kiếm và chọn lọc minh bạch, có thể lặp lại","Chỉ dùng bài báo mới","Không cần đọc toàn văn"],1,"Tính hệ thống và minh bạch giảm thiên lệch chọn nguồn."],["Thiên lệch xuất bản làm bằng chứng công bố có xu hướng gì?",["Đánh giá thấp hiệu ứng","Phóng đại hiệu ứng","Không ảnh hưởng","Làm kết quả chính xác hơn"],1,"Nghiên cứu có kết quả tích cực dễ được công bố hơn."]],"refs":["Page, M. J. et al. (2021). The PRISMA 2020 Statement: An Updated Guideline for Reporting Systematic Reviews. BMJ, 372.","Higgins, J. P. T. et al. (Eds.) Cochrane Handbook for Systematic Reviews of Interventions. Cochrane, bản cập nhật định kỳ.","Glass, G. V. (1976). Primary, Secondary, and Meta-Analysis of Research. Educational Researcher, 5(10)."],"legal":false,"words":856},{"n":8,"title":"Nghiên cứu khoa học thiết kế và nghiên cứu hành động","en":"Design Science Research and Action Research","summary":"Hai cách tiếp cận này gần với công việc của BA, kiến trúc sư và PMO nhất vì mục tiêu không chỉ là hiểu mà là tạo ra thay đổi. Nghiên cứu khoa học thiết kế tạo ra và đánh giá các tạo tác như mô hình, phương pháp, hệ thống để giải quyết vấn đề thực tế. Nghiên cứu hành động là chu trình lập kế hoạch, hành động, quan sát và suy ngẫm do chính người trong cuộc thực hiện.","origin":"Kurt Lewin đặt thuật ngữ action research năm 1946. Stephen Kemmis và Robin McTaggart phát triển mô hình xoắn ốc bốn bước. Herbert Simon nền móng cho khoa học của cái nhân tạo trong The Sciences of the Artificial (1969). Alan Hevner, Salvatore March, Jinsoo Park và Sudha Ram đưa ra bảy nguyên tắc nghiên cứu khoa học thiết kế trong hệ thống thông tin năm 2004; Ken Peffers và cộng sự đề xuất quy trình sáu hoạt động năm 2007.","concepts":[["Tạo tác (Artifact)","Sản phẩm của thiết kế: cấu trúc khái niệm, mô hình, phương pháp hoặc hệ thống triển khai."],["Chu trình liên quan và chặt chẽ (Relevance and rigor cycles)","Hevner mô tả tạo tác phải xuất phát từ vấn đề thực tế và dựa trên nền tảng tri thức, đồng thời đóng góp ngược lại cho cả hai."],["Đánh giá tạo tác (Artifact evaluation)","Chứng minh tính hữu ích, chất lượng và hiệu quả của tạo tác bằng phương pháp phù hợp như thực nghiệm, tình huống, mô phỏng."],["Chu trình nghiên cứu hành động (Action research cycle)","Lập kế hoạch, hành động, quan sát, suy ngẫm, lặp lại với hiểu biết mới."],["Người nghiên cứu trong cuộc (Insider researcher)","Người vừa tham gia vừa nghiên cứu tình huống, có lợi thế hiểu bối cảnh nhưng dễ thiên lệch."]],"diagram":{"type":"cycle","items":["Lập kế hoạch","Hành động","Quan sát","Suy ngẫm"],"caption":"Chu trình nghiên cứu hành động; mỗi vòng tạo hiểu biết cho vòng sau.","center":"Vấn đề thực tiễn"},"model":"Quy trình của Peffers gồm: xác định vấn đề, xác định mục tiêu giải pháp, thiết kế và phát triển, trình diễn, đánh giá, truyền đạt. Một bộ công cụ BA, một khung đánh giá kiến trúc hay một thư viện kỹ năng AI nội bộ đều có thể được phát triển theo quy trình này để có bằng chứng về giá trị thay vì chỉ có sản phẩm.","steps":["Mô tả vấn đề thực tế và vì sao giải pháp hiện tại chưa đủ.","Nêu mục tiêu mà tạo tác cần đạt, có thể đo được.","Thiết kế tạo tác dựa trên lý thuyết và thực hành đã có.","Trình diễn trong một tình huống thật hoặc thí điểm.","Đánh giá so với mục tiêu bằng dữ liệu, không chỉ bằng phản hồi cảm tính.","Ghi lại bài học, cải tiến và chia sẻ cho cộng đồng thực hành."],"apps":[["Phát triển bộ mẫu tài liệu BA chuẩn","Nhóm BA xác định vấn đề: tài liệu yêu cầu không đồng nhất, tốn nhiều vòng rà soát. Tạo tác là bộ mẫu và bảng kiểm. Nhóm thí điểm trên ba dự án, đo số vòng rà soát và số lỗi yêu cầu phát hiện ở UAT trước và sau. Đánh giá bằng dữ liệu giúp thuyết phục các nhóm khác áp dụng tốt hơn nhiều so với chỉ giới thiệu sản phẩm."],["Cải tiến quy trình họp sprint bằng nghiên cứu hành động","Trưởng nhóm lập kế hoạch thay đổi cách tổ chức buổi rà soát sprint, áp dụng trong hai sprint, thu thập phản hồi và thời gian họp, rồi cùng nhóm suy ngẫm để điều chỉnh. Đánh đổi: người nghiên cứu trong cuộc dễ nhìn thấy điều mình muốn thấy, nên cần dữ liệu khách quan và góp ý từ người ngoài."]],"pitfalls":["Xây dựng tạo tác mà không đánh giá, coi việc hoàn thành là thành công.","Đánh giá chỉ bằng phản hồi của người thích sản phẩm.","Bỏ qua bước truyền đạt, khiến bài học không được tái sử dụng."],"links":[["1.7","SSM là một dạng nghiên cứu hành động"],["6.6","Suy ngẫm có cấu trúc qua đánh giá sau hành động"],["3.2","Dùng thiết kế thực nghiệm để đánh giá tạo tác"]],"quiz":[["Ai đặt thuật ngữ nghiên cứu hành động năm 1946?",["Herbert Simon","Kurt Lewin","Alan Hevner","Peter Checkland"],1,"Kurt Lewin giới thiệu action research năm 1946."],["Trong nghiên cứu khoa học thiết kế, tạo tác có thể là gì?",["Chỉ phần mềm","Cấu trúc khái niệm, mô hình, phương pháp hoặc hệ thống","Chỉ bài báo","Chỉ dữ liệu"],1,"Hevner và cộng sự liệt kê nhiều loại tạo tác."],["Rủi ro chính của người nghiên cứu trong cuộc là gì?",["Không hiểu bối cảnh","Dễ thiên lệch khi đánh giá","Không có quyền truy cập","Không có dữ liệu"],1,"Hiểu sâu bối cảnh là lợi thế nhưng kèm nguy cơ thiên lệch."]],"refs":["Hevner, A. R., March, S. T., Park, J. & Ram, S. (2004). Design Science in Information Systems Research. MIS Quarterly, 28(1).","Peffers, K. et al. (2007). A Design Science Research Methodology for Information Systems Research. Journal of Management Information Systems, 24(3).","Lewin, K. (1946). Action Research and Minority Problems. Journal of Social Issues, 2(4)."],"legal":false,"words":864}]},{"id":4,"code":"VIII.4","title":"Decision Science","vi":"Khoa học ra quyết định","color":"#7A3E6B","colorDark":"#D08BBE","intro":"Các mô hình chuẩn tắc về cách nên quyết định, bằng chứng về cách con người thực sự quyết định, và công cụ để quyết định tốt hơn trong bất định, đa mục tiêu và nhóm.","question":"Một quyết định tốt được đánh giá bằng kết quả hay bằng quá trình?","chapters":[{"n":1,"title":"Lý thuyết độ hữu dụng kỳ vọng và lựa chọn hợp lý","en":"Expected Utility and Rational Choice","summary":"Lý thuyết độ hữu dụng kỳ vọng là mô hình chuẩn tắc về quyết định trong rủi ro: chọn phương án có trung bình có trọng số xác suất của độ hữu dụng các kết cục cao nhất. Mô hình dựa trên các tiên đề về sở thích nhất quán. Nó là thước đo để nhận ra khi nào quyết định thực tế lệch khỏi hợp lý, và là nền của phân tích quyết định hiện đại.","origin":"Daniel Bernoulli đề xuất độ hữu dụng giảm dần của tiền năm 1738 để giải nghịch lý St. Petersburg. John von Neumann và Oskar Morgenstern tiên đề hóa lý thuyết trong Theory of Games and Economic Behavior (1944). Leonard Savage mở rộng sang xác suất chủ quan năm 1954. Maurice Allais (1953) chỉ ra nghịch lý mang tên ông, cho thấy con người vi phạm tiên đề độc lập. Herbert Simon (1955) đề xuất hợp lý có giới hạn và thỏa mãn thay cho tối ưu hóa, nhận Nobel Kinh tế năm 1978.","concepts":[["Độ hữu dụng kỳ vọng (Expected utility)","Tổng các tích xác suất nhân độ hữu dụng của từng kết cục; tiêu chí chọn phương án trong mô hình chuẩn tắc."],["Ngại rủi ro (Risk aversion)","Ưu tiên kết cục chắc chắn hơn một ván cược có cùng giá trị kỳ vọng, thể hiện qua hàm hữu dụng lõm."],["Tiên đề von Neumann–Morgenstern (vNM axioms)","Đầy đủ, bắc cầu, liên tục và độc lập; thỏa mãn các tiên đề này thì tồn tại hàm hữu dụng biểu diễn sở thích."],["Hợp lý có giới hạn (Bounded rationality)","Con người quyết định với thông tin, thời gian và năng lực tính toán có hạn, nên dùng quy tắc đơn giản thay vì tối ưu hoàn toàn."],["Thỏa mãn (Satisficing)","Chọn phương án đầu tiên đạt ngưỡng chấp nhận được thay vì tìm phương án tốt nhất."]],"diagram":{"type":"flow","items":["Liệt kê phương án","Xác định trạng thái và xác suất","Mô tả kết cục","Gán độ hữu dụng","Chọn phương án có độ hữu dụng kỳ vọng cao nhất"],"caption":"Các bước của mô hình độ hữu dụng kỳ vọng."},"model":"Trong doanh nghiệp, độ hữu dụng thường được xấp xỉ bằng giá trị tiền tệ khi quy mô rủi ro nhỏ so với tổng tài sản. Khi rủi ro có thể đe dọa sự tồn tại, như tổn thất vốn lớn hay vi phạm pháp lý nghiêm trọng, phải tính tới ngại rủi ro thay vì chỉ so sánh giá trị kỳ vọng.","steps":["Xác định rõ quyết định cần đưa ra và các phương án thực sự khả thi.","Liệt kê các trạng thái bất định ảnh hưởng tới kết quả.","Ước lượng xác suất từ dữ liệu hoặc đánh giá chuyên gia có hiệu chỉnh.","Định lượng kết cục, gồm cả chi phí phi tài chính nếu có thể.","Tính giá trị kỳ vọng, sau đó điều chỉnh theo mức ngại rủi ro của tổ chức.","Kiểm tra độ nhạy của lựa chọn với các giả định xác suất quan trọng nhất."],"apps":[["Chọn phương án triển khai hệ thống","Phương án A triển khai một lần với giá trị kỳ vọng cao hơn nhưng có 10% khả năng gián đoạn dịch vụ lớn. Phương án B triển khai theo giai đoạn với giá trị kỳ vọng thấp hơn một chút nhưng rủi ro gián đoạn nhỏ. Vì gián đoạn lớn ảnh hưởng uy tín và có thể bị cơ quan quản lý xem xét, ngân hàng hợp lý khi chọn B dù giá trị kỳ vọng thấp hơn: đây là ngại rủi ro."],["Thỏa mãn trong chọn nhà cung cấp","Khi đánh giá hàng chục nhà cung cấp, nhóm dự án đặt ngưỡng tối thiểu cho từng tiêu chí và chỉ phân tích sâu những nhà cung cấp vượt ngưỡng. Cách làm theo tinh thần thỏa mãn của Simon giúp giảm chi phí phân tích. Đánh đổi: có thể bỏ lỡ nhà cung cấp rất mạnh ở một tiêu chí nhưng hụt ngưỡng ở tiêu chí khác."]],"pitfalls":["So sánh chỉ bằng giá trị kỳ vọng khi có kết cục có thể gây tổn thất không thể phục hồi.","Dùng xác suất đoán mò nhưng trình bày với độ chính xác cao như 37,5%.","Đánh giá quyết định chỉ bằng kết quả, bỏ qua chất lượng quá trình và thông tin tại thời điểm quyết định."],"links":[["4.2","Cách con người lệch khỏi mô hình chuẩn tắc"],["4.3","Cây quyết định là công cụ tính toán độ hữu dụng kỳ vọng"],["2.5","Giới hạn của giá trị kỳ vọng khi phân phối có đuôi dày"]],"quiz":[["Bernoulli đề xuất khái niệm độ hữu dụng giảm dần để giải nghịch lý nào?",["Nghịch lý Allais","Nghịch lý St. Petersburg","Nghịch lý Ellsberg","Nghịch lý Simpson"],1,"Ván cược St. Petersburg có giá trị kỳ vọng vô hạn nhưng không ai trả nhiều tiền để chơi."],["Satisficing theo Simon nghĩa là gì?",["Luôn tối ưu hóa","Chọn phương án đầu tiên đạt ngưỡng chấp nhận được","Chọn ngẫu nhiên","Để nhóm quyết định"],1,"Satisficing ghép từ satisfy và suffice."],["Vì sao một tổ chức có thể chọn phương án có giá trị kỳ vọng thấp hơn một cách hợp lý?",["Vì không biết tính toán","Vì ngại rủi ro khi có kết cục tổn thất nghiêm trọng","Vì giá trị kỳ vọng luôn sai","Vì luật cấm"],1,"Hàm hữu dụng lõm phản ánh ngại rủi ro."]],"refs":["von Neumann, J. & Morgenstern, O. (1944). Theory of Games and Economic Behavior. Princeton University Press.","Savage, L. J. (1954). The Foundations of Statistics. Wiley.","Simon, H. A. (1955). A Behavioral Model of Rational Choice. The Quarterly Journal of Economics, 69(1)."],"legal":false,"words":943},{"n":2,"title":"Thiên kiến và lối tắt nhận thức","en":"Heuristics and Biases","summary":"Con người dùng lối tắt nhận thức để quyết định nhanh trong điều kiện thiếu thông tin. Các lối tắt này thường hữu ích nhưng tạo ra các sai lệch có hệ thống, có thể dự đoán được. Hiểu thiên kiến không làm chúng ta miễn nhiễm, nhưng giúp thiết kế quy trình quyết định chống lại chúng, đặc biệt trong ước lượng dự án, đánh giá rủi ro và thẩm định tín dụng.","origin":"Amos Tversky và Daniel Kahneman công bố bài Judgment under Uncertainty: Heuristics and Biases trên Science năm 1974, mô tả ba lối tắt: tính đại diện, tính sẵn có và mỏ neo. Năm 1979 họ công bố lý thuyết triển vọng trên Econometrica. Kahneman nhận Nobel Kinh tế năm 2002; Tversky mất năm 1996. Cuốn Thinking, Fast and Slow (2011) phổ biến mô hình Hệ 1 và Hệ 2. Gerd Gigerenzer đại diện quan điểm đối trọng, nhấn mạnh tính hợp lý sinh thái của lối tắt.","concepts":[["Hiệu ứng mỏ neo (Anchoring)","Ước lượng bị kéo về con số được đưa ra trước, kể cả khi con số đó không liên quan."],["Lối tắt sẵn có (Availability heuristic)","Đánh giá xác suất theo mức độ dễ nhớ ra ví dụ, nên phóng đại rủi ro vừa được báo chí nói tới."],["Ngại mất mát (Loss aversion)","Nỗi đau mất một khoản lớn hơn niềm vui được cùng khoản đó, trung tâm của lý thuyết triển vọng."],["Ngụy biện lập kế hoạch (Planning fallacy)","Xu hướng đánh giá thấp thời gian, chi phí và rủi ro của nhiệm vụ tương lai, dù biết các dự án tương tự đã trễ."],["Thiên kiến xác nhận (Confirmation bias)","Xu hướng tìm và diễn giải thông tin theo hướng ủng hộ niềm tin có sẵn."],["Chi phí chìm (Sunk cost fallacy)","Tiếp tục đầu tư vào dự án thất bại vì đã bỏ ra nhiều, thay vì đánh giá theo giá trị tương lai."]],"diagram":{"type":"hub","items":["Quyết định dự án","Mỏ neo: ước lượng theo con số đầu tiên","Sẵn có: nhớ sự cố gần nhất","Ngụy biện lập kế hoạch","Thiên kiến xác nhận","Chi phí chìm","Ngại mất mát"],"caption":"Các thiên kiến thường gặp quanh quyết định dự án."},"model":"Kahneman đề xuất góc nhìn bên ngoài (outside view) để chống ngụy biện lập kế hoạch: thay vì ước lượng từ chi tiết của dự án mình, hãy bắt đầu từ phân bố kết quả thực tế của một lớp dự án tương tự, gọi là dự báo lớp tham chiếu, rồi mới điều chỉnh.","steps":["Xác định thiên kiến nào dễ ảnh hưởng nhất tới loại quyết định đang xét.","Dùng góc nhìn bên ngoài: thu thập dữ liệu kết quả của các trường hợp tương tự.","Tách người đưa ra ước lượng ban đầu khỏi người chốt con số để giảm mỏ neo.","Chỉ định người đóng vai phản biện để chống thiên kiến xác nhận.","Đánh giá tiếp tục hay dừng dự án chỉ dựa trên chi phí và lợi ích từ nay về sau.","Ghi nhật ký quyết định để so sánh dự đoán với kết quả sau này."],"apps":[["Ước lượng thời gian dự án bằng lớp tham chiếu","Nhóm dự án ước lượng 6 tháng cho việc thay thế một hệ thống báo cáo. Dữ liệu 10 dự án tương tự trước đó cho thấy trung vị vượt kế hoạch 40%. PMO đề xuất kế hoạch 8 tháng với mốc rà soát sau tháng thứ 3. Đánh đổi: nhà tài trợ không thích con số lớn hơn, nhưng cam kết thực tế giúp giữ uy tín."],["Mỏ neo trong thẩm định tín dụng","Chuyên viên thẩm định nhìn thấy số tiền khách hàng đề nghị trước khi tự đánh giá khả năng trả nợ, nên hạn mức đề xuất có xu hướng bị kéo về con số khách đề nghị. Quy trình tốt hơn là đánh giá năng lực trả nợ độc lập trước, sau đó mới so với đề nghị."]],"pitfalls":["Nghĩ rằng biết về thiên kiến là đủ để tránh chúng.","Dùng thiên kiến như nhãn để bác bỏ ý kiến người khác thay vì cải thiện quy trình.","Tiếp tục dự án vì đã đầu tư nhiều, bỏ qua giá trị tương lai."],"links":[["4.1","Chuẩn hợp lý mà thiên kiến lệch khỏi"],["4.8","Vệ sinh quyết định giảm thiên kiến và nhiễu"],["1.2","Mô hình tư duy là nơi thiên kiến trú ngụ"]],"quiz":[["Góc nhìn bên ngoài được đề xuất để chống thiên kiến nào?",["Ngại mất mát","Ngụy biện lập kế hoạch","Hiệu ứng hào quang","Thiên kiến sống sót"],1,"Dự báo lớp tham chiếu dựa trên kết quả thực tế của các dự án tương tự."],["Lý thuyết triển vọng được Kahneman và Tversky công bố năm nào?",["1974","1979","2002","2011"],1,"Prospect Theory: An Analysis of Decision under Risk, Econometrica 1979."],["Quyết định tiếp tục dự án nên dựa trên điều gì để tránh ngụy biện chi phí chìm?",["Tổng chi phí đã bỏ ra","Chi phí và lợi ích từ nay về sau","Ý kiến của người khởi xướng","Số người tham gia"],1,"Chi phí đã bỏ ra không thể lấy lại nên không liên quan tới quyết định tương lai."]],"refs":["Tversky, A. & Kahneman, D. (1974). Judgment under Uncertainty: Heuristics and Biases. Science, 185(4157).","Kahneman, D. & Tversky, A. (1979). Prospect Theory: An Analysis of Decision under Risk. Econometrica, 47(2).","Kahneman, D. (2011). Thinking, Fast and Slow. Farrar, Straus and Giroux."],"legal":false,"words":908},{"n":3,"title":"Phân tích quyết định: cây quyết định và giá trị thông tin","en":"Decision Analysis: Decision Trees and Value of Information","summary":"Phân tích quyết định là quy trình có cấu trúc để phân rã một quyết định phức tạp thành phương án, bất định và giá trị, rồi tính toán lựa chọn tốt nhất. Cây quyết định là công cụ trực quan cốt lõi. Khái niệm giá trị thông tin hoàn hảo trả lời một câu hỏi rất thực tế: đáng chi bao nhiêu cho thí điểm, khảo sát hay nghiên cứu trước khi quyết định.","origin":"Howard Raiffa phát triển phân tích quyết định tại Harvard, xuất bản Decision Analysis năm 1968. Ronald Howard tại Stanford đặt tên lĩnh vực trong bài báo năm 1966 và phát triển khái niệm giá trị thông tin. Ralph Keeney mở rộng sang quyết định đa mục tiêu và tư duy tập trung vào giá trị trong Value-Focused Thinking (1992). Phân tích độ nhạy dạng biểu đồ lốc xoáy trở thành chuẩn thực hành trong ngành.","concepts":[["Nút quyết định và nút cơ hội (Decision node and chance node)","Nút vuông là lựa chọn của người quyết định; nút tròn là bất định với các nhánh có xác suất."],["Tính ngược (Rollback)","Tính giá trị kỳ vọng từ ngọn cây về gốc, tại mỗi nút quyết định chọn nhánh có giá trị cao nhất."],["Giá trị kỳ vọng của thông tin hoàn hảo (EVPI)","Chênh lệch giữa giá trị kỳ vọng nếu biết trước kết quả bất định và giá trị kỳ vọng khi quyết định ngay; là mức trần nên chi cho thông tin."],["Giá trị kỳ vọng của thông tin mẫu (EVSI)","Giá trị của thông tin không hoàn hảo như thí điểm hay khảo sát, luôn nhỏ hơn hoặc bằng EVPI."],["Biểu đồ lốc xoáy (Tornado diagram)","Biểu đồ phân tích độ nhạy, xếp các biến theo mức ảnh hưởng tới kết quả để biết biến nào đáng tìm hiểu thêm."]],"diagram":{"type":"flow","items":["Quyết định: triển khai ngay hay chờ","Bất định: thành công 60% hay thất bại 40%","Kết cục: +10 tỷ hoặc −4 tỷ","Tính ngược: EV = 4,4 tỷ","EVPI = 6 − 4,4 = 1,6 tỷ"],"caption":"Ví dụ giả lập: nếu biết trước kết quả, ta chỉ triển khai khi thành công, EV = 0,6 × 10 = 6 tỷ; EVPI là 1,6 tỷ."},"model":"Diễn giải EVPI trong ví dụ: không nên chi quá 1,6 tỷ cho bất kỳ thí điểm hay nghiên cứu nào nhằm biết trước kết quả. Vì thí điểm không bao giờ cho thông tin hoàn hảo, mức chi hợp lý thực tế còn thấp hơn. Nếu EVPI rất nhỏ so với chi phí thu thập thông tin, hãy quyết định ngay.","steps":["Viết rõ quyết định, các phương án và tiêu chí đánh giá.","Vẽ cây với nút quyết định, nút cơ hội và kết cục theo thứ tự thời gian.","Gán xác suất và giá trị kết cục, ghi nguồn cho từng con số.","Tính ngược để tìm phương án tốt nhất.","Tính EVPI cho các bất định chính để quyết định có nên thu thập thêm thông tin.","Phân tích độ nhạy và trình bày kết quả cho người quyết định kèm giả định."],"apps":[["Có nên thí điểm trước khi triển khai toàn hàng?","Theo ví dụ trên, triển khai ngay có EV 4,4 tỷ, EVPI 1,6 tỷ. Một thí điểm tại năm chi nhánh tốn 0,5 tỷ và chậm ba tháng. Nếu thí điểm đủ đáng tin để phát hiện đa số trường hợp thất bại, giá trị thông tin mẫu có thể vượt chi phí. Phân tích biến cuộc tranh luận cảm tính về thí điểm thành một phép so sánh có căn cứ."],["Ưu tiên nghiên cứu trong dự án","Biểu đồ lốc xoáy cho thấy tỷ lệ chấp nhận của khách hàng ảnh hưởng tới giá trị dự án nhiều gấp ba lần chi phí phát triển. Nhóm dự án chuyển nguồn lực từ việc ước lượng chi phí chi tiết sang khảo sát khách hàng. Đánh đổi: chấp nhận độ bất định cao hơn ở dự toán chi phí."]],"pitfalls":["Vẽ cây quá chi tiết, làm mất tầm nhìn vào các bất định quan trọng.","Dùng xác suất do người đề xuất dự án tự đặt mà không kiểm tra.","Thu thập thông tin mà không tính giá trị của nó so với chi phí và độ trễ."],"links":[["4.1","Nền tảng lý thuyết độ hữu dụng kỳ vọng"],["4.5","Cập nhật xác suất sau khi có thông tin thí điểm"],["3.2","Thiết kế thí điểm để có thông tin đáng tin"]],"quiz":[["Trong ví dụ, vì sao EV khi có thông tin hoàn hảo là 6 tỷ?",["Vì luôn thành công","Vì chỉ triển khai khi biết sẽ thành công: 0,6 × 10 + 0,4 × 0","Vì cộng 10 và −4","Vì trừ chi phí thí điểm"],1,"Khi biết trước thất bại, ta chọn không triển khai với giá trị 0."],["EVPI có ý nghĩa thực tiễn gì?",["Chi phí dự án","Mức trần nên chi để có thêm thông tin trước khi quyết định","Lợi nhuận tối thiểu","Xác suất thành công"],1,"Không thông tin nào đáng giá hơn thông tin hoàn hảo."],["Ký hiệu hình vuông trên cây quyết định biểu thị gì?",["Nút cơ hội","Nút quyết định","Kết cục","Xác suất"],1,"Vuông là quyết định, tròn là cơ hội, tam giác thường là kết cục."]],"refs":["Raiffa, H. (1968). Decision Analysis: Introductory Lectures on Choices under Uncertainty. Addison-Wesley.","Howard, R. A. (1966). Decision Analysis: Applied Decision Theory. Proceedings of the Fourth International Conference on Operational Research.","Clemen, R. T. (1996). Making Hard Decisions: An Introduction to Decision Analysis (2nd ed.). Duxbury Press."],"legal":false,"words":931},{"n":4,"title":"Ra quyết định đa tiêu chí và AHP","en":"Multi-Criteria Decision Analysis and AHP","summary":"Hầu hết quyết định quan trọng trong tổ chức có nhiều mục tiêu mâu thuẫn: chi phí, rủi ro, thời gian, trải nghiệm khách hàng, tuân thủ. Phân tích quyết định đa tiêu chí (MCDA) giúp làm rõ trọng số, đánh giá phương án một cách minh bạch và làm lộ các đánh đổi. AHP là phương pháp MCDA phổ biến dùng so sánh từng cặp để xác định trọng số.","origin":"Ralph Keeney và Howard Raiffa đặt nền móng lý thuyết độ hữu dụng đa thuộc tính trong Decisions with Multiple Objectives (1976). Thomas Saaty phát triển quy trình phân tích thứ bậc AHP trong thập niên 1970 và xuất bản sách năm 1980. Ching-Lai Hwang và Kwangsun Yoon đề xuất TOPSIS năm 1981. Các phương pháp thuộc họ ELECTRE của Bernard Roy và PROMETHEE của Jean-Pierre Brans là trường phái châu Âu dựa trên quan hệ trội.","concepts":[["Tiêu chí và trọng số (Criteria and weights)","Các khía cạnh đánh giá và tầm quan trọng tương đối của chúng; trọng số phải phản ánh giá trị của tổ chức, không phải của người chấm."],["So sánh cặp (Pairwise comparison)","Trong AHP, so sánh từng cặp tiêu chí trên thang 1–9 để suy ra trọng số, dễ hơn gán trọng số trực tiếp."],["Tỷ số nhất quán (Consistency ratio)","Kiểm tra các so sánh cặp có mâu thuẫn không; Saaty khuyến nghị CR dưới 0,1."],["Phương án bị trội (Dominated alternative)","Phương án kém hơn hoặc bằng một phương án khác ở mọi tiêu chí, có thể loại ngay."],["Đảo hạng (Rank reversal)","Hiện tượng thêm hoặc bớt một phương án làm thay đổi thứ hạng giữa các phương án còn lại, một điểm bị phê phán của AHP."]],"diagram":{"type":"layers","items":["Mục tiêu: chọn nền tảng hệ thống nhân sự","Tiêu chí: chức năng, chi phí sở hữu, bảo mật, khả năng tích hợp, nhà cung cấp","Tiêu chí con: ví dụ bảo mật gồm mã hóa, phân quyền, lưu trữ dữ liệu trong nước","Phương án: nhà cung cấp A, B, C"],"caption":"Cấu trúc thứ bậc AHP: trọng số đi từ trên xuống, điểm đi từ dưới lên."},"model":"Giá trị lớn nhất của MCDA thường không phải con số tổng cuối cùng mà là cuộc thảo luận về trọng số. Khi hai nhóm stakeholder bất đồng về phương án, nguyên nhân thường là họ ngầm dùng trọng số khác nhau; làm lộ trọng số giúp tranh luận đúng chỗ.","steps":["Xác định mục tiêu và các phương án ban đầu.","Xây cây tiêu chí đầy đủ, không trùng lặp, đo được.","Thống nhất trọng số với người có thẩm quyền trước khi chấm điểm phương án.","Chấm điểm từng phương án theo từng tiêu chí dựa trên bằng chứng, tốt nhất là chấm độc lập.","Tổng hợp, loại phương án bị trội và phân tích độ nhạy của trọng số.","Trình bày đánh đổi chính, không chỉ trình bày điểm tổng."],"apps":[["Chọn nhà cung cấp phần mềm","Hội đồng đánh giá ba nhà cung cấp với năm tiêu chí. Phân tích độ nhạy cho thấy thứ hạng chỉ đổi khi trọng số chi phí tăng từ 25% lên trên 40%. Thông tin này giúp ban điều hành quyết định nhanh vì biết lựa chọn vững trước các thay đổi trọng số hợp lý. Đánh đổi: quy trình tốn thêm vài buổi họp so với chấm điểm cảm tính."],["Ưu tiên danh mục dự án","PMO dùng MCDA với tiêu chí giá trị kinh doanh, tuân thủ quy định, rủi ro và mức độ sẵn sàng. Các dự án bắt buộc về tuân thủ được xử lý như ràng buộc chứ không phải tiêu chí, tránh việc một dự án tuân thủ bị xếp hạng thấp vì giá trị kinh doanh thấp."]],"pitfalls":["Chấm điểm phương án trước rồi điều chỉnh trọng số để ra kết quả mong muốn.","Đưa ràng buộc bắt buộc vào như tiêu chí có trọng số.","Đếm cùng một yếu tố hai lần qua hai tiêu chí chồng lấn."],"links":[["4.8","Chấm điểm độc lập giảm nhiễu trong hội đồng"],["5.6","Xung đột lợi ích trong đánh giá nhà cung cấp"],["1.8","Đánh giá các can thiệp hệ thống"]],"quiz":[["Saaty khuyến nghị tỷ số nhất quán trong AHP ở mức nào?",["Dưới 0,1","Trên 0,5","Bằng 1","Không quan trọng"],0,"CR dưới 0,1 được coi là mức mâu thuẫn chấp nhận được."],["Yêu cầu tuân thủ bắt buộc nên được xử lý thế nào trong MCDA?",["Là tiêu chí có trọng số thấp","Là ràng buộc loại trừ phương án không đạt","Bỏ qua","Là tiêu chí có trọng số cao nhất"],1,"Ràng buộc bắt buộc không được đánh đổi với tiêu chí khác."],["Phương án bị trội là gì?",["Phương án có điểm cao nhất","Phương án kém hơn hoặc bằng một phương án khác ở mọi tiêu chí","Phương án rẻ nhất","Phương án được sếp chọn"],1,"Có thể loại phương án bị trội mà không cần trọng số."]],"refs":["Keeney, R. L. & Raiffa, H. (1976). Decisions with Multiple Objectives: Preferences and Value Tradeoffs. Wiley.","Saaty, T. L. (1980). The Analytic Hierarchy Process. McGraw-Hill.","Hwang, C.-L. & Yoon, K. (1981). Multiple Attribute Decision Making: Methods and Applications. Springer."],"legal":false,"words":866},{"n":5,"title":"Suy luận Bayes","en":"Bayesian Reasoning","summary":"Suy luận Bayes là cách cập nhật niềm tin một cách nhất quán khi có bằng chứng mới: niềm tin hậu nghiệm tỷ lệ với niềm tin tiên nghiệm nhân khả năng quan sát bằng chứng. Nó giúp tránh một trong những lỗi tốn kém nhất trong ngân hàng là bỏ qua tỷ lệ nền, ví dụ tin rằng một cảnh báo gian lận có độ chính xác cao nghĩa là đa số cảnh báo đều đúng.","origin":"Thomas Bayes để lại bài luận được Richard Price công bố năm 1763. Pierre-Simon Laplace phát triển độc lập và tổng quát hóa quy tắc này. Trong thế kỷ 20, trường phái tần suất chiếm ưu thế, nhưng Bayes được dùng trong giải mã Enigma, tìm kiếm tàu ngầm và bảo hiểm. Cuốn The Theory That Would Not Die của Sharon Bertsch McGrayne (2011) kể lại lịch sử này. Phương pháp tính toán MCMC từ thập niên 1990 giúp Bayes trở nên phổ biến trong thống kê ứng dụng.","concepts":[["Xác suất tiên nghiệm (Prior)","Niềm tin về một giả thuyết trước khi thấy bằng chứng mới, như tỷ lệ gian lận nền trong tổng giao dịch."],["Khả năng (Likelihood)","Xác suất quan sát được bằng chứng nếu giả thuyết đúng, như tỷ lệ mô hình cảnh báo khi giao dịch thật sự gian lận."],["Xác suất hậu nghiệm (Posterior)","Niềm tin đã cập nhật sau khi kết hợp tiên nghiệm và bằng chứng."],["Bỏ qua tỷ lệ nền (Base rate neglect)","Lỗi tập trung vào độ chính xác của bằng chứng mà quên sự hiếm của hiện tượng."],["Tần suất tự nhiên (Natural frequencies)","Trình bày xác suất dưới dạng số đếm như 99 trên 100.000 giao dịch, giúp người không chuyên hiểu đúng."]],"diagram":{"type":"cycle","items":["Niềm tin tiên nghiệm","Thu thập bằng chứng","Tính khả năng của bằng chứng","Niềm tin hậu nghiệm","Hành động và quan sát kết quả"],"caption":"Chu trình cập nhật Bayes: hậu nghiệm hôm nay là tiên nghiệm cho lần cập nhật sau.","center":"P(H|E) ∝ P(E|H) × P(H)"},"model":"Ví dụ giả lập: tỷ lệ gian lận nền 0,1%, mô hình phát hiện đúng 99% giao dịch gian lận và cảnh báo nhầm 2% giao dịch bình thường. Trên 100.000 giao dịch có 100 gian lận, 99 được cảnh báo; 99.900 giao dịch bình thường có khoảng 1.998 cảnh báo nhầm. Vậy chỉ khoảng 99 / 2.097, tức 4,7% cảnh báo là gian lận thật.","steps":["Xác định giả thuyết cần đánh giá và tỷ lệ nền từ dữ liệu.","Ước lượng độ nhạy và tỷ lệ báo động giả của bằng chứng.","Tính hậu nghiệm, tốt nhất trình bày bằng tần suất tự nhiên.","Kiểm tra xem hậu nghiệm có đủ để hành động hay cần thêm bằng chứng.","Khi có bằng chứng độc lập mới, cập nhật tiếp từ hậu nghiệm hiện tại.","Theo dõi sự thay đổi tỷ lệ nền theo thời gian và phân khúc."],"apps":[["Thiết kế quy trình xử lý cảnh báo gian lận","Với tỷ lệ cảnh báo đúng chỉ khoảng 4,7%, chặn giao dịch tự động theo mọi cảnh báo sẽ gây phiền cho khoảng 95% khách hàng bị cảnh báo. Quy trình hợp lý là xác minh nhẹ như gửi OTP hoặc gọi xác nhận với cảnh báo mức thấp và chỉ chặn khi có thêm tín hiệu độc lập. Đánh đổi: tăng chi phí vận hành của đội xác minh."],["Diễn giải kết quả kiểm thử tự động","Một bộ kiểm thử báo lỗi ở 3% lần chạy dù code không lỗi. Khi tỷ lệ commit thực sự có lỗi thấp, phần lớn lần báo đỏ là nhiễu, khiến đội phát triển mất niềm tin và bỏ qua cả lỗi thật. Giảm tỷ lệ báo động giả quan trọng hơn tăng thêm độ nhạy."]],"pitfalls":["Nhầm độ nhạy của bằng chứng với xác suất giả thuyết đúng.","Dùng tỷ lệ nền của toàn bộ khách hàng cho một phân khúc có tỷ lệ nền rất khác.","Cập nhật nhiều lần với các bằng chứng thực chất không độc lập, làm niềm tin tăng quá mức."],"links":[["3.6","So sánh với cách tiếp cận giá trị p"],["5.4","Tỷ lệ báo động giả khác nhau giữa các nhóm là vấn đề công bằng"],["2.4","Kết hợp tín hiệu mạng lưới làm bằng chứng độc lập"]],"quiz":[["Trong ví dụ, vì sao chỉ khoảng 4,7% cảnh báo là gian lận thật dù mô hình phát hiện đúng 99%?",["Vì mô hình sai","Vì gian lận rất hiếm nên số cảnh báo nhầm lớn hơn nhiều số gian lận thật","Vì dữ liệu thiếu","Vì tính sai"],1,"Tỷ lệ nền thấp khiến cảnh báo nhầm chiếm đa số."],["Trình bày bằng tần suất tự nhiên giúp gì?",["Tính nhanh hơn trên máy","Người không chuyên hiểu đúng xác suất có điều kiện","Tăng độ chính xác mô hình","Giảm tỷ lệ nền"],1,"Số đếm cụ thể giúp tránh bỏ qua tỷ lệ nền."],["Ai công bố bài luận của Bayes năm 1763?",["Laplace","Richard Price","Fisher","Pascal"],1,"Richard Price biên tập và công bố sau khi Bayes mất."]],"refs":["Bayes, T. (1763). An Essay towards Solving a Problem in the Doctrine of Chances. Philosophical Transactions of the Royal Society of London, 53.","McGrayne, S. B. (2011). The Theory That Would Not Die. Yale University Press.","Gigerenzer, G. & Hoffrage, U. (1995). How to Improve Bayesian Reasoning without Instruction: Frequency Formats. Psychological Review, 102(4)."],"legal":false,"words":895},{"n":6,"title":"Quyết định trong bất định: kịch bản và quyền chọn thực","en":"Decisions under Uncertainty: Scenarios and Real Options","summary":"Khi không thể gán xác suất đáng tin cho các khả năng, công cụ phân tích rủi ro truyền thống mất tác dụng. Hoạch định kịch bản giúp chuẩn bị cho nhiều tương lai hợp lý thay vì đặt cược vào một dự báo. Tư duy quyền chọn thực giúp thiết kế đầu tư theo giai đoạn để giữ khả năng mở rộng, trì hoãn hoặc từ bỏ khi bất định dần sáng tỏ.","origin":"Frank Knight (1921) phân biệt rủi ro, nơi xác suất đo được, với bất định, nơi không thể đo. Herman Kahn tại RAND phát triển tư duy kịch bản trong thập niên 1950. Pierre Wack tại Shell dẫn dắt nhóm kịch bản giúp công ty chuẩn bị cho cú sốc dầu mỏ năm 1973, được mô tả trong hai bài trên Harvard Business Review năm 1985. Peter Schwartz viết The Art of the Long View (1991). Stewart Myers đặt thuật ngữ quyền chọn thực năm 1977.","concepts":[["Rủi ro và bất định Knight (Risk versus Knightian uncertainty)","Rủi ro có phân bố xác suất đo được; bất định không có cơ sở để gán xác suất."],["Bất định then chốt (Critical uncertainty)","Yếu tố vừa có tác động lớn vừa có độ bất định cao, dùng làm trục của ma trận kịch bản."],["Chiến lược vững (Robust strategy)","Chiến lược cho kết quả chấp nhận được trong nhiều kịch bản, thay vì tối ưu cho một kịch bản."],["Quyền chọn thực (Real option)","Quyền, không phải nghĩa vụ, thực hiện một quyết định kinh doanh trong tương lai như mở rộng, trì hoãn, từ bỏ."],["Chỉ báo tín hiệu (Signpost)","Dấu hiệu sớm cho thấy thế giới đang đi theo kịch bản nào, gắn với hành động đã chuẩn bị sẵn."]],"diagram":{"type":"matrix","items":["Quy định chặt, khách hàng chấp nhận chậm: tuân thủ trước, số hóa thận trọng","Quy định chặt, khách hàng chấp nhận nhanh: đầu tư mạnh vào quản trị AI","Quy định lỏng, khách hàng chấp nhận chậm: thí điểm nhỏ, giữ quyền chọn","Quy định lỏng, khách hàng chấp nhận nhanh: cạnh tranh tốc độ"],"caption":"Ma trận kịch bản giả lập cho chiến lược trợ lý AI của một ngân hàng, dựa trên hai bất định then chốt.","axes":{"x":["Tốc độ khách hàng chấp nhận AI","Chậm","Nhanh"],"y":["Mức độ chặt chẽ của quy định","Lỏng","Chặt"]}},"model":"Kịch bản không phải dự báo. Giá trị của chúng nằm ở việc kiểm tra kế hoạch hiện tại trong từng thế giới: phần nào của kế hoạch vững trong cả bốn góc, phần nào chỉ đúng trong một góc, và cần theo dõi chỉ báo nào để biết thế giới đang dịch chuyển.","steps":["Xác định câu hỏi chiến lược và khung thời gian.","Liệt kê các động lực thay đổi và phân loại theo tác động và độ bất định.","Chọn hai bất định then chốt độc lập làm trục ma trận.","Viết câu chuyện cho bốn kịch bản, đặt tên dễ nhớ.","Kiểm tra chiến lược hiện tại trong từng kịch bản, tìm hành động vững và quyền chọn cần giữ.","Xác định chỉ báo tín hiệu và hành động kích hoạt tương ứng."],"apps":[["Đầu tư nền tảng theo giai đoạn","Thay vì cam kết toàn bộ ngân sách cho một nền tảng mới, ngân hàng thiết kế giai đoạn 1 là lớp tích hợp dùng chung, có giá trị trong mọi kịch bản. Giai đoạn 2 chỉ kích hoạt khi chỉ báo cho thấy nhu cầu tăng. Đây là quyền chọn mở rộng. Đánh đổi: tổng chi phí có thể cao hơn một chút nếu cuối cùng phải làm toàn bộ, nhưng giảm mạnh rủi ro đầu tư vô ích."],["Chuẩn bị cho thay đổi quy định","Nhóm tuân thủ và công nghệ xây kịch bản về lộ trình hướng dẫn thi hành các luật mới liên quan dữ liệu và AI. Kiến trúc được thiết kế để phân loại dữ liệu và ghi nhật ký truy cập ngay từ đầu, một hành động vững trong mọi kịch bản quy định."]],"pitfalls":["Gán xác suất cho kịch bản rồi chỉ lập kế hoạch cho kịch bản có xác suất cao nhất.","Chọn hai trục có tương quan, khiến hai góc của ma trận không hợp lý.","Viết kịch bản xong rồi cất đi, không gắn với chỉ báo và hành động."],"links":[["2.7","Kịch bản phù hợp với vùng phức hợp"],["2.3","Khi tầm dự báo ngắn, cần kịch bản thay dự báo"],["5.4","Ví dụ về bất định quy định AI"]],"quiz":[["Knight phân biệt rủi ro với bất định dựa trên tiêu chí nào?",["Mức tổn thất","Có thể đo được phân bố xác suất hay không","Thời gian","Ngành nghề"],1,"Rủi ro đo được xác suất; bất định thì không."],["Hai trục của ma trận kịch bản nên được chọn thế nào?",["Hai yếu tố chắc chắn nhất","Hai bất định then chốt, tác động lớn và tương đối độc lập","Hai chỉ tiêu tài chính","Hai yếu tố tương quan mạnh"],1,"Trục phải là bất định lớn và độc lập để bốn góc đều hợp lý."],["Chia đầu tư thành giai đoạn với điểm quyết định mở rộng là ví dụ của khái niệm gì?",["Chi phí chìm","Quyền chọn thực","Ngại mất mát","Cân bằng Nash"],1,"Giai đoạn đầu mua quyền, không phải nghĩa vụ, đầu tư tiếp."]],"refs":["Knight, F. H. (1921). Risk, Uncertainty and Profit. Houghton Mifflin.","Wack, P. (1985). Scenarios: Uncharted Waters Ahead. Harvard Business Review, 63(5).","Schwartz, P. (1991). The Art of the Long View. Doubleday
